<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dự đoán tương lai AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);padding:28px;border-radius:20px;max-width:420px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
input,select,button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;font-size:16px}
button{background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer}
#loading,#result{display:none;text-align:center}
.spinner{width:70px;height:70px;border:8px solid #555;border-top-color:#fff;border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#result{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column}
#msg{font-size:min(9vw,72px);font-weight:900;color:#ff2d55;text-align:center;animation:pulse .8s infinite}
small{margin-top:20px;color:#ddd}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="card" id="form">
<h2>🔮 AI Dự Đoán Tương Lai</h2>
<p>Nhập thông tin để AI phân tích tương lai của bạn.</p>
<input placeholder="Họ và tên">
<input type="date">
<select>
<option>Nam</option>
<option>Nữ</option>
<option>Khác</option>
</select>
<input placeholder="Nghề nghiệp">
<button onclick="run()">🔍 Phân tích</button>
</div>

<div id="loading">
<div class="card">
<h2>Đang quét vận mệnh...</h2>
<div class="spinner"></div>
<p id="step">Đang kết nối AI...</p>
</div>
</div>

<div id="result">
<div id="msg">CÓ CÁI CON CẮK</div>
<small>😂 Bạn vừa bị troll!</small>
</div>

<script>
const steps=[
"Đang kết nối AI lượng tử...",
"Đọc chỉ tay bằng camera...",
"Đồng bộ vũ trụ...",
"Phân tích vận mệnh...",
"Tính xác suất thành công...",
"Hoàn tất!"
];
function run(){
document.getElementById("form").style.display="none";
document.getElementById("loading").style.display="block";
let i=0;
const t=setInterval(()=>{
document.getElementById("step").textContent=steps[i];
i++;
if(i===steps.length){
clearInterval(t);
setTimeout(()=>{
document.getElementById("loading").style.display="none";
document.getElementById("result").style.display="flex";
},700);
}
},900);
}
</script>
</body>
</html>
