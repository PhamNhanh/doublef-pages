<style id="mobile-responsive-fix">

/* =========================================================
   FIX RESPONSIVE MOBILE
   Dán đoạn này ngay trước </head>
   ========================================================= */

@media (max-width: 980px) {

  /* Không cho toàn trang tràn ngang */
  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  /* QUAN TRỌNG:
     Bỏ grid desktop khi chuyển sang mobile */
  .app {
    display: block !important;
    grid-template-columns: none !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }

  /* Nội dung chính chiếm toàn màn hình */
  main {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;

    padding:
      16px
      16px
      calc(84px + env(safe-area-inset-bottom));
  }

  /* Container không được vượt màn hình */
  .container {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0 auto;
  }

  /* Sidebar chuyển thành menu trượt */
  aside {
    position: fixed !important;

    left: 0;
    top: 0;
    bottom: 0;

    width: min(86vw, 310px) !important;
    max-width: 310px;

    height: 100dvh;

    transform: translateX(-105%);
    transition: transform .25s ease;

    z-index: 50;

    overflow-y: auto;
    overscroll-behavior: contain;

    padding-top:
      calc(20px + env(safe-area-inset-top));

    padding-bottom:
      calc(20px + env(safe-area-inset-bottom));
  }

  body.sidebar-open aside {
    transform: translateX(0);
  }

  /* Overlay phía sau menu */
  .backdrop {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(15, 23, 42, .48);
    backdrop-filter: blur(3px);

    z-index: 40;
  }

  body.sidebar-open .backdrop {
    display: block;
  }

  /* Hiện nút menu mobile */
  .mobile-menu {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
  }

  /* TOP BAR */
  .topbar {
    width: 100%;
    max-width: 100%;

    top: 8px;

    flex-wrap: nowrap;

    overflow: hidden;
  }

  .topbar > div:not(.actions) {
    min-width: 0;
    flex: 1;
  }

  .topbar h1 {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .actions {
    flex: none;
    margin-left: auto;
    flex-wrap: nowrap;
  }

  /* HERO */
  .hero {
    width: 100%;
    max-width: 100%;

    grid-template-columns: minmax(0, 1fr) !important;

    overflow: hidden;
  }

  .hero > * {
    min-width: 0;
  }

  .hero h2 {
    max-width: 100%;

    overflow-wrap: anywhere;
    word-break: normal;
  }

  .hero p {
    max-width: 100%;
  }

  .hero-panel {
    width: 100%;
    max-width: 100%;
  }

  /* TOOLBAR */
  .toolbar {
    width: 100%;
    max-width: 100%;
  }

  .toolbar-left {
    min-width: 0;
    flex: 1;
  }

  .select {
    max-width: 100%;
  }

  /* PANEL */
  .panel {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .panel-head,
  .panel-body {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  /* Danh sách ứng dụng */
  .menu {
    width: 100%;
    max-width: 100%;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .app-card {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .app-info {
    min-width: 0;
  }

  .app-title {
    max-width: 100%;
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 680px) {

  main {
    padding:
      10px
      10px
      calc(76px + env(safe-area-inset-bottom)) !important;
  }

  .container {
    gap: 12px;
  }

  /* =============================
     TOPBAR
     ============================= */

  .topbar {
    min-height: 58px;

    padding: 8px;

    border-radius: 12px;

    gap: 7px;
  }

  .mobile-menu {
    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    padding: 0 !important;

    font-size: 20px;
  }

  .topbar h1 {
    font-size: 14px;
  }

  .topbar p {
    display: none;
  }

  .actions {
    gap: 5px;
  }

  .actions .btn {
    min-height: 42px;

    padding: 8px 10px;

    border-radius: 10px;
  }

  /* Ẩn chế độ theme trên mobile */
  .actions .hide-sm {
    display: none;
  }

  /* Nút tìm kiếm chỉ hiện icon */
  #cmdBtn {
    width: 42px;
    height: 42px;

    padding: 0;

    overflow: hidden;

    font-size: 0;
  }

  #cmdBtn::before {
    content: "⌕";

    display: block;

    font-size: 24px;
    line-height: 1;
  }

  /* Ẩn đồng bộ trên điện thoại */
  #reloadBtn {
    display: none;
  }


  /* =============================
     HERO
     ============================= */

  .hero {
    padding: 20px 18px;

    border-radius: 14px;

    min-height: 0;
  }

  .hero h2 {
    margin: 0;

    font-size: clamp(28px, 9vw, 38px);

    line-height: 1.08;

    letter-spacing: -.045em;
  }

  .hero p {
    margin-top: 14px;

    font-size: 13px;

    line-height: 1.6;
  }

  .hero-panel {
    margin-top: 4px;

    padding: 16px;

    border-radius: 12px;

    min-height: 0;
  }

  .hero-num {
    font-size: 40px;
  }

  .mini-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .mini {
    min-width: 0;
  }


  /* =============================
     TOOLBAR
     ============================= */

  .toolbar {
    display: grid;

    grid-template-columns: 1fr;

    gap: 8px;

    padding: 10px;

    border-radius: 12px;
  }

  .toolbar-left {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    width: 100%;

    gap: 8px;
  }

  .select {
    width: 100%;

    min-width: 0;

    /* Tránh Safari zoom khi bấm */
    font-size: 16px;
  }

  .view {
    display: flex;

    width: 100%;
  }

  .view button {
    flex: 1;

    min-height: 40px;
  }


  /* =============================
     APP LIST
     ============================= */

  .menu {
    grid-template-columns: 1fr !important;

    gap: 10px;
  }

  .panel {
    border-radius: 12px;
  }

  .panel-head {
    padding: 16px 14px 0;
  }

  .panel-body {
    padding: 14px;
  }

  .app-card {
    min-height: 0;

    padding: 14px;

    border-radius: 12px;

    gap: 12px;
  }

  .app-icon {
    width: 48px;
    height: 48px;

    flex: 0 0 48px;

    border-radius: 11px;
  }

  .app-title {
    font-size: 14px;

    /*
      Cho phép tên dài xuống dòng
      thay vì bị cắt ...
    */
    white-space: normal;

    overflow: visible;

    text-overflow: clip;

    line-height: 1.35;

    overflow-wrap: anywhere;
  }

  .app-desc {
    min-height: 0;

    font-size: 12px;

    line-height: 1.5;
  }

  /* Mobile không cần hiện đường dẫn */
  .app-path {
    display: none;
  }

  .card-bottom {
    margin-top: 9px;
  }

  .fav {
    width: 40px;
    height: 40px;

    border-radius: 10px;

    font-size: 18px;
  }


  /* =============================
     SEARCH COMMAND
     Dạng bottom sheet trên mobile
     ============================= */

  .cmdk {
    align-items: flex-end;

    padding:
      0
      0
      env(safe-area-inset-bottom);
  }

  .cmdk-box {
    width: 100%;
    max-width: 100%;

    max-height: 82dvh;

    border-radius:
      20px
      20px
      0
      0;
  }

  .cmdk-top {
    padding: 12px;
  }

  .cmdk-top input {
    width: 100%;

    min-height: 48px;

    /*
       Quan trọng:
       iPhone Safari sẽ không tự zoom
       khi font >= 16px
    */
    font-size: 16px;
  }

  .cmdk-list {
    max-height: 60dvh;
  }

  .cmdk-item {
    min-height: 58px;
  }

  .cmdk-foot {
    padding-bottom:
      calc(
        11px +
        env(safe-area-inset-bottom)
      );
  }


  /* =============================
     SEARCH SIDEBAR
     ============================= */

  .search input {
    font-size: 16px;
  }


  /* =============================
     TOAST
     ============================= */

  .toast {
    left: 10px;
    right: 10px;

    bottom:
      calc(
        10px +
        env(safe-area-inset-bottom)
      );
  }

  .toast-item {
    width: 100%;
  }
}


/* =========================================================
   ĐIỆN THOẠI RẤT NHỎ
   ========================================================= */

@media (max-width: 430px) {

  .toolbar-left {
    grid-template-columns: 1fr;
  }

  .hero h2 {
    font-size: 29px;
  }

  .hero {
    padding:
      20px
      16px;
  }

  .hero-panel {
    padding: 14px;
  }

  .mini-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .app-card {
    padding: 12px;
  }

  .app-icon {
    width: 44px;
    height: 44px;

    flex-basis: 44px;
  }
}

</style>
