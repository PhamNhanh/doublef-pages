</style></head><body><div id="app" class="page-loading">Đang khởi tạo hệ thống...</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const DF={url:"https://aizhygivtngtsqcjtvaj.supabase.co",key:"sb_publishable_T5kmdBx5e9EdE7WMxj3J4w_BWiJi8MN",bucket:"test-evidence"};
const sb=supabase.createClient(DF.url,DF.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const ROLE_LABEL={admin:"Quản trị viên",manager:"Quản lý dự án",tester:"Kiểm thử viên",viewer:"Người xem"};
const NAV=[
 ["dashboard","/kiem-thu/","⌂","Tổng quan"],
 ["projects","/kiem-thu/du-an","▣","Dự án"],
 ["plans","/kiem-thu/ke-hoach","▤","Kế hoạch kiểm thử"],
 ["usecases","/kiem-thu/usecase","◇","Use Case"],
 ["testcases","/kiem-thu/test-case","✓","Test Case & Kịch bản"],
 ["execute","/kiem-thu/thuc-hien","▶","Thực hiện kiểm thử"],
 ["defects","/kiem-thu/loi","!","Quản lý Bug"],
 ["reports","/kiem-thu/bao-cao","▥","Báo cáo"],
 ["members","/kiem-thu/thanh-vien","♙","Thành viên"]
];
function e(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtDate(v){if(!v)return "—";const d=new Date(v.length===10?v+"T00:00:00":v);return isNaN(d)?"—":d.toLocaleDateString("vi-VN")}
function fmtDateTime(v){if(!v)return "—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("vi-VN")}
function initials(n){const a=String(n||"U").trim().split(/\s+/);return (a.length>1?a[a.length-2][0]+a[a.length-1][0]:a[0].slice(0,2)).toUpperCase()}
function badge(v){const s=String(v||"").toLowerCase().replaceAll(" ","_");return `<span class="badge ${e(s)}">${e(v||"—")}</span>`}
function toast(msg,bad=false){let x=document.getElementById("dfToast");if(!x){x=document.createElement("div");x.id="dfToast";document.body.appendChild(x)}x.className="toast"+(bad?" bad":"");x.textContent=msg;requestAnimationFrame(()=>x.classList.add("show"));setTimeout(()=>x.classList.remove("show"),2800)}
function errMsg(error){return error?.message||String(error||"Có lỗi xảy ra")}
async function requireAuth(){const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace("/kiem-thu/login");return null}const {data:profile,error:pe}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(pe||!profile||profile.active===false){await sb.auth.signOut();location.replace("/kiem-thu/login");return null}return {session,user:session.user,profile}}
async function visibleProjects(){const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function projectRole(projectId,userId){if(!projectId)return null;const {data}=await sb.from("project_members").select("role").eq("project_id",projectId).eq("user_id",userId).maybeSingle();return data?.role||null}
function canManage(ctx){return ctx.profile.role==="admin"||ctx.projectRole==="manager"}
function canTest(ctx){return ctx.profile.role==="admin"||["manager","tester"].includes(ctx.projectRole)}
async function logout(){await sb.auth.signOut();location.replace("/kiem-thu/login")}
function navHtml(active){return NAV.map((n,i)=>`${i===0?'<div class="nav-group">Quản lý kiểm thử</div>':''}<a class="${n[0]===active?'active':''}" href="${n[1]}"><span class="ico">${n[2]}</span><span>${n[3]}</span></a>`).join("")}
function shell(active,title,ctx){const projectOptions=ctx.projects.length?ctx.projects.map(p=>`<option value="${p.id}" ${p.id===ctx.projectId?'selected':''}>${e(p.project_code)} - ${e(p.project_name)}</option>`).join(""):'<option value="">Chưa có dự án</option>';document.getElementById("app").className="app";document.getElementById("app").innerHTML=`<div id="overlay" class="overlay"></div><aside id="sidebar" class="sidebar"><div class="brand"><div class="brand-logo">DF</div><div><strong>DoubleF Test</strong><small>Project Test Management</small></div></div><nav class="nav">${navHtml(active)}</nav><div class="side-user"><div class="avatar">${e(initials(ctx.profile.full_name||ctx.user.email))}</div><div><strong>${e(ctx.profile.full_name||ctx.user.email)}</strong><small>${e(ROLE_LABEL[ctx.profile.role]||ctx.profile.role)}</small></div></div></aside><div class="main"><header class="topbar"><div class="top-left"><button id="menuBtn" class="btn menu-btn">☰</button><div><strong>${e(title)}</strong><small>${ctx.projectId?'Đang làm việc trong dự án đã chọn':'Chọn dự án để làm việc'}</small></div></div><div class="top-actions"><select id="projectSelect" class="project-select">${projectOptions}</select><span class="user-meta"><strong style="font-size:10.5px">${e(ctx.profile.full_name||ctx.user.email)}</strong></span><button id="logoutBtn" class="btn">Đăng xuất</button></div></header><main id="pageContent" class="content"><div class="loading">Đang tải dữ liệu...</div></main></div>`;document.getElementById("logoutBtn").onclick=logout;const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("overlay");document.getElementById("menuBtn").onclick=()=>{sidebar.classList.add("open");overlay.classList.add("show")};overlay.onclick=()=>{sidebar.classList.remove("open");overlay.classList.remove("show")};document.getElementById("projectSelect").onchange=ev=>{localStorage.setItem("df_project_id",ev.target.value);location.reload()}}
async function boot(active,title,{projectRequired=true}={}){try{const auth=await requireAuth();if(!auth)return null;const projects=await visibleProjects();let projectId=localStorage.getItem("df_project_id");if(!projects.some(p=>p.id===projectId))projectId=projects[0]?.id||"";if(projectId)localStorage.setItem("df_project_id",projectId);const pr=projectId?await projectRole(projectId,auth.user.id):null;const ctx={...auth,projects,projectId,project:projects.find(p=>p.id===projectId)||null,projectRole:pr};shell(active,title,ctx);if(projectRequired&&!projectId){document.getElementById("pageContent").innerHTML='<div class="notice">Chưa có dự án. Hãy tạo dự án trước.</div>';return null}return ctx}catch(error){document.getElementById("app").innerHTML=`<div class="error" style="margin:30px">${e(errMsg(error))}</div>`;return null}}
function openModal(title,body){closeModal();const b=document.createElement("div");b.id="dfModal";b.className="modal-backdrop";b.innerHTML=`<div class="modal"><div class="modal-head"><h3>${e(title)}</h3><button class="btn sm" id="modalClose">Đóng</button></div><div class="modal-body">${body}</div></div>`;document.body.appendChild(b);document.getElementById("modalClose").onclick=closeModal;b.addEventListener("click",ev=>{if(ev.target===b)closeModal()})}
function closeModal(){document.getElementById("dfModal")?.remove()}
function tcResultMap(testCases,scenarios,executions){const latest=new Map();[...(executions||[])].sort((a,b)=>new Date(b.completed_at||b.created_at)-new Date(a.completed_at||a.created_at)).forEach(x=>{if(!latest.has(x.scenario_id))latest.set(x.scenario_id,x)});const map=new Map();for(const tc of testCases||[]){const ss=(scenarios||[]).filter(s=>s.test_case_id===tc.id&&s.active!==false);if(!ss.length){map.set(tc.id,"NOT_TESTED");continue}const rs=ss.map(s=>latest.get(s.id)?.result||"NOT_TESTED");let r="NOT_TESTED";if(rs.includes("FAIL"))r="FAIL";else if(rs.includes("BLOCKED"))r="BLOCKED";else if(rs.every(x=>["PASS","N/A"].includes(x)))r="PASS";else if(rs.some(x=>x==="PASS"))r="IN_PROGRESS";map.set(tc.id,r)}return {map,latest}}
async function signedFile(path,seconds=120){const {data,error}=await sb.storage.from(DF.bucket).createSignedUrl(path,seconds);if(error)throw error;return data.signedUrl}
async function viewFile(path){try{const url=await signedFile(path);window.open(url,"_blank","noopener")}catch(error){toast(errMsg(error),true)}}
function safeFileName(name){return String(name||"file").normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g,"-").replace(/-+/g,"-")}


(async()=>{const ctx=await boot("dashboard","Tổng quan");if(!ctx)return;try{const pid=ctx.projectId;const [plansR,ucsR,tcsR,scR,exR,bugR]=await Promise.all([sb.from("test_plans").select("*").eq("project_id",pid),sb.from("use_cases").select("*").eq("project_id",pid),sb.from("test_cases").select("*").eq("project_id",pid),sb.from("test_scenarios").select("*").in("test_case_id",(await sb.from("test_cases").select("id").eq("project_id",pid)).data?.map(x=>x.id)||[]),sb.from("test_executions").select("*").eq("project_id",pid).order("created_at",{ascending:false}),sb.from("defects").select("*").eq("project_id",pid).order("created_at",{ascending:false})]);for(const r of [plansR,ucsR,tcsR,scR,exR,bugR])if(r.error)throw r.error;const plans=plansR.data||[],ucs=ucsR.data||[],tcs=tcsR.data||[],sc=scR.data||[],ex=exR.data||[],bugs=bugR.data||[];const res=tcResultMap(tcs,sc,ex);let pass=0,fail=0,blocked=0,inprog=0;for(const v of res.map.values()){if(v==="PASS")pass++;else if(v==="FAIL")fail++;else if(v==="BLOCKED")blocked++;else if(v==="IN_PROGRESS")inprog++}const tested=pass+fail+blocked+inprog,pct=tcs.length?Math.round(tested/tcs.length*100):0,passRate=tested?Math.round(pass/tested*100):0,openBugs=bugs.filter(b=>!["closed","rejected","duplicate","wont_fix"].includes(b.status)).length;const recent=ex.slice(0,8);document.getElementById("pageContent").innerHTML=`<div class="page-head"><div><h1>${e(ctx.project?.project_name||"Tổng quan")}</h1><p>Tổng hợp cấu trúc và kết quả kiểm thử theo dự án.</p></div><div class="page-head-actions"><a class="btn primary" href="/kiem-thu/thuc-hien">▶ Thực hiện kiểm thử</a></div></div><div class="stats"><div class="stat"><span>Kế hoạch</span><strong>${plans.length}</strong><small>Test Plan</small></div><div class="stat"><span>Use Case</span><strong>${ucs.length}</strong><small>Nghiệp vụ</small></div><div class="stat"><span>Test Case</span><strong>${tcs.length}</strong><small>Bộ kiểm thử</small></div><div class="stat"><span>Kịch bản</span><strong>${sc.length}</strong><small>Scenario</small></div><div class="stat success"><span>PASS</span><strong>${pass}</strong><small>Test Case đạt</small></div><div class="stat danger"><span>Bug đang mở</span><strong>${openBugs}</strong><small>Cần xử lý</small></div></div><div class="grid-2"><section class="card"><div class="card-head"><div><h2>Tiến độ kiểm thử</h2><p>Tính theo Test Case đã có kết quả ở các kịch bản</p></div><strong style="color:var(--primary)">${pct}%</strong></div><div class="card-body"><div class="progress"><div style="width:${pct}%"></div></div><div class="summary-line"><span>Đã thực hiện: <b>${tested}/${tcs.length}</b></span><span>Pass rate: <b>${passRate}%</b></span></div><div class="grid-3" style="margin-top:16px"><div class="kv"><span>PASS</span><strong class="text-success">${pass}</strong></div><div class="kv"><span>FAIL</span><strong class="text-danger">${fail}</strong></div><div class="kv"><span>BLOCKED / IN PROGRESS</span><strong class="text-warning">${blocked+inprog}</strong></div></div></div></section><section class="card"><div class="card-head"><div><h2>Bug theo mức độ</h2><p>Tất cả Bug của dự án</p></div></div><div class="card-body">${["critical","high","medium","low"].map(s=>`<div class="summary-line" style="padding:6px 0"><span>${badge(s)}</span><strong>${bugs.filter(b=>b.severity===s).length}</strong></div>`).join("")}</div></section></div><section class="card"><div class="card-head"><div><h2>Thực hiện gần đây</h2><p>Lịch sử Test Execution mới nhất</p></div></div><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Tester</th><th>Test Case</th><th>Kịch bản</th><th>Kết quả</th><th>Kết quả thực tế</th></tr></thead><tbody id="recentRows"></tbody></table></div></section>`;const prof=(await sb.from("profiles").select("id,full_name,email")).data||[];const pmap=new Map(prof.map(x=>[x.id,x]));const tcmap=new Map(tcs.map(x=>[x.id,x]));const smap=new Map(sc.map(x=>[x.id,x]));document.getElementById("recentRows").innerHTML=recent.length?recent.map(x=>`<tr><td>${fmtDateTime(x.completed_at||x.created_at)}</td><td>${e(pmap.get(x.tester_id)?.full_name||pmap.get(x.tester_id)?.email||"")}</td><td>${e(tcmap.get(x.test_case_id)?.test_code||"")}</td><td>${e(smap.get(x.scenario_id)?.scenario_name||"")}</td><td>${badge(x.result)}</td><td>${e(x.actual_result||"—")}</td></tr>`).join(""):`<tr><td colspan="6"><div class="empty">Chưa có lần thực hiện kiểm thử.</div></td></tr>`}catch(error){document.getElementById("pageContent").innerHTML=`<div class="error">${e(errMsg(error))}</div>`}})();
</script></body></html>
