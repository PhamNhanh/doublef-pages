</style></head><body><div id="app" class="page-loading">Đang khởi tạo hệ thống...</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const DF={url:"https://aizhygivtngtsqcjtvaj.supabase.co",key:"sb_publishable_T5kmdBx5e9EdE7WMxj3J4w_BWiJi8MN",bucket:"test-evidence"};
const sb=supabase.createClient(DF.url,DF.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const ROLE_LABEL={admin:"Quản trị viên",manager:"Quản lý dự án",tester:"Kiểm thử viên",viewer:"Người xem"};
function navItems(role){
  const items=[
    ["dashboard","/kiem-thu/","⌂","Tổng quan","TỔNG QUAN"],
    ["projects","/kiem-thu/du-an","▣","Dự án của tôi","DỰ ÁN"]
  ];
  if(["admin","manager","tester"].includes(role)){
    items.push(["execute","/kiem-thu/thuc-hien","▶","Thực hiện kiểm thử","CÔNG VIỆC"]);
    items.push(["defects","/kiem-thu/loi","!","Quản lý Bug","CÔNG VIỆC"]);
  }
  items.push(["reports","/kiem-thu/bao-cao","▥","Báo cáo","BÁO CÁO"]);
  if(["admin","manager"].includes(role)){
    items.push(["members","/kiem-thu/thanh-vien","♙",role==="admin"?"Thành viên":"Thành viên dự án","QUẢN TRỊ"]);
  }
  return items;
}
function e(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtDate(v){if(!v)return "—";const d=new Date(v.length===10?v+"T00:00:00":v);return isNaN(d)?"—":d.toLocaleDateString("vi-VN")}
function fmtDateTime(v){if(!v)return "—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("vi-VN")}
function initials(n){const a=String(n||"U").trim().split(/\s+/);return (a.length>1?a[a.length-2][0]+a[a.length-1][0]:a[0].slice(0,2)).toUpperCase()}
function badge(v){const s=String(v||"").toLowerCase().replaceAll(" ","_");return `<span class="badge ${e(s)}">${e(v||"—")}</span>`}
function toast(msg,bad=false){let x=document.getElementById("dfToast");if(!x){x=document.createElement("div");x.id="dfToast";document.body.appendChild(x)}x.className="toast"+(bad?" bad":"");x.textContent=msg;requestAnimationFrame(()=>x.classList.add("show"));setTimeout(()=>x.classList.remove("show"),2800)}
function errMsg(error){return error?.message||String(error||"Có lỗi xảy ra")}
async function requireAuth(){const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace("/kiem-thu/login");return null}const {data:profile,error:pe}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(pe||!profile||profile.active===false){await sb.auth.signOut();location.replace("/kiem-thu/login");return null}return {session,user:session.user,profile}}
async function visibleProjects(){const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function projectRole(projectId,userId){if(!projectId)return null;const {data}=await sb.from("project_members").select("role,active").eq("project_id",projectId).eq("user_id",userId).eq("active",true).maybeSingle();return data?.role||null}
function canManage(ctx){return ctx.profile.role==="admin"||ctx.projectRole==="manager"}
function canTest(ctx){return ctx.profile.role==="admin"||["manager","tester"].includes(ctx.projectRole)}
async function logout(){await sb.auth.signOut();location.replace("/kiem-thu/login")}
function navHtml(active,ctx){
  const activeKey=["plans","usecases","testcases"].includes(active)?"projects":active;
  let lastGroup="";
  return navItems(ctx.profile.role).map(n=>{
    const group=n[4]!==lastGroup?`<div class="nav-group">${n[4]}</div>`:"";
    lastGroup=n[4];
    return `${group}<a class="${n[0]===activeKey?'active':''}" href="${n[1]}"><span class="ico">${n[2]}</span><span>${n[3]}</span></a>`;
  }).join("");
}
function shell(active,title,ctx){const projectOptions=ctx.projects.length?ctx.projects.map(p=>`<option value="${p.id}" ${p.id===ctx.projectId?'selected':''}>${e(p.project_code)} - ${e(p.project_name)}</option>`).join(""):'<option value="">Chưa có dự án</option>';document.getElementById("app").className="app";document.getElementById("app").innerHTML=`<div id="overlay" class="overlay"></div><aside id="sidebar" class="sidebar"><div class="brand"><div class="brand-logo">DF</div><div><strong>DoubleF Test</strong><small>Project Test Management</small></div></div><nav class="nav">${navHtml(active,ctx)}</nav><div class="side-user"><div class="avatar">${e(initials(ctx.profile.full_name||ctx.user.email))}</div><div><strong>${e(ctx.profile.full_name||ctx.user.email)}</strong><small>${e(ROLE_LABEL[ctx.profile.role]||ctx.profile.role)}</small></div></div></aside><div class="main"><header class="topbar"><div class="top-left"><button id="menuBtn" class="btn menu-btn">☰</button><div><strong>${e(title)}</strong><small>${ctx.projectId?'Đang làm việc trong dự án đã chọn':'Chọn dự án để làm việc'}</small></div></div><div class="top-actions"><select id="projectSelect" class="project-select">${projectOptions}</select><span class="user-meta"><strong style="font-size:10.5px">${e(ctx.profile.full_name||ctx.user.email)}</strong></span><button id="logoutBtn" class="btn">Đăng xuất</button></div></header><main id="pageContent" class="content"><div class="loading">Đang tải dữ liệu...</div></main></div>`;document.getElementById("logoutBtn").onclick=logout;const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("overlay");document.getElementById("menuBtn").onclick=()=>{sidebar.classList.add("open");overlay.classList.add("show")};overlay.onclick=()=>{sidebar.classList.remove("open");overlay.classList.remove("show")};document.getElementById("projectSelect").onchange=ev=>{localStorage.setItem("doublef_current_project",ev.target.value);location.reload()}}
async function boot(active,title,{projectRequired=true}={}){try{const auth=await requireAuth();if(!auth)return null;const projects=await visibleProjects();let projectId=localStorage.getItem("doublef_current_project");if(!projects.some(p=>p.id===projectId))projectId=projects[0]?.id||"";if(projectId)localStorage.setItem("doublef_current_project",projectId);const pr=projectId?await projectRole(projectId,auth.user.id):null;const ctx={...auth,projects,projectId,project:projects.find(p=>p.id===projectId)||null,projectRole:pr};shell(active,title,ctx);if(projectRequired&&!projectId){document.getElementById("pageContent").innerHTML='<div class="notice">Chưa có dự án. Hãy tạo dự án trước.</div>';return null}return ctx}catch(error){document.getElementById("app").innerHTML=`<div class="error" style="margin:30px">${e(errMsg(error))}</div>`;return null}}
function openModal(title,body){closeModal();const b=document.createElement("div");b.id="dfModal";b.className="modal-backdrop";b.innerHTML=`<div class="modal"><div class="modal-head"><h3>${e(title)}</h3><button class="btn sm" id="modalClose">Đóng</button></div><div class="modal-body">${body}</div></div>`;document.body.appendChild(b);document.getElementById("modalClose").onclick=closeModal;b.addEventListener("click",ev=>{if(ev.target===b)closeModal()})}
function closeModal(){document.getElementById("dfModal")?.remove()}
function tcResultMap(testCases,scenarios,executions){const latest=new Map();[...(executions||[])].sort((a,b)=>new Date(b.completed_at||b.created_at)-new Date(a.completed_at||a.created_at)).forEach(x=>{if(!latest.has(x.scenario_id))latest.set(x.scenario_id,x)});const map=new Map();for(const tc of testCases||[]){const ss=(scenarios||[]).filter(s=>s.test_case_id===tc.id&&s.active!==false);if(!ss.length){map.set(tc.id,"NOT_TESTED");continue}const rs=ss.map(s=>latest.get(s.id)?.result||"NOT_TESTED");let r="NOT_TESTED";if(rs.includes("FAIL"))r="FAIL";else if(rs.includes("BLOCKED"))r="BLOCKED";else if(rs.every(x=>["PASS","N/A"].includes(x)))r="PASS";else if(rs.some(x=>x==="PASS"))r="IN_PROGRESS";map.set(tc.id,r)}return {map,latest}}
async function signedFile(path,seconds=120){const {data,error}=await sb.storage.from(DF.bucket).createSignedUrl(path,seconds);if(error)throw error;return data.signedUrl}
async function viewFile(path){try{const url=await signedFile(path);window.open(url,"_blank","noopener")}catch(error){toast(errMsg(error),true)}}
function safeFileName(name){return String(name||"file").normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g,"-").replace(/-+/g,"-")}


let DASH_CTX=null;
let DASH_DATA={plans:[],ucs:[],tcs:[],scenarios:[],executions:[],bugs:[],profiles:[]};

function dashboardScopeOptions(ctx,selected){
  const allLabel=ctx.profile.role==="admin"?"Tất cả dự án":"Tất cả dự án được phân";
  return `<option value="ALL" ${selected==="ALL"?"selected":""}>${allLabel}</option>`+
    ctx.projects.map(p=>`<option value="${p.id}" ${selected===p.id?"selected":""}>${e(p.project_code)} - ${e(p.project_name)}</option>`).join("");
}
function allowedScope(ctx,scope){return scope==="ALL"||ctx.projects.some(p=>p.id===scope)?scope:"ALL"}
function scopeProjectIds(ctx,scope){return scope==="ALL"?ctx.projects.map(p=>p.id):[scope].filter(Boolean)}
async function queryByProjects(table,ids,extra){
  let q=sb.from(table).select("*");
  if(ids.length===1)q=q.eq("project_id",ids[0]);
  else if(ids.length>1)q=q.in("project_id",ids);
  else return {data:[],error:null};
  if(extra)q=extra(q);
  return await q;
}
async function loadDashboard(scope){
  const ids=scopeProjectIds(DASH_CTX,scope);
  const [plansR,ucsR,tcsR,exR,bugR,scR,profR]=await Promise.all([
    queryByProjects("test_plans",ids),
    queryByProjects("use_cases",ids),
    queryByProjects("test_cases",ids),
    queryByProjects("test_executions",ids,q=>q.order("created_at",{ascending:false})),
    queryByProjects("defects",ids,q=>q.order("created_at",{ascending:false})),
    sb.from("test_scenarios").select("*"),
    sb.from("profiles").select("id,full_name,email")
  ]);
  for(const r of [plansR,ucsR,tcsR,exR,bugR,scR,profR])if(r.error)throw r.error;
  const tcs=tcsR.data||[],tcIds=new Set(tcs.map(x=>x.id));
  DASH_DATA={plans:plansR.data||[],ucs:ucsR.data||[],tcs,scenarios:(scR.data||[]).filter(x=>tcIds.has(x.test_case_id)),executions:exR.data||[],bugs:bugR.data||[],profiles:profR.data||[]};
  renderDashboard(scope);
}
function projectMetrics(projectId){
  const d=DASH_DATA,tcs=d.tcs.filter(x=>x.project_id===projectId),tcIds=new Set(tcs.map(x=>x.id));
  const scenarios=d.scenarios.filter(x=>tcIds.has(x.test_case_id));
  const executions=d.executions.filter(x=>x.project_id===projectId);
  const bugs=d.bugs.filter(x=>x.project_id===projectId);
  const r=tcResultMap(tcs,scenarios,executions),vals=[...r.map.values()];
  const pass=vals.filter(x=>x==="PASS").length,fail=vals.filter(x=>x==="FAIL").length,blocked=vals.filter(x=>x==="BLOCKED").length,inprog=vals.filter(x=>x==="IN_PROGRESS").length;
  const tested=vals.filter(x=>x!=="NOT_TESTED").length,pct=tcs.length?Math.round(tested/tcs.length*100):0;
  const openBugs=bugs.filter(b=>!["closed","rejected","duplicate","wont_fix"].includes(String(b.status||"").toLowerCase())).length;
  return {tcs:tcs.length,pass,fail,blocked,inprog,tested,pct,openBugs};
}
function dashboardActions(ctx){
  if(ctx.profile.role==="admin")return `<a class="btn" href="/kiem-thu/du-an">▣ Quản lý dự án</a><a class="btn primary" href="/kiem-thu/thanh-vien">👥 Thành viên</a>`;
  if(ctx.profile.role==="manager")return `<a class="btn" href="/kiem-thu/du-an">▣ Dự án của tôi</a><a class="btn primary" href="/kiem-thu/thuc-hien">▶ Thực hiện kiểm thử</a>`;
  if(ctx.profile.role==="tester")return `<a class="btn primary" href="/kiem-thu/thuc-hien">▶ Thực hiện kiểm thử</a>`;
  return `<a class="btn" href="/kiem-thu/du-an">▣ Dự án của tôi</a>`;
}
function renderDashboard(scope){
  const ctx=DASH_CTX,d=DASH_DATA,r=tcResultMap(d.tcs,d.scenarios,d.executions),vals=[...r.map.values()];
  const pass=vals.filter(x=>x==="PASS").length,fail=vals.filter(x=>x==="FAIL").length,blocked=vals.filter(x=>x==="BLOCKED").length,inprog=vals.filter(x=>x==="IN_PROGRESS").length,notTested=vals.filter(x=>x==="NOT_TESTED").length;
  const tested=vals.length-notTested,pct=d.tcs.length?Math.round(tested/d.tcs.length*100):0,finished=pass+fail+blocked,passRate=finished?Math.round(pass/finished*100):0;
  const openBugs=d.bugs.filter(b=>!["closed","rejected","duplicate","wont_fix"].includes(String(b.status||"").toLowerCase())).length;
  const projectIds=scopeProjectIds(ctx,scope),projectRows=ctx.projects.filter(p=>projectIds.includes(p.id));
  const recent=d.executions.slice(0,10),pmap=new Map(d.profiles.map(x=>[x.id,x])),tcmap=new Map(d.tcs.map(x=>[x.id,x])),smap=new Map(d.scenarios.map(x=>[x.id,x])),projMap=new Map(ctx.projects.map(x=>[x.id,x]));
  const title=scope==="ALL"?(ctx.profile.role==="admin"?"Tổng quan toàn hệ thống":"Tổng quan các dự án được phân"):(projMap.get(scope)?.project_name||"Tổng quan");
  const sub=scope==="ALL"?(ctx.profile.role==="admin"?"Dữ liệu tổng hợp trên toàn bộ dự án trong hệ thống.":"Chỉ tổng hợp các dự án tài khoản của bạn được phân công."):"Dữ liệu của riêng dự án đang chọn trong phạm vi báo cáo.";
  document.getElementById("pageContent").innerHTML=`
    <div class="page-head"><div><h1>${e(title)}</h1><p>${e(sub)}</p></div><div class="page-head-actions"><select id="dashboardScope" class="project-select">${dashboardScopeOptions(ctx,scope)}</select>${dashboardActions(ctx)}</div></div>
    <div class="stats">
      <div class="stat"><span>Dự án</span><strong>${projectRows.length}</strong><small>${ctx.profile.role==="admin"?"Trong phạm vi báo cáo":"Được phân quyền"}</small></div>
      <div class="stat"><span>Use Case</span><strong>${d.ucs.length}</strong><small>Nghiệp vụ</small></div>
      <div class="stat"><span>Test Case</span><strong>${d.tcs.length}</strong><small>Bộ kiểm thử</small></div>
      <div class="stat success"><span>PASS</span><strong>${pass}</strong><small>Test Case đạt</small></div>
      <div class="stat danger"><span>FAIL</span><strong>${fail}</strong><small>Test Case lỗi</small></div>
      <div class="stat warning"><span>Bug đang mở</span><strong>${openBugs}</strong><small>Cần xử lý</small></div>
    </div>
    <div class="grid-2">
      <section class="card"><div class="card-head"><div><h2>Tiến độ kiểm thử</h2><p>Kết quả được tổng hợp từ trạng thái mới nhất của từng kịch bản.</p></div><strong style="color:var(--primary)">${pct}%</strong></div><div class="card-body"><div class="progress"><div style="width:${pct}%"></div></div><div class="summary-line"><span>Đã có kết quả: <b>${tested}/${d.tcs.length}</b></span><span>Pass rate: <b>${passRate}%</b></span></div><div class="grid-3" style="margin-top:16px"><div class="kv"><span>BLOCKED</span><strong class="text-warning">${blocked}</strong></div><div class="kv"><span>ĐANG KIỂM THỬ</span><strong>${inprog}</strong></div><div class="kv"><span>CHƯA KIỂM THỬ</span><strong>${notTested}</strong></div></div></div></section>
      <section class="card"><div class="card-head"><div><h2>Bug theo mức độ</h2><p>${d.bugs.length} Bug trong phạm vi đang xem</p></div></div><div class="card-body">${["critical","high","medium","low"].map(s=>`<div class="summary-line" style="padding:6px 0"><span>${badge(s)}</span><strong>${d.bugs.filter(b=>String(b.severity||"").toLowerCase()===s).length}</strong></div>`).join("")}</div></section>
    </div>
    <section class="card"><div class="card-head"><div><h2>Tình hình theo dự án</h2><p>Chỉ hiển thị các dự án tài khoản hiện tại có quyền xem.</p></div></div><div class="table-wrap"><table><thead><tr><th>Dự án</th><th>Test Case</th><th>PASS</th><th>FAIL</th><th>BLOCKED</th><th>Tiến độ</th><th>Bug mở</th><th></th></tr></thead><tbody>${projectRows.length?projectRows.map(p=>{const m=projectMetrics(p.id);return `<tr><td><strong>${e(p.project_code)}</strong><span class="sub">${e(p.project_name)}</span></td><td>${m.tcs}</td><td class="text-success">${m.pass}</td><td class="text-danger">${m.fail}</td><td class="text-warning">${m.blocked}</td><td><strong>${m.pct}%</strong></td><td>${m.openBugs}</td><td><a class="btn sm" href="/kiem-thu/du-an-chi-tiet?id=${encodeURIComponent(p.id)}">Mở dự án →</a></td></tr>`}).join(""):`<tr><td colspan="8"><div class="empty">Không có dự án trong phạm vi này.</div></td></tr>`}</tbody></table></div></section>
    <section class="card"><div class="card-head"><div><h2>Thực hiện kiểm thử gần đây</h2><p>10 lần thực hiện mới nhất trong phạm vi đang xem.</p></div></div><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Dự án</th><th>Tester</th><th>Test Case</th><th>Kịch bản</th><th>Kết quả</th><th>Kết quả thực tế</th></tr></thead><tbody>${recent.length?recent.map(x=>`<tr><td>${fmtDateTime(x.completed_at||x.created_at)}</td><td>${e(projMap.get(x.project_id)?.project_code||"")}</td><td>${e(pmap.get(x.tester_id)?.full_name||pmap.get(x.tester_id)?.email||"")}</td><td>${e(tcmap.get(x.test_case_id)?.test_code||"")}</td><td>${e(smap.get(x.scenario_id)?.scenario_name||"")}</td><td>${badge(x.result)}</td><td>${e(x.actual_result||"—")}</td></tr>`).join(""):`<tr><td colspan="7"><div class="empty">Chưa có lần thực hiện kiểm thử.</div></td></tr>`}</tbody></table></div></section>`;
  document.getElementById("dashboardScope").onchange=async ev=>{const next=allowedScope(ctx,ev.target.value);localStorage.setItem("doublef_dashboard_scope",next);document.getElementById("pageContent").innerHTML='<div class="loading">Đang tải dữ liệu...</div>';try{await loadDashboard(next)}catch(error){document.getElementById("pageContent").innerHTML=`<div class="error">${e(errMsg(error))}</div>`}};
}

(async()=>{
  DASH_CTX=await boot("dashboard","Tổng quan",{projectRequired:false});
  if(!DASH_CTX)return;
  if(!DASH_CTX.projects.length){document.getElementById("pageContent").innerHTML='<div class="notice">Tài khoản hiện chưa có dự án nào được phép xem.</div>';return}
  let scope=allowedScope(DASH_CTX,localStorage.getItem("doublef_dashboard_scope")||"ALL");
  localStorage.setItem("doublef_dashboard_scope",scope);
  try{await loadDashboard(scope)}catch(error){document.getElementById("pageContent").innerHTML=`<div class="error">${e(errMsg(error))}</div>`}
})();
</script></body></html>
