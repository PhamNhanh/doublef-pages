he-faculty-of-law-of-uef-34807","license":"Quyền thuộc tác giả/đơn vị nguồn; chưa xác nhận quyền tái sử dụng.","caption":"Ảnh trong bài UEF về hoạt động dành cho bệnh nhi tại Bệnh viện Ung Bướu TP.HCM. Nguồn: Trường Đại học Kinh tế – Tài chính TP.HCM (UEF). Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage."},"nhi-data":{"id":"nhi-data","src":"https://suckhoedoisong.qltns.mediacdn.vn/thumb_w/730/324455921873985536/2026/8/2/hinh-bv-nhi-dong-2-2-8-17856301068881206613752.jpg","title":"Chăm sóc bệnh nhi tại Nhi Đồng 2","group":"Đồng hành bệnh nhi","author":"N. Tâm / Sức khỏe & Đời sống","provider":"Nguồn hoạt động công khai","url":"https://suckhoedoisong.vn/viet-nam-con-thieu-trung-tam-dieu-tri-ung-thu-nhi-16926080207314347.htm","license":"Quyền thuộc tác giả/đơn vị nguồn; chưa xác nhận quyền tái sử dụng.","caption":"Ảnh minh họa bài viết về ung thư nhi, nguồn đăng 02/08/2026. Nguồn: N. Tâm / Sức khỏe & Đời sống. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage."}},"posts":[{"id":"b48bf610-a0f8-5746-b804-43dfa8fa5ab9","slug":"hanh-trinh-lam-lai-trang","title":"Mình không cứu cả thế giới. Mình chỉ đừng quay đi.","excerpt":"Giữa một ngày ai cũng vội, có người chịu dừng lại. Đôi khi, một sự bắt đầu nhỏ đến vậy cũng đủ để tình người có chỗ ở lại.","category":"Sinh viên thiện nguyện","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/vlu_khoa_xay_dung_chung_tay_cai_tao_trung_tam_nuoi_duong_va_bao_tro_tre_em_go_vap_a_6ea1e5c0f0.jpg","image_caption":"Ảnh trong bài hoạt động hỗ trợ Trung tâm Bảo trợ trẻ em Gò Vấp năm 2025. Nguồn: Trí Châu / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Có những điều tử tế không bắt đầu bằng một lời kêu gọi. Chúng bắt đầu từ một người đang đi thì chậm bước, nhìn lại, rồi tự hỏi: mình có giúp được một chút gì không?\n\nMột chút thôi. Không phải lo hết cuộc đời của ai, cũng không phải chứng minh mình tốt. Chỉ là nhận ra, ở phía bên kia sự bận rộn của mình, có một người vẫn đang chờ được đối xử bằng sự dịu dàng.\n\n## Một bàn tay không cần làm được mọi điều\n\nChúng mình dễ nghĩ rằng phải có dư mới có thể cho. Dư tiền, dư thời gian, dư sức. Thế rồi cuộc sống cứ đầy lên, và ngày đủ điều kiện để bắt đầu cứ lùi xa mãi.\n\nNhưng một buổi chiều có thể được chia đôi. Một kỹ năng có thể được dùng vào việc khác. Người giỏi sắp xếp có thể giúp một nhóm bớt rối; người biết lắng nghe có thể ở lại với một câu chuyện chưa ai chịu nghe hết. Không phải sự đóng góp nào cũng nằm trong một phong bì.\n\nVà cũng không phải lúc nào mình cũng là người đưa tay. Có những giai đoạn, chính mình là người cần được đỡ. Điều đó không làm mình kém giá trị. Một cộng đồng đẹp không chia con người thành hai phía cố định: phía luôn cho và phía mãi nhận.\n\n## Chỗ đứng của người được giúp\n\nTên trang có mình và có bạn. Nhưng điều cần được đặt ở giữa không phải chúng mình. Đó là người đang cần hỗ trợ, cùng mong muốn, sự lựa chọn và lòng tự trọng của họ.\n\nMột món quà chỉ thật sự ấm khi người nhận được quyền nói điều mình cần, được từ chối chụp ảnh, được có một ngày không vui mà không phải xin lỗi. Sự biết ơn không nên trở thành tấm vé để ai đó được đối xử tử tế.\n\nBởi vậy, lòng tốt đôi khi là bớt đi một lời hỏi. Bớt một bức ảnh. Bớt một lời hứa quá lớn. Để dành chỗ cho một điều nhỏ nhưng mình có thể làm đến nơi.\n\n## Từ một người, thành chúng ta\n\nMình mong ngôi nhà này là nơi một người chưa biết bắt đầu từ đâu có thể tìm thấy một cánh cửa vừa sức. Đọc một bài, nghĩ đến một người, nhắn một lời hỏi thăm. Rồi từ cảm xúc ấy, chọn một việc thật.\n\nKhông phải ai đọc cũng phải trở thành tình nguyện viên. Không ai cần cho đến khi chính mình cạn kiệt. Chỉ mong, khi vẫn còn khả năng, chúng ta đừng quen với việc đi ngang nỗi khó của nhau.\n\n> Thấy ai khó, có chúng ta — không phải để hứa làm điều lớn lao, mà để nhắc mình đừng quay đi.\n\nMột bàn tay không giữ được cả thế giới. Nhưng vào một lúc nào đó, nó có thể giúp một người thấy mình chưa hoàn toàn đơn độc. Với mình, đó đã là một khởi đầu rất đáng quý.","tags":["Sinh viên thiện nguyện","Đồng hành","Điều tử tế","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"f52f554b-fc7b-5736-8b11-83a10b1c2eba","slug":"mua-he-xanh-sua-lai-mot-can-phong","title":"Có những chuyến đi bắt đầu bằng một cây chổi","excerpt":"Không sân khấu, không phần giới thiệu dài. Có những người trẻ bước vào một buổi thiện nguyện bằng cách xắn tay áo lên.","category":"Sinh viên thiện nguyện","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/vlu_khoa_xay_dung_chung_tay_cai_tao_trung_tam_nuoi_duong_va_bao_tro_tre_em_go_vap_b_cad3f49ffc.jpg","image_caption":"Sinh viên Khoa Xây dựng tham gia hoạt động tại Trung tâm Bảo trợ trẻ em Gò Vấp, theo nguồn năm 2025. Nguồn: Trí Châu / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Không phải chuyến đi nào cũng có một khoảnh khắc thật đẹp để đăng lên. Có những buổi chỉ thấy lưng áo, những bàn tay đang giữ một đầu bàn, và một người cúi xuống nhặt tiếp thứ vừa rơi.\n\nMột cây chổi không có vẻ trang trọng như bó hoa. Một chiếc khăn lau không mang dáng dấp của phần quà. Nhưng khi đến một nơi cần được chăm chút, chúng có thể là cách chào rất chân thành: chúng mình đến để cùng làm, chứ không chỉ cùng đứng trong một bức ảnh.\n\n## Những việc không ai tranh phần\n\nTrong một nhóm, luôn có những việc ít được nhắc tên. Người đi lấy thêm nước. Người gom dây điện cho khỏi vướng. Người kiểm tra xem chiếc ghế vừa kê có chắc chưa. Nếu thiếu những việc ấy, mọi thứ khó trọn vẹn; khi chúng đã xong, người ta lại dễ quên ai đã làm.\n\nTuổi trẻ không chỉ nằm ở tiếng cười trong chuyến xe. Nó còn nằm ở sự sẵn lòng nhận một phần việc chẳng có gì nổi bật. Cùng nhau làm việc cũng là lúc mình học được cách nhường chỗ, hỏi trước, nghe lời hướng dẫn và không để sự nhiệt tình chạy nhanh hơn khả năng.\n\nKhông phải cứ muốn sửa là được sửa. Một nơi ở có nếp sống của nó, có người hiểu từng góc nhỏ hơn mình. Trước khi thay đổi điều gì, có lẽ câu cần nói đầu tiên vẫn là: nơi mình đến đang cần gì?\n\n## Căn phòng sau khi mình rời đi\n\nHãy thử nghĩ về ngày hôm sau. Khi áo đồng phục đã được giặt, nhóm đã trở lại lớp, nơi ấy sẽ còn lại điều gì?\n\nMột lối đi bớt vướng. Một chiếc kệ được sắp dễ tìm hơn. Một chỗ ngồi sạch sẽ. Những điều bình thường đến mức người sử dụng không cần biết ai đã làm. Có lẽ chính sự bình thường ấy mới là giá trị: việc mình để lại đi vào cuộc sống của người khác, thay vì chỉ ở lại trên trang cá nhân của mình.\n\nMột buổi lao động không cần trở thành câu chuyện phi thường. Nó chỉ cần hữu ích và an toàn, đúng phần việc đã thống nhất, được dọn dẹp gọn gàng trước lúc ra về.\n\n## Đem về một cách nhìn khác\n\nCó thể thứ mình mang về không phải một bài học lớn. Chỉ là từ đó, gặp một việc cần người làm, mình bớt chờ xem ai sẽ đứng lên trước.\n\nVà khi nhìn thấy một căn phòng ngăn nắp, mình biết phía sau sự dễ chịu ấy luôn có công sức. Biết cảm ơn người lau dọn, người giữ đồ, người âm thầm chăm nơi chốn mỗi ngày.\n\n> Có những dấu tay đẹp nhất không nằm trong bức ảnh. Chúng ở trên một việc đã được làm xong.\n\nMột cây chổi nhỏ không làm thay đổi mọi thứ. Nhưng cầm nó lên, mình có thể bắt đầu thay đổi cách mình có mặt trong cuộc đời này.","tags":["Lao động thiện nguyện","Sinh viên","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"72fb4dd6-9919-5659-8377-ba60a905e381","slug":"bua-com-cho-ong-ba","title":"Một bữa cơm có người ngồi cùng","excerpt":"Có những món quà không được gói trong giấy. Chúng nằm ở chiếc ghế được kéo lại gần và người chưa vội đứng lên.","category":"Bên ông bà","author":"Vì mình và bạn","cover_image":"https://bachkhoasaigon.edu.vn/wp-content/uploads/2022/05/sinh-vien-spc-tham-vien-duong-lao-vinh-son-2.jpg","image_caption":"Ảnh trong bài về chuyến thăm Vinh Sơn của sinh viên SPC ngày 15/05/2022; không phải ghi nhận hiện tại. Nguồn: Trường Trung cấp Bách Khoa Sài Gòn. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Một mâm cơm có thể đủ các món mà khoảng cách giữa những chiếc ghế vẫn khiến người ta thấy xa. Và một bữa ăn rất giản dị vẫn có thể ấm, nếu có người nhớ hỏi hôm nay mình muốn ngồi ở đâu.\n\nNghĩ về việc đến thăm ông bà, chúng mình thường nghĩ ngay đến thứ sẽ mang theo. Nhưng thử nghĩ thêm một điều khác: sau khi đặt túi quà xuống, mình sẽ làm gì với khoảng thời gian còn lại?\n\n## Đừng chỉ để lại chiếc túi\n\nMột món quà có thể được đặt lên bàn trong vài giây. Một cuộc trò chuyện cần sự hiện diện lâu hơn. Cần người nghe không liên tục nhìn điện thoại, không sốt ruột tìm câu chuyện tiếp theo, không ngắt lời chỉ vì đã nghe một lần.\n\nCó những chuyện cũ có thể trở lại nhiều lần. Nhưng người kể không phải một cuốn sách mà mình đọc xong rồi thôi. Mỗi lần ngồi nghe là một lần mình nói, bằng thái độ của mình, rằng cuộc đời này vẫn đáng được quan tâm.\n\nSự gần gũi cũng không nhất thiết phải có nhiều lời. Có thể chỉ là cùng nhìn ra khoảng sân, cùng chờ bữa ăn được dọn, hoặc hỏi một câu thật nhẹ rồi để người đối diện chọn có muốn trả lời không.\n\n## Quan tâm đến điều người khác thật sự cần\n\nKhông phải món mình thích cũng là món ông bà dùng được. Không phải một bàn đầy quà là một buổi thăm phù hợp. Trước khi đem thức ăn hay hỗ trợ sinh hoạt, hỏi người phụ trách là cách để tình cảm đi cùng sự cẩn thận.\n\nNhưng ngoài những thứ cần hỏi, còn có một điều cần tự nhắc: đừng quyết định thay cảm xúc của người mình đến thăm. Người cao tuổi có thể vui, trầm ngâm, muốn nghỉ hoặc không muốn chụp hình. Một buổi gặp tử tế vẫn là một buổi gặp tử tế dù không có tấm ảnh ai cũng cười.\n\nChúng mình đến để chia sẻ một khoảng thời gian, không phải để yêu cầu người khác biểu diễn sự cảm động.\n\n## Kéo chiếc ghế lại gần\n\nCó lẽ điều dễ mang về từ một chuyến thăm ông bà nhất là lời nhắc dành cho chính gia đình mình. Bao lâu rồi mình chưa hỏi người thân ăn cơm có ngon không? Bao lâu rồi cuộc gọi nào cũng kết thúc bằng một câu báo bận?\n\nKhông cần chờ một chuyến đi có tên gọi. Sự hiện diện có thể bắt đầu từ bữa tối hôm nay, một cuộc gọi không mở loa ngoài trong lúc làm việc khác, một lần ngồi xuống nghe cho trọn.\n\n> Không phải bữa cơm nào cũng cần thêm món. Có bữa chỉ cần thêm một người chịu ngồi cùng.\n\nNếu đến thăm, mong mình đem theo cả khoảng thời gian ấy. Để lúc đứng dậy, thứ còn lại không chỉ là những món quà đã dùng được, mà còn là cảm giác một người đã được gặp gỡ như một người thân thuộc.","tags":["Người cao tuổi","Viện dưỡng lão","Chăm sóc","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"f64595ec-9d54-5703-822c-72de9a2d6496","slug":"cuoi-tuan-o-vien-duong-lao","title":"Ngồi thêm một chút, trước khi nói lời chào","excerpt":"Chuyến xe sẽ đến giờ về. Nhưng có những cuộc gặp nhắc mình rằng sự tử tế không kết thúc ngay khi đã trao xong quà.","category":"Bên ông bà","author":"Vì mình và bạn","cover_image":"https://bachkhoasaigon.edu.vn/wp-content/uploads/2022/05/sinh-vien-spc-tham-vien-duong-lao-vinh-son-3.jpg","image_caption":"Ảnh trong bài về chuyến thăm Vinh Sơn của sinh viên SPC ngày 15/05/2022; không phải ghi nhận hiện tại. Nguồn: Trường Trung cấp Bách Khoa Sài Gòn. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Khi một buổi gặp gần kết thúc, người ta thường bắt đầu thu dọn. Đồ đạc được kiểm lại, điện thoại được cất vào túi, những người cùng nhóm gọi nhau ra xe. Có lúc chính trong nhịp vội ấy, mình mới nhận ra cuộc trò chuyện trước mặt chưa hẳn đã xong.\n\nKhông phải lúc nào cũng cần ngồi thêm thật lâu. Chỉ cần đừng đứng lên quá đột ngột. Nhìn người đối diện, nghe hết câu, nói một lời chào rõ ràng. Một người không nên có cảm giác mình vừa trở thành phần việc đã hoàn tất.\n\n## Một cuộc đời không chỉ có tuổi già\n\nKhi gặp ông bà, chúng mình dễ nhìn thấy tuổi tác trước khi nhìn thấy một con người. Nhưng trước những ngày này đã từng có cả một cuộc đời: công việc, lựa chọn, sở thích, những điều tự hào và cả những chuyện chẳng muốn kể.\n\nHỏi về điều ông bà thích có thể mở một cánh cửa khác với việc chỉ hỏi có đau ở đâu không. Có thể người đối diện muốn nói về một bài hát, một món ăn, một công việc xưa. Cũng có thể họ chỉ muốn ngồi yên. Tôn trọng cả hai lựa chọn ấy là một cách chăm sóc cuộc gặp.\n\nChúng mình không cần trở thành người kể chuyện hay nhất trong phòng. Đôi khi, vai trò đẹp nhất là người chịu nhường phần lớn thời gian để nghe.\n\n## Đừng dùng một lời hẹn để làm đẹp phút chia tay\n\nHẹn sẽ quay lại rất dễ khi lòng còn xúc động. Giữ được lời hẹn ấy mới cần sự chuẩn bị. Lịch học, công việc, khoảng cách và nhiều điều khác có thể thay đổi; bởi vậy, lời nói nên vừa với khả năng thật của mình.\n\nKhông hứa một ngày chưa chắc đến không có nghĩa là ít thương. Đó có thể là một cách thương có trách nhiệm. Mình vẫn có thể giữ liên lạc với nơi tiếp nhận, hỏi về thời điểm phù hợp và trở lại khi đã thu xếp được.\n\nSự đều đặn không cần rầm rộ. Một cuộc gặp được chuẩn bị kỹ quý hơn nhiều lời hứa đẹp bị bỏ quên.\n\n## Mang sự lắng nghe ra khỏi cánh cổng\n\nĐiều quan trọng không chỉ là mình đã làm gì trong buổi thăm. Còn là mình có trở nên kiên nhẫn hơn với người lớn tuổi trong cuộc sống thường ngày hay không.\n\nBớt giục một người đi chậm. Chờ thêm khi ai đó đang tìm từ để nói. Không biến sự lặp lại thành lý do để tỏ vẻ khó chịu. Những điều ấy không được gọi thành chiến dịch, nhưng cũng giữ phẩm giá và tình thân ở lại.\n\n> Một lời chào ấm không nhất thiết hẹn ngày mai. Nó chỉ cần thật lòng với khoảng thời gian hôm nay.\n\nTrước khi nói lời chào, ngồi thêm một chút nếu có thể. Không để kéo dài sự lưu luyến, mà để người đối diện biết mình đã thật sự có mặt.","tags":["Thăm ông bà","Đoàn viên","Thời gian chất lượng","Tản văn biên soạn"],"gallery":[],"status":"published","featured":true,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"5a6f60f6-e91b-5492-93ed-55041cff5de4","slug":"mang-sach-toi-mai-am","title":"Có người đọc cùng, cuốn sách mới thành một khoảng trời","excerpt":"Một cuốn sách có thể được trao rất nhanh. Điều cần nhiều thời gian hơn là ở bên một đứa trẻ đủ lâu để cùng mở những trang đầu.","category":"Vì trẻ em","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/chuong_trinh_trang_sach_nho_the_gioi_lon_tai_lang_tre_em_sos_go_vap_c_4fc02ffb9e.jpg","image_caption":"Ảnh chương trình Trang sách nhỏ – Thế giới lớn tại Làng trẻ em SOS Gò Vấp, theo nguồn năm 2025. Nguồn: Hùng Anh / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Cuốn sách nằm trên tay người lớn và cuốn sách mở trước một đứa trẻ không hẳn là cùng một thế giới. Với mình, đó có thể là món quà đã chuẩn bị. Với em, đó có thể là những hình vẽ lạ, một câu hỏi chưa dám nói, hoặc một câu chuyện em muốn đọc đi đọc lại.\n\nTrao sách là một bắt đầu đẹp. Nhưng nếu có thời gian ngồi xuống cùng em, món quà ấy có thêm một phần không nằm trong giá bìa: sự chú ý của một người lớn.\n\n## Đọc chậm hơn một chút\n\nTrong một buổi đọc, có thể mình muốn đi hết câu chuyện. Còn em muốn dừng lại ở con mèo trong góc tranh. Mình chờ đến đoạn kết, còn em vẫn đang nghĩ vì sao nhân vật ấy không có bạn.\n\nTheo nhịp của trẻ không phải lúc nào cũng dễ. Nó đòi hỏi mình buông ý muốn tổ chức mọi thứ thật trơn tru. Dành chỗ cho một câu hỏi bất ngờ, cho việc đọc lại một trang, cho cả một em chưa muốn tham gia ngay.\n\nKhông cần hỏi em đã hiểu được bao nhiêu sau mỗi đoạn. Có những lần được nghe một câu chuyện mà không bị kiểm tra cũng đã là một niềm vui.\n\n## Một món quà không kèm bài kiểm tra về lòng biết ơn\n\nTrẻ em không phải mỉm cười đúng lúc máy ảnh được đưa lên, cũng không phải đọc thật giỏi để chứng minh phần quà có ích. Các em được quyền lúng túng, hiếu động, im lặng hoặc thích một cuốn khác với cuốn mình đã chọn.\n\nNếu đến một mái ấm hay nơi sinh hoạt của trẻ, điều cần hỏi trước vẫn là độ tuổi, nếp sinh hoạt và cách tổ chức phù hợp. Sự chuẩn bị giúp mình bớt phải điều khiển tình huống, để có thể dành nhiều sự chú ý hơn cho từng em.\n\nMột buổi gặp có thể giản dị: một góc ngồi, một vài cuốn sách, một người nhớ tên em trong lúc trò chuyện và chịu nghe hết ý em muốn nói.\n\n## Một trang mở ra, một lời nhắc ở lại\n\nChúng mình thường mong trẻ có ước mơ thật lớn. Nhưng trước những ước mơ ấy, có lẽ các em cần biết rằng suy nghĩ nhỏ của mình cũng đáng được lắng nghe.\n\nMột câu hỏi không bị cười. Một cách đọc chưa trôi chảy không bị giục. Một ý tưởng khác người lớn vẫn được xem xét. Những điều ấy không dễ chụp thành ảnh, nhưng có thể làm nên chất lượng của một buổi đồng hành.\n\n> Đôi khi, thứ một đứa trẻ nhớ không phải câu chuyện trong sách, mà là người đã đọc chậm cùng mình.\n\nMang sách đến, rồi dành chỗ để đọc cùng. Khoảng trời không chỉ nằm trên trang giấy. Nó còn ở trong cách mình để một đứa trẻ được tự do bước vào câu chuyện.","tags":["Mái ấm","Đọc sách","Trẻ em","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"0ba9082b-717b-584e-a97a-45ac351101d5","slug":"cuoi-tuan-cung-cac-em","title":"Một ngày em không phải cố làm người lớn","excerpt":"Không cần một chương trình thật đông vui. Đôi khi, chỉ cần một khoảng sân nơi trẻ được chơi mà không phải tỏ ra ngoan để được yêu thương.","category":"Vì trẻ em","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/chuong_trinh_trang_sach_nho_the_gioi_lon_tai_lang_tre_em_sos_go_vap_d_b8a31f40f1.jpg","image_caption":"Ảnh chương trình Trang sách nhỏ – Thế giới lớn tại Làng trẻ em SOS Gò Vấp, theo nguồn năm 2025. Nguồn: Hùng Anh / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Khi chuẩn bị đến gặp các em nhỏ, chúng mình thường xếp rất nhiều thứ vào một buổi: trò chơi, văn nghệ, trao quà, chụp ảnh. Càng nhiều mục, mình càng có cảm giác đã chuẩn bị chu đáo.\n\nNhưng một buổi dành cho trẻ không nhất thiết phải kín lịch. Đôi khi, điều cần thiết nhất là một khoảng trống: đủ để em chọn trò mình thích, đổi ý, ngồi nghỉ hoặc chỉ đứng nhìn trước khi nhập cuộc.\n\n## Tuổi thơ không phải một chương trình cần chạy cho đúng giờ\n\nTrẻ em có những cách vui rất khác nhau. Có em thích vận động, có em muốn vẽ, có em cần một lúc lâu mới chịu bắt chuyện. Một hoạt động dịu dàng không cố kéo tất cả về cùng một kiểu biểu lộ.\n\nNếu trò chơi chưa thành công, mình có thể đổi cách chơi. Nếu không khí không sôi nổi như mong đợi, vẫn có thể là một buổi gặp tốt. Điều quan trọng không phải người tổ chức có đủ những tấm ảnh rộn ràng, mà là các em có thấy mình được tự nhiên hay không.\n\nMình không đến để chấm điểm sự đáng yêu. Cũng không nên đặt lên trẻ trách nhiệm làm người lớn hài lòng vì đã dành thời gian tới thăm.\n\n## Một người lớn biết giữ giới hạn\n\nYêu quý trẻ không có nghĩa là được ôm, bế hoặc chụp hình bất cứ lúc nào. Sự thân mật cũng cần được đón nhận, chứ không chỉ được trao đi.\n\nHỏi trước, chờ phản ứng, tôn trọng sự từ chối. Những điều ấy không làm cuộc gặp xa cách hơn. Chúng khiến em có chỗ đứng trong chính trải nghiệm của mình: em được chọn cách người khác đến gần.\n\nTại mái ấm hay nơi chăm sóc trẻ, mình còn cần đi theo hướng dẫn của người phụ trách. Đó là cách để một buổi vui không làm đảo lộn nhịp sống mà những người ở lại đang gìn giữ mỗi ngày.\n\n## Để một cuộc gặp kết thúc êm\n\nTrước khi ra về, có thể cùng các em xếp lại đồ chơi, cất bút màu, trả những chiếc ghế về vị trí cũ. Không cần làm phần kết thật xúc động. Một lời chào rõ ràng, một lời cảm ơn vì đã chơi cùng, là đủ.\n\nNếu chưa biết ngày trở lại, đừng hứa cho đẹp. Sự chân thành đôi khi nằm ở việc nói ít hơn điều lòng mình đang muốn nói.\n\n> Đến với tuổi thơ, đừng chỉ mang theo quà. Hãy mang theo cả sự cho phép được là một đứa trẻ.\n\nMong sau một buổi gặp, các em không phải nhớ mình đã ngoan thế nào. Chỉ cần được nhớ một ngày chơi vui, có người lắng nghe và không ai bắt mình lớn hơn tuổi.","tags":["Trẻ em","Mái ấm","Sinh hoạt","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"0088abeb-af9b-5139-af20-641cad9806df","slug":"tham-benh-nhi-ung-thu-dung-cach","title":"Em không cần phải dũng cảm suốt cả ngày","excerpt":"Mình đến bên em không phải để xin một nụ cười. Chỉ mong em có một khoảng thời gian được là mình, ngoài những lời nhắc phải mạnh mẽ.","category":"Bệnh nhi ung thư","author":"Vì mình và bạn","cover_image":"https://cdn2.tuoitre.vn/thumb_w/750/ttnew/r/2018/12/01/02c99b9d-1543652010.jpg","image_caption":"Ảnh chương trình dành cho bệnh nhi ung thư tại TP.HCM được Tuổi Trẻ News đăng năm 2018. Nguồn: Tuổi Trẻ News. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Khi nghĩ đến một em nhỏ đang điều trị bệnh, người lớn thường muốn tìm một câu thật mạnh để động viên. Cố lên. Dũng cảm lên. Rồi mọi chuyện sẽ ổn.\n\nNhững lời ấy có thể được nói bằng tình thương. Nhưng thử dành chỗ cho một câu khác: hôm nay em thấy thế nào? Và sau khi hỏi, cho em quyền trả lời bằng bất cứ cảm xúc nào, kể cả bằng sự im lặng.\n\n## Em vẫn là em, không chỉ là một người bệnh\n\nĐằng sau một hành trình điều trị là một đứa trẻ có sở thích riêng. Có thể thích một màu, một cuốn truyện, một bài hát; cũng có thể hôm ấy không muốn nói về điều gì cả.\n\nMột cuộc gặp không cần xoay quanh bệnh. Nếu em muốn, chúng mình có thể nói về bức tranh đang vẽ, một nhân vật trong sách, hoặc chuyện rất nhỏ mà em đang quan tâm. Không cần biến mọi phút trò chuyện thành một bài học về nghị lực.\n\nTrẻ em xứng đáng được nhận tình thương cả khi mạnh mẽ lẫn khi chưa thể mạnh mẽ. Một em nhỏ không nên phải trở thành hình ảnh lạc quan để người đến thăm thấy chuyến đi của mình có ý nghĩa.\n\n## Đừng đặt thêm một việc phải làm lên vai em\n\nMỉm cười trước máy ảnh, nói lời cảm ơn, kể lại chuyện của mình — những điều tưởng nhỏ cũng là những yêu cầu. Trước khi đề nghị, có lẽ người lớn cần tự hỏi: điều này đang giúp em, hay đang giúp mình có một câu chuyện để mang về?\n\nCó những lần cất điện thoại đi lại là lựa chọn tốt hơn. Có những món quà trao qua đầu mối bệnh viện phù hợp hơn một cuộc gặp trực tiếp. Đến gần không phải lúc nào cũng là cách duy nhất để quan tâm.\n\nMột đoàn thăm chỉ nên vào khi đã được bệnh viện đồng ý và theo đúng hướng dẫn. Tình thương không thay thế được quy định chăm sóc; sự dịu dàng bắt đầu từ việc mình biết giới hạn của mình.\n\n## Một khoảng thời gian không cần chứng minh điều gì\n\nCó thể mình không mang lại được điều lớn lao. Chỉ là một buổi đọc truyện được chấp thuận, một món đồ phù hợp, hoặc một sự hỗ trợ dành cho người chăm sóc. Việc nhỏ không vì vậy mà vô nghĩa.\n\nĐiều mình không nên mang theo là lời hứa chắc chắn về ngày khỏi bệnh, hay áp lực rằng em phải vui vì có người đến. Mình không biết hết hành trình phía trước; nhưng mình có thể chọn cách có mặt cẩn thận trong hôm nay.\n\n> Em được mệt. Được im lặng. Được chưa muốn cười. Sự quan tâm vẫn ở đây, không cần em phải đổi lấy.\n\nMong một ngày nào đó, khi nhớ đến những người đã ghé qua, em không chỉ nhớ lời bảo mình phải kiên cường. Mong em cũng nhớ đã có người để mình được mềm yếu một chút, mà vẫn được trân trọng nguyên vẹn.","tags":["Bệnh nhi ung thư","Bệnh viện","Công tác xã hội","Tản văn biên soạn"],"gallery":[],"status":"published","featured":true,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"19a0cbe4-842c-5e73-bf47-4f7d7615c394","slug":"dung-hoi-sao-khong-co-hon","title":"Bên ngoài phòng bệnh, còn một người đang chờ","excerpt":"Khi trao một món quà cho em nhỏ, thử nhìn thêm người đang ngồi bên cạnh. Người ấy cũng cần được hỏi thăm, mà không phải kể lại hết nỗi lo.","category":"Bệnh nhi ung thư","author":"Vì mình và bạn","cover_image":"https://kenh14cdn.com/203336854389633024/2024/3/11/photo-14-1710164186874473029885.jpg","image_caption":"Ảnh trong bài về lớp học dành cho bệnh nhi tại Nhi Đồng 2; nguồn năm 2024. Nguồn: Kênh 14. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Trong một cuộc trò chuyện về bệnh nhi, mọi câu hỏi thường hướng về đứa trẻ. Hôm nay em ăn được không, ngủ được không, có vui không? Những câu hỏi ấy cần thiết. Nhưng bên cạnh em còn có một người đang lặng lẽ nghe và trả lời.\n\nCó thể là ba, mẹ, ông bà hoặc một người thân. Chúng mình không biết hết họ đã trải qua điều gì, cũng không nên tự viết thêm một câu chuyện về sự kiệt sức của họ. Chỉ cần nhớ: người chăm sóc cũng là một người cần được quan tâm.\n\n## Một câu hỏi không đòi câu chuyện dài\n\nKhông phải lời hỏi thăm nào cũng cần dẫn tới một lời tâm sự. Có người muốn nói. Có người muốn giữ chuyện riêng. Có người chỉ cần biết đầu mối để hỏi về một việc đang vướng.\n\nThay vì yêu cầu kể lại từ đầu, mình có thể hỏi xem lúc này có điều gì nhóm hỗ trợ được theo hướng dẫn của bệnh viện. Một thông tin rõ ràng, một việc hậu cần đúng nhu cầu, một lời nhắn không gây áp lực trả lời ngay — đó đều có thể là cách quan tâm.\n\nSự giúp đỡ không nhất thiết phải thật gần gũi mới chân thành. Có khi giữ một khoảng cách lịch sự lại khiến người nhận thoải mái hơn.\n\n## Đừng biến lòng thương thành lời khuyên\n\nKhi không biết nói gì, chúng mình dễ tìm đến những câu quen thuộc. Phải mạnh mẽ. Đừng nghĩ nhiều. Nhìn tích cực lên. Nhưng đời sống của người đối diện không phải điều mình hiểu hết chỉ sau vài phút gặp.\n\nCó lẽ sự khiêm nhường cần thiết nhất là thừa nhận mình chưa biết. Không so sánh với một hoàn cảnh khác, không đo sức chịu đựng, không đưa lời khuyên về điều trị. Nếu câu chuyện vượt quá khả năng, hãy để đầu mối chuyên môn và người phụ trách hỗ trợ đúng cách.\n\nMình có thể lắng nghe mà không giải quyết mọi vấn đề. Có thể ở lại một lúc mà không cố lấp đầy khoảng im lặng.\n\n## Quan tâm mà không lấy đi sự riêng tư\n\nMột gia đình không có nghĩa vụ cung cấp câu chuyện của mình để chứng minh xứng đáng được giúp. Khi cần thông tin cho một chương trình hỗ trợ, nên làm việc qua đầu mối phù hợp, chỉ lấy phần thực sự cần và giữ đúng sự đồng ý đã trao đổi.\n\nKhông phải nỗi lo nào cũng cần xuất hiện trên mạng. Không phải lời tâm sự nào được nghe cũng trở thành nội dung được phép viết.\n\n> Có những người luôn được hỏi về con, nhưng ít khi được hỏi về chính mình.\n\nMong trong một chuyến đồng hành, chúng ta nhớ cả người đang đứng bên cạnh. Không cần một cử chỉ thật lớn. Chỉ cần một sự chú ý đủ tinh tế để họ không cảm thấy mình vô hình giữa rất nhiều lời quan tâm.","tags":["Giao tiếp","Bệnh nhi","Tinh tế","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"1d762e59-a316-5ad8-a7df-12537c4d5def","slug":"lang-tre-em-sos-go-vap","title":"Một mái nhà không chỉ là một địa chỉ","excerpt":"Điều đáng tìm ở một mái ấm không chỉ là cánh cổng. Đó còn là cách mình có thể đồng hành mà không làm xáo trộn cuộc sống của những người ở đó.","category":"Mái ấm & địa chỉ","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/chuong_trinh_trang_sach_nho_the_gioi_lon_tai_lang_tre_em_sos_go_vap_a_71f5ec442b.jpg","image_caption":"Ảnh chương trình Trang sách nhỏ – Thế giới lớn tại Làng trẻ em SOS Gò Vấp, theo nguồn năm 2025. Nguồn: Hùng Anh / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Nhắc đến một mái ấm, chúng mình dễ nghĩ đến chuyến đi: ngày nào, bao nhiêu người, đem theo những gì. Nhưng với trẻ em sống ở đó, nơi ấy không phải một điểm đến cuối tuần. Đó là nơi cuộc sống tiếp tục cả trước khi đoàn đến lẫn sau khi đoàn về.\n\n## Đến gần bằng sự tôn trọng\n\nMột ngôi nhà có những nhịp nhỏ của nó. Thời gian học, giờ ăn, khoảng nghỉ, người chăm sóc cần làm việc. Khi tìm hiểu một cơ sở, điều đáng học trước tiên có lẽ là cách mình bước vào mà không khiến người ở đó phải đổi hết nhịp sống để đón mình.\n\nChúng ta không cần biết hết câu chuyện riêng của từng em để có thể giúp. Một việc phù hợp, được thống nhất trước và làm cẩn thận, có thể có ích hơn một cuộc gặp đầy tò mò.\n\n## Để sự đồng hành có ngày tiếp theo\n\nMột cuốn sách, một kỹ năng, một công việc hậu cần chỉ thật sự phù hợp khi bắt đầu từ nhu cầu của nơi tiếp nhận. Câu hỏi đầu tiên không phải mình nên tặng gì cho đẹp, mà là mình có thể hỗ trợ phần nào đang cần.\n\n> Một đứa trẻ cần được thuộc về một nơi, chứ không chỉ được ghé thăm trong một buổi.\n\nPhần dưới giữ lại hồ sơ tham khảo của Làng trẻ em SOS Gò Vấp trong bản V9. Những chi tiết chưa được xác minh vẫn được ghi rõ; đây không phải tường thuật một chuyến đi của fanpage.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Một địa chỉ tại TP.HCM\n\nMột địa chỉ chăm sóc thay thế thuộc hệ thống SOS. Không dùng tổng số trẻ của toàn hệ thống để mô tả riêng Làng Gò Vấp.\n\n## Địa chỉ và cách xác nhận\n\n697 Quang Trung, phường 12, quận Gò Vấp, TP.HCM\n\nĐịa chỉ theo danh bạ SOS. Tên phường/quận là cách ghi trong nguồn; cần xác nhận trước khi đi.\n\n**Liên hệ:** (028) 3895 8504 · soscv.govap@sosvietnam.org\n\n## Số người được chăm sóc\n\nChưa xác minh số trẻ đang được chăm sóc tại riêng cơ sở.\n\nKhông lấy một con số cũ làm căn cứ mua quà. Hỏi trực tiếp số người dự kiến tham gia và nhu cầu tại ngày nhóm đến.\n\n## Gợi ý chuẩn bị để trao đổi\n\nTrao đổi về học liệu, kỹ năng và khả năng đồng hành định kỳ; không tự tổ chức đoàn đến gặp trẻ.\n\nĐề xuất không phải chương trình đã được cơ sở duyệt. Hãy thống nhất đầu mối, giờ đến, công việc được phép và quy định về ảnh trước khi triển khai.\n\n## Nguồn và thời điểm\n\nTra cứu 21/11/2026. Chưa gọi xác nhận trực tiếp.\n\n[SOS Việt Nam — danh bạ các làng](https://sosvietnam.org/tre-em-sos-children)","tags":["TP.HCM","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":true,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"7c3347b1-79b2-5085-a769-8eb9af8b861a","slug":"nha-duong-lao-vinh-son","title":"Bên cánh cổng Vinh Sơn, bắt đầu bằng một lời hỏi thăm","excerpt":"Đừng chỉ hỏi nên mang bao nhiêu phần quà. Thử hỏi thêm: một buổi gặp thế nào sẽ dễ chịu và vừa sức với ông bà?","category":"Mái ấm & địa chỉ","author":"Vì mình và bạn","cover_image":"https://bachkhoasaigon.edu.vn/wp-content/uploads/2022/05/sinh-vien-spc-tham-vien-duong-lao-vinh-son-1.jpg","image_caption":"Ảnh trong bài về chuyến thăm Vinh Sơn của sinh viên SPC ngày 15/05/2022; không phải ghi nhận hiện tại. Nguồn: Trường Trung cấp Bách Khoa Sài Gòn. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Có những địa chỉ chúng mình tìm vì muốn đem một phần quà đến. Nhưng trước khi chọn quà, có lẽ cần dừng lại ở một câu hỏi khác: mình muốn có mặt trong buổi gặp ấy như thế nào?\n\n## Một người để gặp, không chỉ một nơi để đến\n\nNgười cao tuổi có sở thích, lựa chọn và nhịp sống của riêng mình. Không phải ai cũng muốn trò chuyện dài, không phải ai cũng thích chương trình đông người. Một sự quan tâm có ý nghĩa nên bắt đầu từ quyền được chọn ấy.\n\nĐến thăm không phải để thay người khác định nghĩa niềm vui. Có khi cuộc gặp thích hợp là một nhóm nhỏ, một khoảng ngồi yên, một hoạt động đơn giản do nơi tiếp nhận hướng dẫn.\n\n## Món quà còn lại sau lúc chào\n\nMình có thể mang theo sự chuẩn bị: hỏi trước, làm đúng việc đã thống nhất, không tự ý hỗ trợ những thao tác cần chuyên môn. Và mang theo cả sự kiên nhẫn: nghe hết câu, không giục, không đòi một biểu cảm cảm động.\n\n> Người mình đến thăm không phải một hoàn cảnh để kể. Trước hết, đó là một con người để gặp.\n\nDưới đây là thông tin tham khảo đã có trong bản V9 về Nhà dưỡng lão tình thương Vinh Sơn tại TP.HCM. Lịch thăm và nhu cầu thực tế cần được xác nhận trực tiếp, không suy ra từ bài viết này.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Một địa chỉ tại TP.HCM\n\nMột địa chỉ chăm sóc người cao tuổi đã có hoạt động thăm hỏi, vệ sinh khuôn viên và giao lưu của sinh viên SPC.\n\n## Địa chỉ và cách xác nhận\n\n469 Nơ Trang Long (nối dài), phường 13, quận Bình Thạnh, TP.HCM\n\nTheo bài của Trường Trung cấp Bách Khoa Sài Gòn năm 2022; tên hành chính và việc tiếp đoàn cần xác nhận lại.\n\n**Liên hệ:** Chưa xác minh số tiếp đoàn hiện tại\n\n## Số người được chăm sóc\n\nNguồn đăng 18/05/2022 nêu hơn 60 cụ bà trên 70 tuổi. Đây là số liệu lịch sử; không khẳng định còn đúng hiện nay.\n\nKhông lấy một con số cũ làm căn cứ mua quà. Hỏi trực tiếp số người dự kiến tham gia và nhu cầu tại ngày nhóm đến.\n\n## Gợi ý chuẩn bị để trao đổi\n\nĐề xuất nhóm nhỏ trò chuyện, đọc sách hoặc dọn dẹp theo phân công; việc chăm sóc cá nhân cần người của cơ sở hướng dẫn.\n\nĐề xuất không phải chương trình đã được cơ sở duyệt. Hãy thống nhất đầu mối, giờ đến, công việc được phép và quy định về ảnh trước khi triển khai.\n\n## Nguồn và thời điểm\n\nTra cứu 21/11/2026. Chưa gọi xác nhận trực tiếp.\n\n[Trường Trung cấp Bách Khoa Sài Gòn — chuyến thăm Vinh Sơn, 18/05/2022](https://bachkhoasaigon.edu.vn/sinh-vien-spc-tham-vien-duong-lao-vinh-son.html)","tags":["TP.HCM","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"c03b713a-0d3d-520a-b141-9ff257f13f6b","slug":"benh-vien-nhi-dong-2","title":"Mang một chút dịu dàng đến Nhi Đồng 2","excerpt":"Có những sự hỗ trợ không cần bước vào phòng bệnh. Bắt đầu đúng đầu mối cũng là một cách ở gần gia đình đang cần giúp.","category":"Mái ấm & địa chỉ","author":"Vì mình và bạn","cover_image":"https://imgchinhsachcuocsong.vnanet.vn/MediaUpload/Org/2024/06/01/102051-vna_potal_ngay_quoc_te_thieu_nhi_16_lop_hoc_vui_ve_mang_niem_vui_den_benh_nhi_ung_thu_7406694.jpg","image_caption":"Ảnh về Lớp học vui vẻ tại Bệnh viện Nhi Đồng 2, nguồn đăng ngày 01/06/2024. Nguồn: Đinh Hằng / TTXVN. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Trước một hành trình điều trị của trẻ nhỏ, người đứng ngoài thường muốn làm điều gì đó ngay. Một túi quà, một lời động viên, một cuộc ghé thăm. Mong muốn ấy rất đáng quý; điều cần thêm là một cách thực hiện không đặt sự xúc động của mình lên trước sự thoải mái của em.\n\n## Đôi khi, quan tâm là biết hỏi trước\n\nBệnh viện không phải không gian của một chương trình cộng đồng thông thường. Người đến thăm cần đi theo quy định và hướng dẫn của đầu mối phụ trách. Có hoạt động phù hợp ở thời điểm này nhưng không phù hợp ở thời điểm khác.\n\nKhông được vào gặp trực tiếp không có nghĩa là không thể giúp. Hỏi về cách hỗ trợ qua đầu mối, nghe nhu cầu thật và chọn phần việc vừa sức có thể là cách đồng hành tốt hơn.\n\n## Để em không phải đáp lại sự mong đợi của mình\n\nNếu có một cuộc gặp được chấp thuận, mong chúng mình đừng mang theo yêu cầu em phải vui, phải cười hoặc kể chuyện. Trẻ được phép có cảm xúc của mình, gia đình được phép giữ điều riêng tư.\n\n> Một cuộc gặp tốt không nhất thiết để lại nhiều ảnh. Nó nên để lại ít áp lực hơn cho người được gặp.\n\nThông tin Bệnh viện Nhi Đồng 2 phía dưới được giữ từ nguồn đã dẫn trong bản V9. Bài viết không xác nhận một chương trình đang nhận đoàn, cũng không thay thế trao đổi trực tiếp với bệnh viện.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Một địa chỉ tại TP.HCM\n\nĐầu mối bệnh viện để tìm hiểu việc đồng hành cùng bệnh nhi. Không phải mái ấm hay nơi đến thăm tự do.\n\n## Địa chỉ và cách xác nhận\n\n14 Lý Tự Trọng, phường Sài Gòn, TP.HCM\n\nĐịa chỉ cơ sở chính theo trang liên hệ. Hỏi Phòng Công tác xã hội về đầu mối phối hợp thăm bệnh.\n\n**Liên hệ:** (028) 3829 5723 — tổng đài bệnh viện · benhviennhi@benhviennhi.org.vn\n\n## Số người được chăm sóc\n\nSố bệnh nhi thay đổi theo thời điểm và khoa; không công bố số ước đoán như số đang nằm viện.\n\nKhông lấy một con số cũ làm căn cứ mua quà. Hỏi trực tiếp số người dự kiến tham gia và nhu cầu tại ngày nhóm đến.\n\n## Gợi ý chuẩn bị để trao đổi\n\nLiên hệ bệnh viện, hỏi đúng khoa và thủ tục tiếp nhận chương trình; chỉ đến khi có xác nhận.\n\nĐề xuất không phải chương trình đã được cơ sở duyệt. Hãy thống nhất đầu mối, giờ đến, công việc được phép và quy định về ảnh trước khi triển khai.\n\n## Nguồn và thời điểm\n\nTra cứu 21/11/2026. Chưa gọi xác nhận trực tiếp.\n\n[Bệnh viện Nhi Đồng 2 — liên hệ](https://appbvnd2.benhviennhi.org.vn/contact)","tags":["TP.HCM","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"e789c395-1c49-5345-b6be-55a88813ed23","slug":"benh-vien-ung-buou-tphcm","title":"Đến bệnh viện, xin mang theo cả sự lắng nghe","excerpt":"Giữa mong muốn giúp ngay và điều người bệnh thật sự cần, có một bước không nên bỏ qua: hỏi đúng người, rồi nghe cho hết.","category":"Mái ấm & địa chỉ","author":"Vì mình và bạn","cover_image":"https://cdn2.tuoitre.vn/zoom/700_525/471584752817336320/2025/5/29/z66502190341530e612926c1484cc45882cd96b6e30956-1748500101950465380284-51-0-899-1620-crop-1748500322112254408298.jpg","image_caption":"Ảnh hoạt động tặng quà bệnh nhi tại Bệnh viện Ung Bướu TP.HCM, nguồn năm 2025. Nguồn: Báo Tuổi Trẻ. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Một địa chỉ bệnh viện có thể hiện lên rất nhanh trên màn hình. Nhưng để một sự giúp đỡ đến đúng nơi, chúng mình cần nhiều hơn đường đi: cần người phụ trách, sự thống nhất và hiểu biết về giới hạn của mình.\n\n## Lòng tốt cần một cách đến phù hợp\n\nMột nhóm có thể chuẩn bị rất nhiều nhưng vẫn chưa đúng điều nơi tiếp nhận đang cần. Hỏi trước không chỉ giúp tránh lãng phí. Nó còn là lời thừa nhận rằng người ở đó hiểu tình hình hơn người đang muốn đến.\n\nSự nhiệt tình có thể được chuyển thành nhiều phần việc, không nhất thiết là gặp trực tiếp người bệnh. Điều quan trọng là phần hỗ trợ được phối hợp, thông tin rõ ràng và không làm gián đoạn công việc chăm sóc.\n\n## Cất bớt những câu hỏi không cần thiết\n\nMình không cần biết bệnh án hay câu chuyện riêng của một gia đình để đối xử với họ bằng sự tôn trọng. Không phải điều gì được nghe trong một cuộc gặp cũng là điều được phép viết lại.\n\nCó lẽ sự dịu dàng thực tế nhất là đến với ít yêu cầu hơn: ít đòi chụp ảnh, ít mong phản ứng xúc động, ít lời khuyên khi chưa biết đủ.\n\n> Đôi khi, bước đầu tiên của một chuyến đi không phải lên xe. Đó là một cuộc gọi được lắng nghe đến cùng.\n\nHồ sơ Bệnh viện Ung Bướu TP.HCM cơ sở 2 dưới đây được giữ nguyên phần thông tin từ V9. Trước khi tổ chức hoạt động, cần xác nhận với bệnh viện; bài viết không phải lời mời đến thăm đã được phê duyệt.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Một địa chỉ tại TP.HCM\n\nĐịa chỉ y tế tại TP.HCM để trao đổi việc hỗ trợ người bệnh qua đầu mối chính thức. Không tự mang quà vào khoa.\n\n## Địa chỉ và cách xác nhận\n\n12 Đường 400, phường Tăng Nhơn Phú, TP.HCM\n\nTheo cổng thông tin bệnh viện. Cơ sở 1 có địa chỉ khác; phải xác nhận đúng cơ sở và khoa tiếp nhận.\n\n**Liên hệ:** (028) 3622 7722 — tổng đài · bvubhcm@gmail.com\n\n## Số người được chăm sóc\n\nChưa có số bệnh nhi đang điều trị tại một thời điểm được kiểm chứng cho trang này.\n\nKhông lấy một con số cũ làm căn cứ mua quà. Hỏi trực tiếp số người dự kiến tham gia và nhu cầu tại ngày nhóm đến.\n\n## Gợi ý chuẩn bị để trao đổi\n\nĐề nghị kết nối Phòng Công tác xã hội; hỏi nhu cầu được phép tiếp nhận và quy trình bàn giao.\n\nĐề xuất không phải chương trình đã được cơ sở duyệt. Hãy thống nhất đầu mối, giờ đến, công việc được phép và quy định về ảnh trước khi triển khai.\n\n## Nguồn và thời điểm\n\nTra cứu 21/11/2026. Chưa gọi xác nhận trực tiếp.\n\n[Bệnh viện Ung Bướu TP.HCM — cổng thông tin](https://benhvienungbuou.vn/cong-thong-tin-truyen-thong-benh-vien-ung-buou/)","tags":["TP.HCM","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"4c790b32-257e-5891-be0c-7d9e42cefafd","slug":"du-lieu-benh-nhi-ung-thu-viet-nam","title":"Đằng sau một con số, vẫn là một tuổi thơ","excerpt":"Dữ liệu giúp mình nhìn rộng. Nhưng khi đi từ thống kê đến một người cụ thể, cần giữ lại sự khiêm nhường và lòng tôn trọng.","category":"Dữ liệu Việt Nam","author":"Vì mình và bạn","cover_image":"https://suckhoedoisong.qltns.mediacdn.vn/thumb_w/730/324455921873985536/2026/8/2/hinh-bv-nhi-dong-2-2-8-17856301068881206613752.jpg","image_caption":"Ảnh minh họa bài viết về ung thư nhi, nguồn đăng 02/08/2026. Nguồn: N. Tâm / Sức khỏe & Đời sống. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Một con số có thể nằm gọn trên một dòng. Cuộc đời mà nó gợi đến thì không. Khi đọc về ung thư trẻ em, chúng mình cần cả khả năng nhìn rộng lẫn sự cẩn trọng để không biến mỗi em nhỏ thành một phần của câu chuyện buồn giống nhau.\n\n## Nhìn rõ để không nói quá\n\nSố mắc mới không phải số đang điều trị. Một ước tính không phải danh sách đã ghi nhận đầy đủ. Càng mong muốn kêu gọi sự quan tâm, mình càng cần giữ những khác biệt ấy rõ ràng.\n\nDữ liệu không cần được làm cho đáng sợ hơn để có ý nghĩa. Sự chính xác cũng là một dạng trách nhiệm với người đọc và với những gia đình đang sống trong hoàn cảnh được nhắc đến.\n\n## Từ bức tranh lớn đến một việc nhỏ\n\nSau khi đọc số liệu, có thể mình chưa biết làm gì ngay. Không sao. Bắt đầu bằng việc tìm một đầu mối chính thức, hỏi cách hỗ trợ phù hợp hoặc học cách tránh lan truyền thông tin chưa rõ cũng đã là đi về phía có ích.\n\nMột em nhỏ không cần được kể như minh chứng cho mọi khó khăn của hệ thống. Em có câu chuyện riêng, quyền riêng tư và những sở thích không liên quan đến bệnh.\n\n> Một con số giúp ta thấy quy mô. Một con người nhắc ta vì sao cần quan tâm.\n\nPhần số liệu dưới đây giữ nguyên năm, phạm vi và các giới hạn đã được ghi trong bản V9. Những dòng này không phải chẩn đoán, tư vấn điều trị hay dự báo cho một em nhỏ cụ thể.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Khoảng ước tính cần được đọc đúng\n\nBài của Sức khỏe & Đời sống ngày 02/08/2026 dẫn chuyên gia Bệnh viện Nhi Đồng 2 nêu khoảng 3.000–3.500 trường hợp ung thư trẻ em mỗi năm trên toàn quốc. Đây là ước tính được nguồn dẫn lại, không phải số bệnh nhi đang điều trị tại một thời điểm hoặc con số riêng TP.HCM.\n\n## Từ con số đến câu hỏi thực tế\n\nTrước khi tổ chức hỗ trợ, nhóm cần hỏi bệnh viện về nhu cầu cụ thể, cách tiếp nhận, khoa phối hợp và quy định thăm gặp. Không tính số phần quà cho một bệnh viện bằng cách chia tỷ lệ dân số từ con số toàn quốc.\n\n## Không biến dữ liệu thành lời hứa điều trị\n\nWebsite chỉ giới thiệu cách tìm đầu mối và chuẩn bị hoạt động. Không dùng tỷ lệ điều trị ở một nghiên cứu để bảo đảm kết quả cho từng trẻ. Các quyết định chăm sóc và điều trị thuộc đội ngũ chuyên môn.\n\n## Đọc tiếp theo mục đích\n\nTab Dữ liệu Việt Nam giải thích phạm vi và giới hạn của từng con số. Tab Bệnh nhi giới thiệu hai đầu mối bệnh viện tại TP.HCM và một khung chuẩn bị để trao đổi trước khi đến.\n\n## Nguồn\n\n[Sức khỏe & Đời sống, 02/08/2026](https://suckhoedoisong.vn/viet-nam-con-thieu-trung-tam-dieu-tri-ung-thu-nhi-16926080207314347.htm)","tags":["Dữ liệu Việt Nam","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"63ba115a-8e30-5ab3-821b-ee727eef00bd","slug":"du-lieu-nguoi-de-bi-ton-thuong-viet-nam","title":"Đừng cộng những nỗi khó thành một con số cho dễ nhớ","excerpt":"Người cao tuổi, trẻ thiếu sự chăm sóc và bệnh nhi không phải những nhóm có thể gộp tùy ý. Mỗi nhóm cần được nhìn đúng.","category":"Dữ liệu Việt Nam","author":"Vì mình và bạn","cover_image":"https://imgchinhsachcuocsong.vnanet.vn/MediaUpload/Org/2024/06/01/102223-vna_potal_ngay_quoc_te_thieu_nhi_16_lop_hoc_vui_ve_mang_niem_vui_den_benh_nhi_ung_thu_7406696.jpg","image_caption":"Ảnh về Lớp học vui vẻ tại Bệnh viện Nhi Đồng 2, nguồn đăng ngày 01/06/2024. Nguồn: Đinh Hằng / TTXVN. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Có những lúc một con số lớn khiến chúng mình dừng lại. Nhưng nếu không biết nó nói về ai, vào năm nào và được tính ra sao, sự xúc động ấy có thể dẫn tới một cách hiểu sai.\n\n## Không phải mọi người lớn tuổi đều cô đơn\n\nTuổi tác không tự kể hết hoàn cảnh. Một người sống trong cơ sở chăm sóc không vì vậy mà không có gia đình. Một trẻ cần hỗ trợ không nhất thiết thuộc cùng nhóm với những em khác. Để quan tâm đúng, trước hết đừng để một nhãn gọi thay cho cả cuộc đời.\n\nCác nhóm có thể chồng lấp; những chỉ tiêu được đo trong các năm khác nhau có thể không so được trực tiếp. Nếu cộng cho ra một tổng thật lớn nhưng mất ý nghĩa, chúng mình không làm người đọc hiểu rõ hơn.\n\n## Sự trung thực cũng biết nói chưa biết\n\nCó thông tin chưa có nguồn phù hợp để ghi. Chừa một chỗ trống có giải thích không phải thiếu lòng quan tâm. Ngược lại, đó là cách tránh để mong muốn giúp người khác biến thành việc lan truyền một con số không chắc.\n\nBiết một điều chưa được xác minh giúp chúng mình hỏi tốt hơn: cần liên hệ ai, xác nhận điều gì, đâu là số liệu lịch sử và đâu là nhu cầu hôm nay.\n\n> Dữ liệu để nhìn rõ hơn, không phải để làm nỗi khó của con người lớn thêm trên màn hình.\n\nPhần dưới giữ lại nội dung dữ liệu có nguồn của V9. Danh bạ địa điểm vẫn chỉ ở TP.HCM; số liệu quốc gia được ghi đúng phạm vi Việt Nam, không đổi thành số của thành phố.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Người cao tuổi không đồng nghĩa người cơ nhỡ\n\nĐiều tra dân số và nhà ở giữa kỳ 2024 nêu dân số Việt Nam tại 01/04/2024 là 101.112.656 người; nhóm từ 60 tuổi trở lên khoảng 14,2 triệu. Đây là số dân theo tuổi, không phải số người sống một mình hoặc không nơi nương tựa.\n\n## Ung thư trẻ em là một chỉ tiêu khác\n\nKhoảng 3.000–3.500 trường hợp mỗi năm được nguồn y tế tháng 08/2026 dẫn như một ước tính toàn quốc. Không cộng số này với dân số cao tuổi để tạo ra một tổng số người cần thiện nguyện.\n\n## Những chỗ chưa có đủ căn cứ\n\nTrang chưa xác minh được tổng số người cơ nhỡ toàn quốc theo một định nghĩa và thời điểm thống nhất. Số trẻ có hoàn cảnh đặc biệt trong các công bố cũ cũng không được gắn lại thành số liệu hiện tại. Khi chưa có căn cứ, ghi rõ chưa xác minh tốt hơn điền một con số tạo cảm giác đầy đủ.\n\n## Dữ liệu phục vụ hành động như thế nào?\n\nDùng để nhận ra nhu cầu hỗ trợ có thể kéo dài, từ đó chuẩn bị nhóm và cách giữ liên lạc. Với số người tại một mái ấm, hãy hỏi trực tiếp và ghi ngày xác nhận; không dùng sức chứa hoặc số giường thay cho số người hiện có.\n\n## Nguồn\n\n[Cục Thống kê — thông cáo Điều tra dân số giữa kỳ 2024](https://www.nso.gov.vn/du-lieu-va-so-lieu-thong-ke/2025/01/thong-cao-bao-chi-ket-qua-dieu-tra-dan-so-va-nha-o-giua-ky-nam-2024/)\n\n[Sức khỏe & Đời sống — ung thư nhi, 02/08/2026](https://suckhoedoisong.vn/viet-nam-con-thieu-trung-tam-dieu-tri-ung-thu-nhi-16926080207314347.htm)","tags":["Dữ liệu Việt Nam","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"b4fd8784-ce13-5a42-ad41-dcc4375c77ab","slug":"dong-goi-ngay-tu-te","title":"Những người không có mặt trong bức ảnh cuối cùng","excerpt":"Trước lúc phần quà được trao đi, đã có người ở lại kiểm từng chiếc túi. Có những sự đóng góp chưa từng cần đứng ở hàng đầu.","category":"Sinh viên thiện nguyện","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/chuong_trinh_trang_sach_nho_the_gioi_lon_tai_lang_tre_em_sos_go_vap_b_2980b70dd4.jpg","image_caption":"Ảnh chương trình Trang sách nhỏ – Thế giới lớn tại Làng trẻ em SOS Gò Vấp, theo nguồn năm 2025. Nguồn: Hùng Anh / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Bức ảnh cuối một chương trình thường ghi lại lúc mọi thứ đã sẵn sàng: hàng quà xếp gọn, người tham gia đứng cạnh nhau, một khoảng thời gian được giữ lại để nhớ.\n\nNhưng trước khoảnh khắc ấy đã có rất nhiều việc nhỏ. Người đi mua thêm thứ còn thiếu. Người ngồi phân loại. Người ghi lại từng khoản. Người kiểm xem chiếc túi này có giống chiếc túi kia không, liệu món bên trong đã đúng điều nơi tiếp nhận cần chưa.\n\nCó người không thể đi chuyến xe hôm ấy. Nhưng sự có mặt của họ vẫn đi cùng.\n\n## Tấm lòng cũng có thể mang hình một bảng kiểm\n\nThiện nguyện thường được kể bằng cảm xúc. Nhưng cảm xúc cần những việc khô khan để đi đến nơi: một danh sách không sai, một cuộc gọi được trả lời, một mốc giờ được nhớ, một món đồ được kiểm trước khi bàn giao.\n\nLàm kỹ không khiến lòng tốt bớt ấm. Nó khiến người nhận bớt phải xử lý những rắc rối mà người cho vô tình để lại.\n\nGấp lại chiếc áo, nhìn hạn dùng, hỏi đúng nhu cầu. Những thao tác ấy là cách nói rằng người nhận xứng đáng với sự cẩn thận, chứ không phải bất cứ thứ gì mình đang có sẵn.\n\n## Đừng chỉ nhớ người cầm phần quà\n\nMột nhóm sẽ ấm hơn nếu biết nhìn cả người ít nói. Người không giỏi đứng trước đám đông vẫn có thể là người giữ mọi việc ổn định. Người không chụp được ảnh đẹp vẫn có thể làm nên một chuyến đi đẹp bằng sự đúng giờ và trách nhiệm.\n\nKhông phải ai cũng cần được đưa lên một bài cảm ơn công khai. Nhưng ai cũng đáng được ghi nhận theo cách phù hợp. Một lời nói trực tiếp, một lần hỏi xem bạn có quá tải không, một sự chia việc công bằng đều có ý nghĩa.\n\nĐừng để thiện nguyện trở thành nơi một vài người luôn phải âm thầm bù cho sự thiếu chuẩn bị của cả nhóm.\n\n## Khi công việc xong, vẫn còn một lời cảm ơn\n\nSau chuyến đi, trước khi chuyển ngay sang kế hoạch mới, hãy nhìn lại những người đã giúp công việc thành hình. Điều gì đã thuận lợi? Chỗ nào khiến bạn phải xoay xở một mình? Lần sau mình có thể san sẻ tốt hơn thế nào?\n\nMột cộng đồng được giữ lại không chỉ bằng mục tiêu chung. Nó còn được giữ bằng cách các thành viên đối xử với công sức của nhau.\n\n> Một phần quà đến nơi bằng nhiều bàn tay hơn số người có mặt lúc trao.\n\nCảm ơn những người không xuất hiện trong bức ảnh cuối. Không có mặt trong khung hình không có nghĩa là vắng mặt trong điều tử tế đã được làm nên.","tags":["Hậu cần","Quà tặng","Sinh viên","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"899492b3-3c66-5145-a647-82e210e902d4","slug":"lam-sach-khong-gian-chung","title":"Sau buổi tình nguyện, con đường vẫn ở đó","excerpt":"Khi đoàn đã về, người khác vẫn đi qua khoảng sân ấy mỗi ngày. Có những việc tốt được đo bằng sự dễ chịu còn lại, không phải tiếng vỗ tay.","category":"Sinh viên thiện nguyện","author":"Vì mình và bạn","cover_image":"https://bachkhoasaigon.edu.vn/wp-content/uploads/2022/05/sinh-vien-spc-tham-vien-duong-lao-vinh-son-4.jpg","image_caption":"Ảnh trong bài về chuyến thăm Vinh Sơn của sinh viên SPC ngày 15/05/2022; không phải ghi nhận hiện tại. Nguồn: Trường Trung cấp Bách Khoa Sài Gòn. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Một buổi dọn dẹp có thể không mang dáng vẻ của câu chuyện khiến người ta xúc động ngay. Không có lời phát biểu, không có món quà được mở. Chỉ có những người cùng nhau làm một khoảng không gian trở nên gọn hơn.\n\nNhưng thử đặt mình vào người sẽ dùng nơi ấy ngày mai. Lối đi bớt vướng. Góc sân sạch hơn. Đồ dùng được trả về đúng chỗ. Những điều nhỏ ấy đi vào một ngày sống rất thật của ai đó.\n\n## Điều có ích không luôn trông nổi bật\n\nChúng mình quen nhìn việc tốt qua khoảnh khắc trao và nhận. Vì vậy những việc không có người nhận đứng trước mặt dễ bị xem nhẹ. Một chỗ sinh hoạt được làm sạch, một kho đồ được sắp lại, một phần việc hậu cần được hoàn tất cũng là sự chăm chút cho con người.\n\nKhông phải để tự khen mình đã hy sinh. Chỉ để thấy rằng công sức có nhiều cách chạm tới người khác, kể cả khi không có ai nói cảm ơn ngay lúc ấy.\n\nĐôi khi, việc tốt nhất là việc được làm đủ gọn để người ở lại không phải dọn tiếp sau một đoàn đông.\n\n## Học nhìn những người vẫn làm mỗi ngày\n\nMột buổi tình nguyện còn có thể giúp mình hiểu hơn công việc thường ngày của người khác. Những người giữ vệ sinh, sắp xếp đồ đạc, chăm một khuôn viên không chỉ làm trong lúc có chiến dịch.\n\nSau khi tự làm một phần việc, mình có thể bớt coi sự sạch sẽ là điều tự nhiên mà có. Bớt để lại rác vì nghĩ sẽ có người nhặt. Bớt đặt thêm công việc lên vai những người vốn đã âm thầm làm rất nhiều.\n\nNếu sự thay đổi ấy theo mình về nhà, buổi tình nguyện không chỉ làm sạch một nơi. Nó còn làm cách mình sống cẩn thận hơn.\n\n## Một kết thúc không cần ồn ào\n\nTrước khi rời đi, hỏi người phụ trách xem phần việc đã ổn chưa. Thu lại dụng cụ, kiểm những gì còn sót, không bỏ lại một thứ khó xử lý. Mình không phải người hiểu nơi đó nhất, nên cần để người sử dụng có tiếng nói cuối cùng.\n\nCó thể chẳng có bức ảnh nào thật đặc biệt. Nhưng một khoảng sân được trả lại trong tình trạng dễ dùng hơn vẫn là điều đáng nhớ.\n\n> Việc mình làm xong hôm nay có thể là một chút dễ chịu trong ngày mai của người khác.\n\nCon đường vẫn ở đó sau khi chuyến xe rời đi. Mong thứ chúng mình để lại không chỉ là một dấu chân, mà là sự chăm chút khiến những bước chân tiếp theo nhẹ hơn một chút.","tags":["Môi trường","Tình nguyện","Lao động công ích","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"d067872a-9ab8-514a-bd5a-d8ec7e4fd196","slug":"giu-lai-ngay-vui-cho-tre-trong-benh-vien","title":"Giữ lại cho em một ngày chỉ để làm trẻ nhỏ","excerpt":"Ngoài những câu hỏi về sức khỏe, em còn có thể thích vẽ, thích nghe truyện hoặc chẳng muốn làm gì. Hãy dành chỗ cho những điều rất trẻ con ấy.","category":"Bệnh nhi ung thư","author":"Vì mình và bạn","cover_image":"https://cdn.tuoitre.vn/471584752817336320/2024/9/11/ntal5601-1726038133605730172631.jpg","image_caption":"Ảnh chương trình Trung thu tại Bệnh viện Ung Bướu TP.HCM, nguồn năm 2024. Nguồn: Mực Tím / Tuổi Trẻ. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Một đứa trẻ đang điều trị bệnh không chỉ có những ngày gắn với bệnh. Trong cách người lớn đến gần em, vẫn có thể dành chỗ cho màu sắc, câu chuyện, một sở thích hoặc một khoảng yên.\n\nĐiều ấy không có nghĩa là giả vờ mọi khó khăn không tồn tại. Chỉ là đừng để bệnh trở thành điều duy nhất chúng mình nhìn thấy khi nhìn em.\n\n## Một cuộc gặp không đặt thành tích lên trước\n\nKhi tổ chức hoạt động cho bệnh nhi, người lớn có thể mong chương trình thật vui, trẻ tham gia đông, sản phẩm làm ra đẹp. Nhưng một em nhỏ không có trách nhiệm hoàn thành kỳ vọng ấy.\n\nCó em chỉ muốn nghe nửa câu chuyện. Có em muốn đổi màu giữa chừng. Có em không muốn chơi. Một hoạt động được bệnh viện đồng ý cần có đủ linh hoạt để những lựa chọn ấy được tôn trọng.\n\nKhông phải mọi niềm vui đều cần diễn ra trước mặt mình. Đôi khi món đồ phù hợp được trao qua người phụ trách, để em dùng vào lúc thuận tiện, lại tốt hơn một chương trình buộc em theo đúng giờ của đoàn.\n\n## Tử tế còn là biết lùi lại\n\nNhiệt tình không phải giấy phép để vào mọi không gian. Trong bệnh viện, sự phối hợp với nhân viên và người chăm sóc luôn đi trước mong muốn giao lưu của người đến thăm.\n\nNếu được đề nghị kết thúc sớm, mình kết thúc sớm. Nếu một hoạt động không phù hợp, mình chọn cách khác. Không xem lời từ chối là sự thiếu đón nhận, vì người tổ chức không phải trung tâm của buổi gặp.\n\nGiữ lại một ngày nhẹ hơn cho em có thể bắt đầu từ việc người lớn biết bớt đi sự hiện diện của chính mình.\n\n## Một điều bình thường cũng đáng được gìn giữ\n\nMột trang truyện được đọc dở, một nét vẽ chưa thành hình, một câu chuyện không liên quan đến điều trị: những điều rất nhỏ ấy nhắc mình rằng tuổi thơ không cần luôn mang ý nghĩa lớn.\n\nEm không phải biến mỗi ngày thành một câu chuyện vượt khó. Không cần lúc nào cũng làm người lớn cảm phục. Nếu có thể, mong em được cười vì thấy vui, chứ không phải vì biết mọi người đang chờ một nụ cười.\n\nChúng mình cũng không nên hứa rằng một hoạt động sẽ làm em quên hết mệt mỏi. Điều mình có thể chịu trách nhiệm là cách chuẩn bị, cách lắng nghe và sự tôn trọng giới hạn của buổi gặp.\n\n> Không phải lúc nào mình cũng làm ngày của em vui hơn. Nhưng mình có thể đừng khiến ngày ấy nặng thêm.\n\nMột ngày chỉ để làm trẻ nhỏ là một điều đẹp để hướng tới. Không phải món quà người lớn ban xuống, mà là khoảng không gian người lớn cố gắng giữ cho em.","tags":["Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"5c07e695-d41e-58f0-b1db-fa713c375bfe","slug":"sinh-vien-co-the-gop-gi","title":"Bạn chưa có nhiều tiền. Bạn vẫn có điều để trao.","excerpt":"Một người biết ghi chép, một người biết sửa đồ, một người kiên nhẫn đọc sách cùng trẻ. Không phải sự đóng góp nào cũng có thể ghi thành một con số.","category":"Sinh viên thiện nguyện","author":"Vì mình và bạn","cover_image":"https://bachkhoasaigon.edu.vn/wp-content/uploads/2022/05/sinh-vien-spc-tham-vien-duong-lao-vinh-son.jpg","image_caption":"Ảnh trong bài về chuyến thăm Vinh Sơn của sinh viên SPC ngày 15/05/2022; không phải ghi nhận hiện tại. Nguồn: Trường Trung cấp Bách Khoa Sài Gòn. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Có một câu khiến nhiều người đứng ngoài việc thiện nguyện lâu hơn mình nghĩ: khi nào có điều kiện, mình sẽ tham gia.\n\nĐiều kiện ấy đôi khi rất thật. Lịch học dày, công việc chưa ổn, chính mình còn cần được giúp. Không ai phải thấy có lỗi vì chưa thể cho đi. Nhưng cũng có khi, chúng mình chờ vì tưởng mọi sự đóng góp đều bắt đầu từ tiền.\n\n## Những điều mình đã biết có thể hữu ích ở nơi khác\n\nBiết sắp xếp một bảng thông tin. Biết đọc truyện với giọng chậm. Biết sửa một lỗi nhỏ trong máy tính. Biết gọi điện và ghi lại câu trả lời rõ ràng. Những kỹ năng bình thường trong đời sống của mình có thể trở thành một phần việc có ích khi được dùng đúng nơi.\n\nKhông phải biến ai cũng thành người đa năng. Trái lại, một nhóm tốt cần nhìn ra mỗi người làm được gì, không làm được gì và muốn học thêm điều gì.\n\nCó những việc chỉ nên để người có chuyên môn thực hiện. Khi biết dừng đúng giới hạn, mình đang đóng góp bằng sự có trách nhiệm, không phải bằng sự thiếu nhiệt tình.\n\n## Đừng so tấm lòng bằng độ lớn của phần góp\n\nTrong một chương trình, có người góp nhiều tiền, có người góp một buổi, có người không đi được nhưng chuẩn bị phía sau. Khác nhau về nguồn lực không tạo ra thứ bậc về phẩm giá.\n\nMột sinh viên dành phần thời gian có thể thu xếp được không cần phải xin lỗi vì chưa làm hơn. Một người đang chăm sóc gia đình mình cũng đang làm công việc có giá trị, dù không xuất hiện trong hoạt động cộng đồng.\n\nSự tử tế nên mở một cánh cửa vừa sức, chứ không tạo thêm cuộc đua xem ai hy sinh nhiều hơn.\n\n## Chọn một việc, rồi làm đến nơi\n\nBắt đầu nhỏ có một ưu điểm: mình có thể hiểu rõ trách nhiệm đã nhận. Nếu nhận việc ghi chép, hãy làm cho người sau đọc được. Nếu nhận việc liên hệ, hãy báo lại cả lúc chưa có câu trả lời. Nếu không tiếp tục được, nói sớm để nhóm sắp xếp.\n\nSự tin cậy thường được tạo từ những điều như vậy. Không rực rỡ, nhưng giúp người khác yên tâm làm phần việc của họ.\n\n> Bạn không cần trở thành một người khác để bắt đầu. Hãy bắt đầu bằng điều mình làm được, và làm cho tử tế.\n\nRồi có thể, sau một thời gian, bạn sẽ thấy mình học được nhiều hơn thứ đã mang đi. Không phải để nhận một phần thưởng cho lòng tốt, mà bởi khi cùng người khác làm một việc có ích, mình cũng lớn lên trong cách nhìn và cách sống.","tags":["Kỹ năng","Sinh viên","Phân vai","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"3ca9b16d-bfb8-5b0f-986f-62a2dc31f01d","slug":"ban-do-dia-chi-tham-khao","title":"Bảy cánh cửa ở TP.HCM, và một cách bước vào","excerpt":"Một danh bạ giúp mình biết nơi cần tìm hiểu. Cách mình bước vào nơi ấy mới quyết định sự đồng hành có dễ chịu và hữu ích hay không.","category":"Mái ấm & địa chỉ","author":"Vì mình và bạn","cover_image":"https://vluwebmedia.s3.ap-southeast-1.amazonaws.com/chuong_trinh_trang_sach_nho_the_gioi_lon_tai_lang_tre_em_sos_go_vap_e_3ca88e7677.jpg","image_caption":"Ảnh chương trình Trang sách nhỏ – Thế giới lớn tại Làng trẻ em SOS Gò Vấp, theo nguồn năm 2025. Nguồn: Hùng Anh / Đại học Văn Lang. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Có thể điều đầu tiên bạn tìm là một địa chỉ. Một nơi đủ gần để cả nhóm đến được, một đầu mối có thể gọi, một việc có thể bắt đầu trong khả năng.\n\nDanh bạ giúp mở cánh cửa ấy. Nhưng phía sau mỗi tên gọi là một không gian đang có người sống, học tập, làm việc hoặc điều trị. Với mình, đó là điểm đến của một chuyến đi. Với họ, đó là một phần đời sống hằng ngày.\n\n## Hỏi trước khi mang lòng tốt đến\n\nKhông có một món quà chung phù hợp với tất cả. Không có một lịch sinh hoạt chung cho mái ấm, cơ sở dưỡng lão và bệnh viện. Lắng nghe người phụ trách là cách để sự chuẩn bị bớt dựa trên điều mình tưởng.\n\nMột cuộc gọi có thể giúp nhóm nhận ra cần ít người hơn, một ngày khác hơn, hoặc một loại hỗ trợ hoàn toàn khác với dự tính. Thay đổi kế hoạch khi biết thêm không làm công sức mất đi; nó giúp công sức đến đúng nơi.\n\n## Chọn một việc có thể theo tới cuối\n\nKhông cần đi hết danh sách. Một mối liên hệ được giữ cẩn thận, một việc nhỏ được hoàn tất có thể bền hơn nhiều chuyến đi vội.\n\nNếu hôm nay chỉ mới tìm hiểu, hãy cho phép mình làm bước ấy cho kỹ. Kiểm tra thông tin, trao đổi lịch, nói rõ khả năng của nhóm. Sự có trách nhiệm bắt đầu từ những điều chưa có ảnh để đăng.\n\n> Đến một nơi để giúp, hãy bắt đầu bằng việc hỏi mình được phép làm gì.\n\nBảy đầu mối dưới đây được giữ từ bản V9, kèm nguồn và điểm cần xác nhận. Không phải tất cả đều đang tiếp nhận đoàn hoặc có nhu cầu giống nhau; danh sách là nơi bắt đầu tìm hiểu, không phải lịch thăm đã được đồng ý.\n\n## Hồ sơ và thông tin đối chiếu\n\n## Chỉ tập trung tại TP.HCM\n\nDanh bạ của website có 7 địa điểm tham khảo. Đây là phạm vi biên soạn của trang, không phải tổng số cơ sở trợ giúp của thành phố.\n\n## Làng trẻ em SOS Gò Vấp\n\n697 Quang Trung, phường 12, quận Gò Vấp, TP.HCM\n\nĐịa chỉ theo danh bạ SOS. Tên phường/quận là cách ghi trong nguồn; cần xác nhận trước khi đi.\n\nChưa xác minh số trẻ đang được chăm sóc tại riêng cơ sở.\n\n[Nguồn chính](https://sosvietnam.org/tre-em-sos-children)\n\n## Trung tâm Nuôi dưỡng Bảo trợ trẻ em Gò Vấp\n\n45 Nguyễn Văn Bảo, phường Hạnh Thông, TP.HCM\n\nTheo thông tin chuyến công tác của Bệnh viện Y học cổ truyền TP.HCM ngày 13/10/2025.\n\nChưa có số đang nuôi dưỡng được xác nhận trong nguồn đã kiểm tra.\n\n[Nguồn chính](https://www.yhct.vn/tin-tuc/hoat-dong/benh-vien-y-hoc-co-truyen-tphcm-to-chuc-kham-tu-thien-tai-trung-tam-nuoi-duong-bao-tro-tre-em-go-vap)\n\n## Thiên Phước — cơ sở An Phú Đông\n\n156 An Phú Đông 11, phường An Phú Đông, Quận 12, TP.HCM\n\nWebsite cơ sở ghi như trên; Caritas Sài Gòn ghi 156 Võ Thị Liễu. Hai nguồn khác tên đường, cần gọi xác nhận cổng đến.\n\nChưa xác minh số trẻ hiện đang lưu trú ở riêng cơ sở An Phú Đông.\n\n[Nguồn chính](https://english.thienphuoccharity.com/visit-the-kids.html)\n\n## Nhà dưỡng lão tình thương Vinh Sơn\n\n469 Nơ Trang Long (nối dài), phường 13, quận Bình Thạnh, TP.HCM\n\nTheo bài của Trường Trung cấp Bách Khoa Sài Gòn năm 2022; tên hành chính và việc tiếp đoàn cần xác nhận lại.\n\nNguồn đăng 18/05/2022 nêu hơn 60 cụ bà trên 70 tuổi. Đây là số liệu lịch sử; không khẳng định còn đúng hiện nay.\n\n[Nguồn chính](https://bachkhoasaigon.edu.vn/sinh-vien-spc-tham-vien-duong-lao-vinh-son.html)\n\n## Trung tâm Dưỡng lão Thị Nghè\n\n153 Xô Viết Nghệ Tĩnh, phường Gia Định, TP.HCM\n\nTheo trang liên hệ của Trung tâm Dưỡng lão Thị Nghè.\n\nChưa xác minh số người đang được chăm sóc; không dùng quy mô phòng/giường làm số người thực tế.\n\n[Nguồn chính](https://duonglaothinghe.org/index.php?action=lien-he)\n\n## Bệnh viện Nhi Đồng 2\n\n14 Lý Tự Trọng, phường Sài Gòn, TP.HCM\n\nĐịa chỉ cơ sở chính theo trang liên hệ. Hỏi Phòng Công tác xã hội về đầu mối phối hợp thăm bệnh.\n\nSố bệnh nhi thay đổi theo thời điểm và khoa; không công bố số ước đoán như số đang nằm viện.\n\n[Nguồn chính](https://appbvnd2.benhviennhi.org.vn/contact)\n\n## Bệnh viện Ung Bướu TP.HCM — cơ sở 2\n\n12 Đường 400, phường Tăng Nhơn Phú, TP.HCM\n\nTheo cổng thông tin bệnh viện. Cơ sở 1 có địa chỉ khác; phải xác nhận đúng cơ sở và khoa tiếp nhận.\n\nChưa có số bệnh nhi đang điều trị tại một thời điểm được kiểm chứng cho trang này.\n\n[Nguồn chính](https://benhvienungbuou.vn/cong-thong-tin-truyen-thong-benh-vien-ung-buou/)\n\n## Trước khi tổ chức\n\nHỏi đúng đầu mối, nhu cầu hiện tại, số người tham gia, lịch tiếp đoàn và quy định ghi hình. Đừng tự dùng một địa chỉ công khai làm sự đồng ý tiếp nhận đoàn.","tags":["TP.HCM","Tổng hợp nguồn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":4},{"id":"fb9d0b61-e607-596c-ae88-52ba2c3cce7d","slug":"thien-nguyen-co-tinh-te","title":"Có những bức ảnh đẹp nhất là bức ảnh không chụp","excerpt":"Khi một người không muốn xuất hiện trong khung hình, cất điện thoại đi không làm câu chuyện kém ý nghĩa. Có khi đó mới là phần tử tế nhất.","category":"Góc sẻ chia","author":"Vì mình và bạn","cover_image":"https://imgchinhsachcuocsong.vnanet.vn/MediaUpload/Org/2024/06/01/102410-vna_potal_ngay_quoc_te_thieu_nhi_16_lop_hoc_vui_ve_mang_niem_vui_den_benh_nhi_ung_thu_7406695.jpg","image_caption":"Ảnh về Lớp học vui vẻ tại Bệnh viện Nhi Đồng 2, nguồn đăng ngày 01/06/2024. Nguồn: Đinh Hằng / TTXVN. Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Một chuyến đi có thể chứa nhiều khoảnh khắc khiến mình muốn giữ lại. Một bàn tay, một ánh nhìn, một cuộc trò chuyện. Nhưng giữa mong muốn lưu giữ và quyền được chụp luôn có một khoảng cách cần được hỏi rõ.\n\nNgười xuất hiện trong ảnh không phải phần minh họa cho lòng tốt của mình. Họ có một cuộc sống ngoài chuyến đi, có những điều muốn giữ riêng và có quyền thay đổi ý định.\n\n## Cảm xúc không thay cho sự đồng ý\n\nMình có thể thấy một khoảnh khắc rất đẹp. Người trong khoảnh khắc ấy có thể thấy mình đang mệt, chưa sẵn sàng hoặc không muốn người khác biết hoàn cảnh của mình. Hai cảm nhận đó đều có thật, nhưng chỉ cảm xúc của người chụp thì chưa đủ.\n\nHỏi trước khi chụp và trao đổi về việc đăng là hai việc khác nhau. Với trẻ em, còn cần đi theo hướng dẫn của người giám hộ và nơi chăm sóc, đồng thời tôn trọng sự thoải mái của chính trẻ.\n\nNếu không được đồng ý, một lời cảm ơn và chiếc điện thoại được cất đi là cách kết thúc trọn vẹn. Không nài, không làm người đối diện phải giải thích vì sao.\n\n## Vẫn có nhiều cách kể một chuyến đi\n\nCó thể kể về công việc đã thống nhất, điều nhóm học được, phần hậu cần cần cải thiện. Có thể chụp những vật dụng, góc không gian được phép, hoặc chính phần việc của nhóm mà không làm lộ người khác.\n\nMột bài viết không có gương mặt đẫm nước mắt vẫn có thể chạm lòng. Thậm chí, khi không dựa vào nỗi đau của ai để tạo cảm xúc, người viết buộc phải nhìn sâu hơn vào giá trị của hành động.\n\nCâu chuyện có thể là sự kiên nhẫn, cách giữ lời, cách người trẻ học cùng nhau. Những điều ấy đủ đáng kể mà không cần ai phải đánh đổi sự riêng tư.\n\n## Giữ lại một điều cho riêng cuộc gặp\n\nKhông phải mọi trải nghiệm đều cần được chuyển thành nội dung. Có một phần của đời sống nên được phép chỉ ở lại với những người đã có mặt.\n\nMột lời tâm sự được nghe không tự nhiên trở thành lời được phép trích. Một tình huống làm mình nghẹn ngào không tự nhiên trở thành đoạn mở đầu cho bài đăng. Khi không chắc, hãy hỏi lại hoặc chọn không kể.\n\n> Không phải điều gì làm mình xúc động cũng trở thành điều mình có quyền công khai.\n\nCó những bức ảnh đẹp nhất là bức ảnh không chụp. Bởi bên ngoài khung hình đã được từ bỏ ấy, một người vẫn giữ được quyền chọn cách mình xuất hiện trong thế giới. Và sự tử tế, lần này, đã không lấy đi điều gì để chứng minh mình tồn tại.","tags":["Ứng xử","Tôn trọng","Thiện nguyện","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"c19f51ad-9448-5dcf-a4ab-ff8807199c7f","slug":"logistics-cua-mot-chuyen-di","title":"Sau khi chuyến xe về, xin đừng để lòng tốt dừng lại","excerpt":"Quà đã trao xong không có nghĩa mọi việc đã xong. Còn một lời cảm ơn, một phần ghi chép và những điều mình đã nhận trách nhiệm theo đến cùng.","category":"Góc sẻ chia","author":"Vì mình và bạn","cover_image":"https://user-cdn.uef.edu.vn/newsimg/hinhanh/2024/vi-cong-dong/ueftangqua-benhvien-ungbuou%20%288%29.jpg","image_caption":"Ảnh trong bài UEF về hoạt động dành cho bệnh nhi tại Bệnh viện Ung Bướu TP.HCM. Nguồn: Trường Đại học Kinh tế – Tài chính TP.HCM (UEF). Ảnh tư liệu hoạt động của đơn vị nguồn, không phải của fanpage.","content":"Chuyến xe trở về thường mang một nhịp khác lúc khởi hành. Những câu chuyện trong ngày lắng xuống, đồ đạc được đặt gọn, mỗi người dần trở lại với lịch học và công việc của mình.\n\nNhưng một hoạt động không hẳn kết thúc khi xe dừng. Có thể còn phần đồ cần bàn giao, thông tin cần xác nhận, một cuộc gọi đã hẹn sẽ trả lời. Những việc ấy ít cảm xúc hơn phút gặp gỡ, nhưng lại nói nhiều về cách mình hiểu sự đồng hành.\n\n## Đừng để người ở lại phải đoán\n\nNếu nhóm đã nhận một việc, nơi tiếp nhận cần biết nó đã đến đâu. Xong thì báo xong. Chưa làm được thì nói rõ. Một lời cập nhật đơn giản giúp người khác không phải chờ điều mình đã quên.\n\nKhi có đóng góp, việc ghi chép và đối chiếu cần được thực hiện theo đúng cách đã thống nhất. Không dùng sự xúc động của chuyến đi để thay cho thông tin rõ ràng. Minh bạch không làm tình cảm lạnh đi; nó giúp niềm tin có chỗ đứng vững hơn.\n\nĐôi khi điều tử tế nhất sau một chương trình là ngồi lại thêm một buổi, làm nốt những việc chẳng còn ai muốn chụp ảnh.\n\n## Điều gì thật sự có ích?\n\nMột cuộc nhìn lại nên có chỗ cho cả điều chưa tốt. Nhóm có đến quá đông không? Có phần việc nào tạo thêm gánh nặng cho người phụ trách? Có thứ mình tưởng cần nhưng hóa ra chưa phù hợp?\n\nHỏi những câu ấy không phải để phủ nhận công sức. Đó là cách tôn trọng người được hỗ trợ và cả người đã đóng góp. Lần sau tốt hơn không nhất thiết là quy mô lớn hơn; có khi là gọn hơn, đúng nhu cầu hơn, ít làm xáo trộn hơn.\n\nCũng nên hỏi các thành viên có mệt quá không. Một hành trình bền không được xây bằng việc vài người luôn phải gồng lên thay cả nhóm.\n\n## Giữ lại một việc nhỏ sau cảm xúc lớn\n\nKhông phải ai cũng có thể quay lại thường xuyên. Nhưng sau chuyến đi, mình có thể giữ một thói quen: trả lời lời nhắn đã nhận, giữ đúng việc đã hứa, hỏi trước khi quyết định thay người khác.\n\nĐó là cách thiện nguyện bước ra khỏi ngày có lịch trình, trở thành một phần trong cách sống. Người tử tế không chỉ có mặt trong một chiếc áo đồng phục. Sự tử tế cũng nằm ở cách mình làm việc, đối thoại và chịu trách nhiệm mỗi ngày.\n\n> Một chuyến đi kết thúc ở bến xe. Sự có trách nhiệm kết thúc khi những việc đã nhận được làm đến nơi.\n\nMong khi chuyến xe đã về, thứ còn ở lại không chỉ là một album. Còn là một mối liên hệ được giữ cẩn thận, một việc được hoàn tất, và một chút tin tưởng để lần sau người ta vẫn yên tâm mở cửa đón nhau.","tags":["Logistics","Tổ chức","Nhóm trưởng","Tản văn biên soạn"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3}],"research":{"checked":"21/11/2026","sources":{"sos":{"title":"SOS Việt Nam — danh bạ các làng","url":"https://sosvietnam.org/tre-em-s async function rawRequest(path,{method='GET',body,token='',config=CONFIG,headers={},signal=null}={}){const controller=new AbortController();const forwardAbort=()=>controller.abort();if(signal){if(signal.aborted)controller.abort();else signal.addEventListener('abort',forwardAbort,{once:true});}const timer=setTimeout(()=>controller.abort(),25000);try{const h={apikey:config.key,...headers};if(token)h.Authorization='Bearer '+token;else if(config.key?.startsWith('eyJ'))h.Authorization='Bearer '+config.key;if(body!==undefined)h['Content-Type']='application/json';const r=await fetch(config.url.replace(/\/$/,'')+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,cache:'no-store',credentials:'omit'});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null;}catch{data=null;}if(!r.ok){const e=new Error(r.status===401?'Tài khoản hoặc mật khẩu chưa đúng, hoặc phiên đăng nhập đã hết hạn.':r.status===403?'Máy chủ từ chối thao tác: tài khoản này không có quyền quản trị.':r.status===409?'Có dữ liệu bị trùng hoặc đã thay đổi. Hãy tải lại danh sách trước khi lưu.':r.status===429?'Có quá nhiều yêu cầu. Vui lòng thử lại sau.':r.status===404?'Chưa tìm thấy dữ liệu. Kiểm tra bước tạo bảng và cấu hình máy chủ.':'Chưa thể kết nối hoặc lưu dữ liệu. Kiểm tra cấu hình, chính sách RLS và kết nối mạng.');e.status=r.status;e.code=data?.code;throw e;}return data;}finally{clearTimeout(timer);signal?.removeEventListener('abort',forwardAbort);}}
async function accessToken(){if(!S.session)throw new Error('Bạn cần đăng nhập Admin để thực hiện.');if(Date.now()/1000<(S.session.expires_at||0)-60)return S.session.access_token;if(!refreshPromise){const captured=S.session;refreshPromise=rawRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:captured.refresh_token}}).then(x=>{if(S.session!==captured)throw new Error('Phiên đăng nhập đã kết thúc.');S.session={...x,expires_at:x.expires_at||Date.now()/1000+x.expires_in};return S.session.access_token;}).catch(e=>{S.session=null;S.isAdmin=false;updateAdminBar();throw new Error('Phiên đăng nhập đã hết hạn. Hãy sao chép phần đang viết trước khi đăng nhập lại.');}).finally(()=>refreshPromise=null);}return refreshPromise;}

function setHero(index, animate=true, announce=true){
 const root=$('#opening-hero');if(!root||!HERO.slides.length)return;
 const n=HERO.slides.length,next=(index%n+n)%n;if(next===HERO.index)return;
 const selected=$(`[data-hero-index="${next}"]`,root),s=HERO.slides[next],generation=HERO.render;
 HERO.animation?.cancel();clearTimeout(HERO.finishTimer);$('.opening-flight',root)?.remove();
 const sr=selected.getBoundingClientRect(),hr=root.getBoundingClientRect();
 const reduced=motionReduced();const canAnimate=animate&&!reduced&&typeof root.animate==='function';
 HERO.index=next;V6Motion.elapsed=0;
 const oldTitle=$('#opening-copy');oldTitle.innerHTML=heroCopy(s);
 $('#opening-source').textContent=s.source;$('#opening-counter').textContent=String(next+1).padStart(2,'0');
 $('#opening-meter-fill').style.width=((next+1)/n*100)+'%';
 $('.opening-panel-label>span:last-child').textContent=String(next+1).padStart(2,'0')+' — 04';
 $$('[data-hero-index]',root).forEach((b,i)=>{b.classList.toggle('selected',i===next);b.setAttribute('aria-pressed',String(i===next));});
 if(announce)$('#opening-announcement').textContent=`Chủ đề ${next+1} trên ${n}: ${s.plain}`;
 const backdrop=$('.opening-backdrop',root);
 const finish=()=>{if(!root.isConnected||HERO.render!==generation||HERO.index!==next)return;backdrop.innerHTML=img(s.photo,s.alt,'opening-background',true);};
 if(canAnimate){
  const fly=document.createElement('div');fly.className='opening-flight';fly.setAttribute('aria-hidden','true');fly.innerHTML=img(s.photo,'','',true);root.appendChild(fly);
  // FLIP: the geometry is measured once; frames change transform/opacity only.
  const sx=Math.max(.08,sr.width/hr.width),sy=Math.max(.08,sr.height/hr.height);
  const anim=fly.animate([
   {transform:`translate3d(${sr.left-hr.left}px,${sr.top-hr.top}px,0) scale(${sx},${sy})`,opacity:.78},
   {transform:'translate3d(0,0,0) scale(1,1)',opacity:1}
  ],{duration:1050,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
  HERO.animation=anim;
  anim.onfinish=()=>{finish();fly.remove();if(HERO.animation===anim)HERO.animation=null;};
  anim.oncancel=()=>fly.remove();
  oldTitle.animate([{opacity:0,transform:'translate3d(0,24px,0)'},{opacity:1,transform:'translate3d(0,0,0)'}],{duration:850,delay:100,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});
 }else finish();
 const rail=$('#opening-cards');
 if(selected.offsetLeft<rail.scrollLeft||selected.offsetLeft+selected.offsetWidth>rail.scrollLeft+rail.clientWidth)

}
