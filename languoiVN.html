/ Pexels. Người trong ảnh không phải thành viên của trang."}, "elder": {"src": "https://images.pexels.com/photos/6647035/pexels-photo-6647035.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "title": "Lắng nghe bằng cả tấm lòng", "author": "RDNE Stock project", "url": "https://www.pexels.com/photo/volunteer-men-having-conversation-to-an-elderly-man-6647035/", "caption": "Ảnh minh họa một cuộc trò chuyện: RDNE Stock project / Pexels. Không phải ảnh chuyến thăm của trang."}, "landscape": {"src": "https://images.pexels.com/photos/6713508/pexels-photo-6713508.jpeg?auto=compress&cs=tinysrgb&w=1700&q=85", "title": "Thương một dải đất hình chữ S", "author": "Quang Nguyen Vinh", "url": "https://www.pexels.com/photo/rice-terrace-at-sunrise-6713508/", "caption": "Ảnh phong cảnh Việt Nam: Quang Nguyen Vinh / Pexels. Hình ảnh minh họa."}, "flower": {"src": "https://images.pexels.com/photos/10534011/pexels-photo-10534011.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "title": "Nâng niu những điều mong manh", "author": "Ron Lach", "url": "https://www.pexels.com/photo/hands-holding-flower-10534011/", "caption": "Ảnh minh họa bàn tay và hoa / Pexels. Không sử dụng ảnh người bệnh để minh họa."}}, "posts": [{"slug": "thay-ai-kho-co-chung-ta", "title": "Thấy ai khó, có chúng ta!", "excerpt": "Một ngôi nhà nhỏ để những tấm lòng Việt gặp nhau. Không bắt đầu bằng điều lớn lao, mà bằng mong muốn đừng để ai phải một mình.", "category": "Câu chuyện tử tế", "image_caption": "Ảnh tư liệu: Duy Nguyen / Pexels. Đây không phải ảnh hoạt động của fanpage; người trong ảnh không đại diện hay bảo chứng cho trang.", "content": "Chào bạn, cảm ơn bạn đã ghé qua ngôi nhà nhỏ mang tên **Vì mình và bạn là người Việt Nam**.\n\nMình là một người miền Nam, thường góp một phần nhỏ vào những hoạt động hỗ trợ các em nhỏ đang điều trị ung thư, trẻ em mồ côi và các ông bà tại viện dưỡng lão. Từ mong muốn giản dị đó, mình muốn có một nơi để chia sẻ những điều tử tế và kết nối những người cùng quan tâm.\n\n## Một câu nói, một cách nhìn\n\n**“Thấy ai khó, có chúng ta!”** không phải lời hứa rằng mình có thể giải quyết mọi khó khăn. Với mình, đó là lời nhắc: trước một hoàn cảnh cần được quan tâm, hãy chậm lại một chút, tìm hiểu một chút và cân nhắc xem mình có thể làm gì trong khả năng.\n\nCó khi sự đồng hành bắt đầu bằng thời gian. Có khi là một lời nhắn, một lần lắng nghe, hoặc giúp một câu chuyện được đến đúng người.\n\n> Không nhất thiết phải làm điều thật lớn. Chỉ mong khi ai đó cần, tình người vẫn ở đó.\n\n## Ngôi nhà nhỏ này dành cho ai?\n\nDành cho bạn thích đọc những câu chuyện nhân ái. Dành cho người muốn chia sẻ một góc nhìn tử tế. Và dành cho những tấm lòng đang tìm một cách đồng hành phù hợp, không phân biệt Bắc, Trung hay Nam.\n\nTrang sẽ tập trung vào bài viết, hình ảnh được phép chia sẻ và những suy nghĩ về hành trình thiện nguyện. Những nội dung liên quan đến một hoàn cảnh cụ thể cần được tìm hiểu và tôn trọng ý kiến của người trong cuộc trước khi đăng.\n\n## Có bạn, câu chuyện sẽ đi xa hơn\n\nBạn có thể ghé fanpage, để lại một lời chào hoặc chia sẻ bài viết khiến mình đồng cảm. Không cần phải nói điều thật hay; sự chân thành đã là một khởi đầu đẹp.\n\nCảm ơn bạn đã ở đây. Vì mình và bạn là người Việt Nam — **thấy ai khó, có chúng ta!**", "id": "10000000-0000-4000-8000-000000000001", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/32799179/pexels-photo-32799179.jpeg?auto=compress&cs=tinysrgb&w=1100&q=85", "featured": true, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "mot-loi-hoi-tham-mot-ngay-am-hon", "title": "Một lời hỏi thăm, một ngày ấm hơn", "excerpt": "Dành thời gian ngồi lại, lắng nghe một câu chuyện và gọi nhau bằng sự gần gũi. Có những điều bình thường nhưng chưa bao giờ nhỏ bé.", "category": "Bên ông bà", "image_caption": "Ảnh minh họa: RDNE Stock project / Pexels. Không phải chuyến thăm, nhân sự hay người nhận hỗ trợ của fanpage.", "content": "Khi nghĩ về việc đồng hành cùng người cao tuổi, mình muốn bắt đầu từ một điều giản dị: nhìn ông bà như những con người có câu chuyện, sở thích và sự lựa chọn riêng, chứ không chỉ như người cần được giúp đỡ.\n\nMột cuộc trò chuyện không cần thật dài. Điều mình mong giữ được là sự hiện diện chân thành: đến với tâm thế lắng nghe, thay vì chỉ đến để hoàn thành một hoạt động.\n\n## Hỏi trước, lắng nghe sau\n\nThay vì vội kể chuyện của mình, có thể bắt đầu bằng lời chào, hỏi ông bà có muốn trò chuyện hay không. Một người muốn kể chuyện cũ, một người muốn ngồi yên; cả hai đều xứng đáng được tôn trọng.\n\nNhững câu hỏi gần gũi về một món ăn yêu thích, một bài hát hay một kỷ niệm có thể là cách mở đầu. Không nhất thiết phải hỏi những chuyện buồn hay riêng tư để có một câu chuyện cảm động.\n\n## Một chuyến thăm cần sự chu đáo\n\nVới hoạt động tại viện dưỡng lão, việc liên hệ trước với người phụ trách giúp hai bên thống nhất thời gian, số người và cách tham gia. Mình cũng muốn mỗi người đồng hành hiểu rằng lịch sinh hoạt, sự riêng tư và mong muốn của ông bà cần được đặt lên trước mong muốn của người đi thăm.\n\n> Có khi điều quý nhất mình mang đến không nằm trong một túi quà, mà là khoảng thời gian thật lòng dành cho nhau.\n\n## Giữ lại sự ấm áp, không lấy đi sự riêng tư\n\nMột bức ảnh chỉ nên được chụp và chia sẻ khi người liên quan đồng ý. Một câu chuyện không nhất thiết phải kể hết để người đọc hiểu ý nghĩa của sự quan tâm.\n\nĐó là cách mình mong trang này kể về tình người: gần gũi, vừa đủ và tôn trọng.\n\nBài viết này là một góc chia sẻ, không phải tường thuật về một chuyến thăm đã diễn ra.", "id": "10000000-0000-4000-8000-000000000002", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/6647035/pexels-photo-6647035.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "featured": true, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "de-tuoi-tho-duoc-lon-len-trong-yeu-thuong", "title": "Để tuổi thơ được lớn lên trong yêu thương", "excerpt": "Điều mình mong dành cho các em không chỉ là một khoảnh khắc vui, mà còn là cách quan tâm luôn đặt sự tôn trọng lên trước.", "category": "Vì trẻ em", "image_caption": "Ảnh minh họa tuổi thơ tại Quy Nhơn: Vũ Bụi / Pexels. Không khẳng định trẻ trong ảnh mồ côi, bị bệnh hoặc nhận hỗ trợ của trang.", "content": "Trẻ em là một trong những điều khiến mình muốn dành nhiều sự quan tâm hơn trong hành trình thiện nguyện. Trong đó có những em thiếu vắng sự chăm sóc của cha mẹ và những em đang trải qua một giai đoạn khó khăn.\n\nMình không muốn kể về các em chỉ qua hoàn cảnh. Trước hết, mỗi em là một đứa trẻ có niềm vui, sở thích, mong muốn và quyền được giữ những điều riêng tư cho mình.\n\n## Nhìn thấy em, không chỉ nhìn thấy hoàn cảnh\n\nMột em thích vẽ, một em mê đọc truyện, một em thích được trò chuyện về điều mình vừa học. Để biết các em cần gì, sự tìm hiểu và trao đổi với người chăm sóc luôn có ý nghĩa hơn việc tự đoán.\n\nKhi có hoạt động phù hợp, mình mong việc chuẩn bị được thực hiện từ nhu cầu thực tế đã trao đổi với đơn vị phụ trách. Trang không hứa hỗ trợ mọi trường hợp; điều có thể giữ là cách tiếp nhận thông tin cẩn trọng và chân thành.\n\n## Niềm vui không cần một khuôn mẫu\n\nSự đồng hành có thể là thời gian, một hoạt động cùng nhau hoặc việc giúp kết nối một nhu cầu đã được xác nhận. Điều quan trọng là không gây áp lực để các em phải vui, phải nói lời cảm ơn hay phải xuất hiện trong một bức ảnh.\n\n> Mong rằng khi được quan tâm, các em vẫn luôn được là chính mình.\n\n## Kể chuyện bằng sự nâng niu\n\nTrang sẽ tránh đưa thông tin nhận diện, địa chỉ riêng hoặc những chi tiết nhạy cảm của trẻ lên bài viết khi chưa có sự đồng ý phù hợp. Việc có một bức ảnh đẹp không quan trọng hơn sự an tâm của các em.\n\nBạn có thể đồng hành bằng cách chia sẻ những câu chuyện tích cực, tôn trọng người trong ảnh và không suy đoán về hoàn cảnh của trẻ chỉ từ hình ảnh.", "id": "10000000-0000-4000-8000-000000000003", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/30248844/pexels-photo-30248844.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "featured": false, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "ben-nhung-em-nho-dang-dieu-tri-ung-thu", "title": "Gửi một chút thương đến những em nhỏ đang điều trị", "excerpt": "Không nói thay cảm xúc của các em. Chỉ mong sự quan tâm đến đúng lúc, đúng nhu cầu và luôn giữ được sự tế nhị.", "category": "Vì trẻ em", "image_caption": "Ảnh minh họa bàn tay nâng niu hoa / Pexels. Đây là hình ảnh tượng trưng, không phải ảnh của một em nhỏ đang điều trị.", "content": "Đồng hành cùng các em nhỏ đang điều trị ung thư là một trong những điều mình quan tâm khi tham gia thiện nguyện. Mình hiểu rằng sự quan tâm cần đi cùng sự tế nhị và việc lắng nghe gia đình, thay vì tự quyết định điều gì là tốt nhất cho các em.\n\nBài viết này chỉ chia sẻ tinh thần đồng hành của trang; không đưa ra hướng dẫn y tế hay lời khuyên điều trị.\n\n## Quan tâm mà không làm phiền\n\nTrước một hoạt động thăm hỏi, điều cần làm là trao đổi với gia đình và đơn vị phụ trách về khả năng tiếp nhận. Có lúc sự hiện diện trực tiếp phù hợp; cũng có lúc một lời nhắn thông qua người chăm sóc đã là cách quan tâm vừa đủ.\n\nMình không mong ai phải tỏ ra mạnh mẽ chỉ để đáp lại một lời động viên. Mỗi người có cách cảm nhận riêng, và sự yên lặng cũng cần được tôn trọng.\n\n## Giúp trong khả năng, nói đúng điều mình biết\n\nTrang không thay thế bệnh viện, nhân viên y tế hay các đầu mối hỗ trợ chuyên môn. Khi một hoàn cảnh được giới thiệu, thông tin cần được tìm hiểu trước khi cân nhắc cách kết nối. Không phải trường hợp nào cũng có thể được hỗ trợ và không nên có lời hứa khi chưa đủ cơ sở.\n\n> Một lời quan tâm chân thành không cần đi cùng một lời hứa vượt quá khả năng.\n\n## Sự riêng tư luôn đáng quý\n\nKhông công khai hồ sơ bệnh án, thông tin liên hệ hoặc hình ảnh nhạy cảm chỉ để làm bài viết xúc động hơn. Gia đình cần biết thông tin nào dự kiến được chia sẻ và có quyền từ chối.\n\nMình mong những bài viết ở đây truyền đi sự đồng cảm, mà không khiến các em hay gia đình phải đánh đổi sự riêng tư.\n\nCảm ơn bạn đã chọn quan tâm theo một cách nhẹ nhàng.", "id": "10000000-0000-4000-8000-000000000004", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/10534011/pexels-photo-10534011.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "featured": true, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "dieu-tu-te-bat-dau-tu-nhung-viec-nho", "title": "Điều tử tế bắt đầu từ những việc rất nhỏ", "excerpt": "Một lần phụ chuẩn bị, một lời giới thiệu đúng chỗ, một câu chuyện được sẻ chia. Bạn không cần đợi đến khi có thật nhiều mới bắt đầu.", "category": "Câu chuyện tử tế", "image_caption": "Ảnh minh họa tinh thần hợp tác: RDNE Stock project / Pexels. Không phải thành viên hay hoạt động của fanpage.", "content": "Mình thích nghĩ về thiện nguyện như một việc có thể bắt đầu từ đời sống thường ngày. Không cần trở thành ai khác, cũng không cần chờ đến lúc có đủ mọi điều kiện.\n\nĐiều cần giữ là sự chân thành, sự hiểu biết về việc mình đang tham gia và khả năng của chính mình.\n\n## Thời gian cũng là một cách đồng hành\n\nTrong một hoạt động đã được thống nhất, có thể có người phù hợp với việc chuẩn bị, người giúp ghi chép, người phụ sắp xếp và người có khả năng kết nối. Không có phần việc nào trở nên kém ý nghĩa chỉ vì không xuất hiện ở phía trước.\n\nViệc tham gia cần dựa trên nhu cầu thực tế của người tổ chức và sự tự nguyện của mỗi người. Trang không có lịch hoạt động cố định trong bài viết này; bạn có thể nhắn fanpage để trao đổi khi quan tâm.\n\n## Chia sẻ đúng cũng là giúp\n\nTrước khi chuyển tiếp một lời kêu gọi hay một câu chuyện, hãy xem nguồn và những thông tin đã được xác nhận. Một bài viết được lan tỏa có trách nhiệm đáng quý hơn một lượt chia sẻ vội vàng.\n\nĐồng thời, không đưa lại những thông tin riêng tư mà người trong cuộc chưa đồng ý công khai.\n\n> Làm được một điều nhỏ đến nơi đến chốn cũng là một cách gửi yêu thương.\n\n## Chọn điều phù hợp với mình\n\nBạn có thể chỉ đọc, để lại lời động viên hoặc chia sẻ một bài viết khiến mình suy nghĩ. Bạn cũng có thể lựa chọn không tham gia một hoạt động khi chưa phù hợp. Sự đồng hành không nên bắt đầu từ áp lực.\n\nMình mong ngôi nhà nhỏ này là nơi mọi người gặp nhau bằng sự thoải mái và tôn trọng — để điều tử tế có thể được tiếp nối lâu dài.", "id": "10000000-0000-4000-8000-000000000005", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/6646867/pexels-photo-6646867.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "featured": false, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "chia-se-cau-chuyen-giu-tron-ton-trong", "title": "Chia sẻ một câu chuyện, giữ trọn sự tôn trọng", "excerpt": "Một câu chuyện nhân ái không cần phơi bày mọi điều riêng tư. Cách chúng ta kể cũng quan trọng như điều chúng ta muốn lan tỏa.", "category": "Góc sẻ chia", "image_caption": "Phong cảnh Việt Nam: Quang Nguyen Vinh / Pexels. Ảnh minh họa, không đại diện cho một hoạt động cụ thể.", "content": "Một bài viết về thiện nguyện có thể đưa những tấm lòng đến gần nhau hơn. Nhưng trước khi nghĩ về mức độ lan tỏa, mình muốn đặt một câu hỏi: người được nhắc đến có cảm thấy được tôn trọng khi đọc lại câu chuyện này không?\n\nĐó là điều trang muốn dùng làm điểm bắt đầu khi chuẩn bị nội dung.\n\n## Kể điều đã biết, phân biệt điều chưa rõ\n\nKhi chia sẻ về một hoàn cảnh, không tự thêm chi tiết để câu chuyện trở nên xúc động hơn. Những gì chưa được xác nhận cần được làm rõ hoặc chưa đưa vào bài viết.\n\nẢnh minh họa phải được gọi đúng là ảnh minh họa. Không lấy ảnh của một hoạt động khác để người đọc hiểu rằng đó là hoạt động của trang.\n\n## Xin phép không chỉ là một lần hỏi\n\nNgười trong cuộc cần hiểu hình ảnh hoặc câu chuyện của mình dự kiến được dùng ở đâu. Sự đồng ý chụp ảnh không nên mặc nhiên được hiểu là đồng ý công khai mọi chi tiết trên Internet.\n\nVới trẻ em, cần đặc biệt cân nhắc thông tin nhận diện và trao đổi với người có trách nhiệm chăm sóc.\n\n> Điều tử tế không chỉ nằm ở câu chuyện được kể, mà còn ở cách người trong câu chuyện được đối xử.\n\n## Để người trong cuộc được lên tiếng\n\nKhi có đề nghị chỉnh sửa hoặc gỡ thông tin liên quan, trang cần tiếp nhận và xem xét trên tinh thần tôn trọng. Bạn có thể liên hệ qua fanpage hoặc email công khai để phản ánh nội dung cần kiểm tra.\n\nMình mong mỗi bài viết ở đây mang lại sự đồng cảm mà không biến một người thành hình ảnh đại diện cho sự bất hạnh.\n\nĐây là nguyên tắc biên tập đề xuất cho trang, không phải tư vấn pháp lý.", "id": "10000000-0000-4000-8000-000000000006", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/6713508/pexels-photo-6713508.jpeg?auto=compress&cs=tinysrgb&w=1700&q=85", "featured": false, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "tu-mien-nam-gui-mot-chut-thuong", "title": "Từ miền Nam, gửi một chút thương", "excerpt": "Một nơi để bắt đầu, không phải một ranh giới. Điều kết nối chúng mình là mong muốn sống gần nhau hơn bằng tình người.", "category": "Góc sẻ chia", "image_caption": "Ảnh minh họa tại Mộc Châu: Quang Nguyen Vinh / Pexels. Không phải hoạt động, nhân sự hay đối tượng hỗ trợ của trang.", "content": "Mình là người miền Nam. Vì vậy, cách mình muốn nói chuyện trên trang cũng thật gần gũi: gặp nhau thì chào, quan tâm thì hỏi, có việc phù hợp thì cùng góp sức.\n\nNhưng tên trang không chỉ nhắc đến một vùng miền. **Vì mình và bạn là người Việt Nam** là mong muốn có một chỗ gặp gỡ cho những tấm lòng ở bất cứ đâu.\n\n## Nơi bắt đầu không phải ranh giới\n\nCó người ở gần, có người ở xa. Có người có thể tham gia trực tiếp, có người chỉ có điều kiện đọc và chia sẻ. Mình không muốn dùng khoảng cách hay mức độ đóng góp để đo sự chân thành.\n\nTrang này trước hết là nơi kể những điều tử tế, trao đổi về cách đồng hành và giữ liên lạc với những người cùng quan tâm.\n\n## Giữ sự gần gũi trong từng lời nhắn\n\nMột lời chào không cần trang trọng. Một câu chuyện không cần thật dài. Bạn có thể ghé fanpage và nói điều mình đang nghĩ, giới thiệu một hoàn cảnh cần tìm hiểu hoặc đơn giản là gửi một lời động viên.\n\nTrang sẽ phản hồi trong khả năng, không cam kết thời gian phản hồi cố định hay bảo đảm hỗ trợ mọi đề nghị.\n\n> Dù bắt đầu ở đâu, mong rằng mình vẫn tìm được nhau ở sự tử tế.\n\n## Cảm ơn vì bạn đã ghé\n\nMình mong khi rời khỏi một bài viết, bạn mang theo một cảm giác nhẹ nhàng: ngoài kia vẫn có những người muốn quan tâm và cùng làm điều có ích.\n\nThấy ai khó, có chúng ta — như một lời nhắc để mình và bạn không quên nhìn về phía nhau.", "id": "10000000-0000-4000-8000-000000000007", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/35750516/pexels-photo-35750516.jpeg?auto=compress&cs=tinysrgb&w=1500&q=85", "featured": false, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}, {"slug": "bat-dau-dong-hanh-cung-trang", "title": "Bạn có thể bắt đầu đồng hành như thế nào?", "excerpt": "Đọc một câu chuyện, chia sẻ điều khiến bạn đồng cảm hoặc gửi một lời nhắn. Có nhiều cách để chúng mình đến gần nhau hơn.", "category": "Góc sẻ chia", "image_caption": "Ảnh minh họa trẻ em vui chơi: Long Bà Mùi / Pexels. Người trong ảnh không phải nhân vật được giới thiệu trong bài.", "content": "Cảm ơn bạn đã quan tâm đến ngôi nhà nhỏ này. Bạn không cần phải đăng ký thành viên để đọc các bài viết hay tìm hiểu tinh thần của trang.\n\nMình gợi ý ba cách thật đơn giản để bắt đầu.\n\n## Đọc và giữ lại một điều ý nghĩa\n\nCác bài viết được chia theo chủ đề để bạn dễ chọn: câu chuyện tử tế, sự quan tâm dành cho trẻ em, những suy nghĩ về việc đồng hành cùng ông bà và các góc sẻ chia.\n\nBạn có thể tìm bài theo từ khóa, mở trang đọc riêng và sao chép liên kết để quay lại sau.\n\n## Lan tỏa bằng sự cẩn trọng\n\nKhi chia sẻ, hãy giữ đúng nội dung và nguồn. Một ảnh minh họa không nên bị cắt chú thích rồi kể lại như ảnh của một hoạt động đã diễn ra. Những thông tin riêng tư không cần thiết cũng không nên được đưa thêm vào.\n\nMình mong mỗi lượt chia sẻ giúp câu chuyện đi xa hơn mà vẫn giữ được sự tôn trọng với người liên quan.\n\n## Gửi lời nhắn cho fanpage\n\nBạn có thể liên hệ để trao đổi về việc đồng hành, giới thiệu một câu chuyện hoặc phản ánh nội dung cần xem lại. Hãy bắt đầu bằng thông tin khái quát; chưa cần gửi giấy tờ cá nhân, hồ sơ bệnh án hay thông tin nhạy cảm.\n\nTrang sẽ trao đổi thêm để hiểu đề nghị và cân nhắc khả năng kết nối, không mặc định rằng mọi lời nhắn đều trở thành một hoạt động hỗ trợ.\n\n> Một lời chào chân thành cũng có thể mở đầu cho một điều tốt đẹp.\n\nCảm ơn bạn đã đọc, đã quan tâm và đã chọn đồng hành theo cách phù hợp với mình.", "id": "10000000-0000-4000-8000-000000000008", "author": "Vì mình và bạn", "status": "published", "is_starter": true, "created_at": "2026-11-18T19:16:28.748958+00:00", "updated_at": "2026-11-18T19:16:28.748958+00:00", "published_at": "2026-11-18T19:16:28.748958+00:00", "revision": 1, "gallery": [], "cover_image": "https://images.pexels.com/photos/34613629/pexels-photo-34613629.jpeg?auto=compress&cs=tinysrgb&w=1200&q=85", "featured": false, "tags": ["Thấy ai khó, có chúng ta", "Thiện nguyện"]}], "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCADwAPADASIAAhEBAxEB/8QAHQAAAQUAAwEAAAAAAAAAAAAAAAQFBgcIAQIDCf/EAEsQAAEDAwIDBgMFBAcECAcAAAECAwQFBhEABxIhMQgTIkFRYRRxgRUyQpGhI1JighYzQ3KSscEXJLLRCTQ1Y5OiwvAlRVNUg5Tx/8QAHAEAAQUBAQEAAAAAAAAAAAAABQACAwQGBwEI/8QAQBEAAQIEBAMGBAQEBgAHAAAAAQIDAAQRIQUSMUEGUWETInGBkaEysdHwFFLB4SNCYpIHFTNygvEWQ1ODk7LC/9oADAMBAAIRAxEAPwDf2jRo0oUGjRo0oUGjRo0oUGjRo0oUGjXVxxtllTrziW20AqUtZwEgdST5aoXcbtb7YWOt2BR5Dl01RGUlmnKHcIV6KePh/wAPFqNx5DQqs0i5JYfMzq+zlkFR6fqdB5xfmmmuXRbdswzLuKvU2lMgZ45slDQPy4iM6wfUe0D2it5Kk5SrBpsyBGWeEsUGOSpI/jkK+788pGo/K2IqDE1VR3k3XoVvyV+JyO9KVVJ5+aEE4P8AMdUFYhX/AEk1HM2Eatng7syBPPhKvypBWr0H6AxrWv8Aa42RoTimmrik1dxP4aZEW4D/ADK4Un89V1Ve3harJUKLYdXlgdFS5LccH6JC9UeiB2aLdGEw72vSQk81uut06Or5AePGlTO5u3VNUE29sRaDAHRdVcdnr+Z4iNVVz7u6wPAVjRSvCEmfglnF9VKCR6VB9onsjt6VxSz8Jt1TkJ8u9qC1H9EDXi328rlCv2u39IUP4Zrg/wDSdRdrfaot+GBYtgQU+QZoTfL6knTjH31rTxCZds2Y8k/hXRGcaqKxMp1cP9og03wS2oWkkf8Ayqr8omVP7esYqCartu6keaotSCv0U2P89TmidtjaSolKKrEr9HUeqnoqXUD6tqJ/TVSp3CteqpxW9pLBmZ+8pum9wo/VJ5aTSqRsBXuU/bWpURxXV+h1RRA9wh3I16jGDWzo8wR8hFOZ4IYHxyS09ULB9lGvtGvLY3j2uvIoRbt8UeU8vpHU+GXT/wDjXhX6anAIIyDka+d07s+7d1vx2PusIL5+5CuaIWOfkO+R4f00NRu1LsbHRN CREATE OR REPLACE FUNCTION public.vmblog_is_admin()
RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path = ''
AS $$
  SELECT EXISTS (
    SELECT 1 FROM public.vmblog_admin
    WHERE singleton = true AND user_id = (SELECT auth.uid())
  );
$$;
REVOKE ALL ON FUNCTION public.vmblog_is_admin() FROM PUBLIC;
GRANT EXECUTE ON FUNCTION public.vmblog_is_admin() TO anon, authenticated, service_role;

CREATE TABLE IF NOT EXISTS public.vmblog_posts (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  slug text NOT NULL UNIQUE CHECK (slug ~ '^[a-z0-9]+(-[a-z0-9]+)*$' AND length(slug) <= 150),
  title text NOT NULL CHECK (length(trim(title)) BETWEEN 1 AND 180),
  excerpt text NOT NULL DEFAULT '' CHECK (length(excerpt) <= 360),
  content text NOT NULL CHECK (length(trim(content)) BETWEEN 1 AND 80000),
  category text NOT NULL DEFAULT 'Câu chuyện tử tế'
    CHECK (category IN ('Câu chuyện tử tế', 'Vì trẻ em', 'Bên ông bà', 'Góc sẻ chia')),
  author text NOT NULL DEFAULT 'Vì mình và bạn' CHECK (length(trim(author)) BETWEEN 1 AND 80),
  cover_image text NOT NULL DEFAULT '' CHECK (octet_length(cover_image) <= 800000),
  image_caption text NOT NULL DEFAULT '' CHECK (length(image_caption) <= 500),
  gallery jsonb NOT NULL DEFAULT '[]'::jsonb
    CHECK (jsonb_typeof(gallery) = 'array' AND jsonb_array_length(gallery) <= 6 AND octet_length(gallery::text) <= 5000000),
  tags text[] NOT NULL DEFAULT '{}'::text[] CHECK (cardinality(tags) <= 8),
  status text NOT NULL DEFAULT 'draft' CHECK (status IN ('draft', 'published')),
  featured boolean NOT NULL DEFAULT false,
  is_starter boolean NOT NULL DEFAULT false,
  rights_confirmed boolean NOT NULL DEFAULT false,
  reading_minutes integer NOT NULL DEFAULT 1 CHECK (reading_minutes BETWEEN 1 AND 999),
  revision bigint NOT NULL DEFAULT 1 CHECK (revision > 0),
  created_at timestamptz NOT NULL DEFAULT now(),
  updated_at timestamptz NOT NULL DEFAULT now(),
  published_at timestamptz,
  CHECK (status <> 'published' OR rights_confirmed = true)
);
CREATE INDEX IF NOT EXISTS vmblog_posts_public_date
  ON public.vmblog_posts (status, published_at DESC, created_at DESC);
CREATE INDEX IF NOT EXISTS vmblog_posts_category
  ON public.vmblog_posts (category, status);

CREATE OR REPLACE FUNCTION public.vmblog_stamp_post()
RETURNS trigger LANGUAGE plpgsql SET search_path = ''
AS $$
BEGIN
  NEW.title := trim(NEW.title);
  NEW.author := trim(NEW.author);
  IF TG_OP = 'INSERT' THEN
    NEW.created_at := now();
    NEW.revision := 1;
    NEW.published_at := CASE WHEN NEW.status = 'published' THEN now() ELSE NULL END;
  ELSE
    NEW.created_at := OLD.created_at;
    NEW.revision := OLD.revision + 1;
    NEW.published_at := COALESCE(OLD.published_at, CASE WHEN NEW.status = 'published' THEN now() ELSE NULL END);
  END IF;
  NEW.updated_at := now();
  NEW.reading_minutes := greatest(1, ceil(array_length(regexp_split_to_array(trim(NEW.content), E'\\s+'), 1) / 230.0)::integer);
  RETURN NEW;
END;
$$;
REVOKE ALL ON FUNCTION public.vmblog_stamp_post() FROM PUBLIC;
DROP TRIGGER IF EXISTS vmblog_post_stamp ON public.vmblog_posts;
CREATE TRIGGER vmblog_post_stamp BEFORE INSERT OR UPDATE ON public.vmblog_posts
FOR EACH ROW EXECUTE FUNCTION public.vmblog_stamp_post();

CREATE OR REPLACE FUNCTION public.vmblog_stamp_site()
RETURNS trigger LANGUAGE plpgsql SET search_path = ''
AS $$
BEGIN
  NEW.updated_at := now();
  NEW.revision := OLD.revision + 1;
  RETURN NEW;
END;
$$;
