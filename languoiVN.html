async function login(form){
 if(AUTH13.pending)return;
 authStatus13('');
 const pass=form.elements.password,username=form.elements.username?.value;
 if(username!=='Admin'){authStatus13('Chỉ tài khoản Admin được phép đăng nhập.',true);return;}
 if(!pass.value){authStatus13('Vui lòng nhập mật khẩu của Admin.',true);pass.focus();return;}
 if(!online()){pass.value='';authStatus13('Chưa cấu hình máy chủ. Mở “Thiết lập kết nối” bên dưới để kích hoạt đăng nhập.',true);return;}
 const attempt=++AUTH13.attempt,at=location.hash;
 AUTH13.pending=true;const controller=new AbortController();AUTH13.controller=controller;setBusy(form,true);pass.readOnly=true;
 const text=$('[data-auth-button13]',form);if(text)text.textContent='Đang xác thực…';
 form.classList.add('auth-pending13');
 let candidate='';
 const abandoned=()=>attempt!==AUTH13.attempt||!form.isConnected||location.hash!==at;
 try{
  const payload={email:CONFIG.adminEmail||EMAIL,password:pass.value};
  let x;
  try{x=await rawRequest('/auth/v1/token?grant_type=password',{method:'POST',body:payload,signal:controller.signal});}
  finally{payload.password='';pass.value='';}
  candidate=x?.access_token||'';
  if(!candidate||!x?.user?.id||!x?.refresh_token)throw new Error('Máy chủ chưa trả về phiên đăng nhập hợp lệ.');
  if(abandoned()){await rawRequest('/auth/v1/logout',{method:'POST',token:candidate}).catch(()=>{});return;}
  if(text)text.textContent='Đang kiểm tra quyền Admin…';
  const allowed=await rawRequest('/rest/v1/rpc/vmblog_is_admin',{method:'POST',body:{},token:candidate,signal:controller.signal});
  if(allowed!==true){await rawRequest('/auth/v1/logout',{method:'POST',token:candidate}).catch(()=>{});candidate='';throw new Error('Tài khoản chưa được cấp quyền Admin duy nhất. Kiểm tra bước cấp quyền tại Supabase.');}
  if(abandoned()){await rawRequest('/auth/v1/logout',{method:'POST',token:candidate}).catch(()=>{});return;}
  S.session={...x,expires_at:x.expires_at||Date.now()/1000+Number(x.expires_in||3600)};
  S.isAdmin=true;AUTH13.enteredAt=Date.now();form.reset();closeModal();updateAdminBar();
  toast('Đã xác thực Admin. Chào mừng bạn trở lại!');
  location.hash='/admin';
 }catch(e){
  if(candidate&&!S.isAdmin)await rawRequest('/auth/v1/logout',{method:'POST',token:candidate}).catch(()=>{});
  if(abandoned())return;
  S.session=null;S.isAdmin=false;S.adminPosts=[];clearVolAdmin();updateAdminBar();
  let message=(e?.status===400||e?.status===401)?'Mật khẩu chưa đúng hoặc tài khoản chưa sẵn sàng. Vui lòng kiểm tra lại.':e?.status===429?'Máy chủ đang giới hạn số lần đăng nhập. Vui lòng chờ rồi thử lại.':e?.name==='TypeError'?'Không thể kết nối máy chủ. Kiểm tra mạng rồi thử lại.':errorMessage(e);
  authStatus13(message,true);pass.focus();
 }finally{
  if(attempt===AUTH13.attempt){AUTH13.pending=false;AUTH13.controller=null;}pass.readOnly=false;pass.value='';setBusy(form,false);form.classList.remove('auth-pending13');
  if(text)text.textContent='Đăng nhập quản trị';
 }
}
async function logout(){
 if(S.busy){toast('Hãy hoàn tất thao tác lưu trước khi đăng xuất.');return;}
 if((S.dirty||V12.adminDirty)&&!confirm('Có thay đổi chưa lưu. Đăng xuất và bỏ thay đổi?'))return;
 const token=S.session?.access_token;
 AUTH13.attempt++;AUTH13.enteredAt=0;AUTH13.notice='Bạn đã đăng xuất. Nội dung quản trị đã được đóng.';
 S.session=null;S.isAdmin=false;S.dirty=false;S.editor=null;S.adminPosts=[];S.siteDraft=null;clearVolAdmin();
 V12.adminDirty=false;closeModal();updateAdminBar();
 location.hash='/dang-nhap';
 // Close local access immediately; remote revoke is requested independently.
 if(token)rawRequest('/auth/v1/logout',{method:'POST',token}).catch(()=>{toast('Đã đóng phiên trên thiết bị. Chưa xác nhận thu hồi phiên từ máy chủ do lỗi mạng.',true);});
}

  b.setAttribute('aria-pressed',String(shown));b.setAttribute('aria-label',shown?'Ẩn mật khẩu':'Hiện mật khẩu');$('span',b).textContent=shown?'Ẩn':'Hiện';
 }else if(b.dataset.auth13==='recovery')authHelp13(true);else if(b.dataset.auth13==='guide')authHelp13(false);
});
