function featuredHTML(){const rows=[...S.posts.filter(p=>p.featured),...S.posts.filter(p=>!p.featured)].slice(0,3);if(!rows.length)return emptyHTML(S.publicError?'Chưa tải được bài viết':'Những câu chuyện đầu tiên đang được chuẩn bị',S.publicError||'Bạn vẫn có thể ghé fanpage để trò chuyện cùng chúng mình.');return `<div class="feature-grid"><a class="feature-main reveal" href="${articleHref(rows[0])}">${img(rows[0].cover_image,rows[0].title)}<div class="feature-main-copy"><span class="pill">${esc(rows[0].category)}</span><h3>${esc(rows[0].title)}</h3>${meta(rows[0])}<span class="round-arrow">${icon('arrow')}</span></div></a><div class="feature-side">${rows.slice(1).map(p=>`<a class="side-story reveal" href="${articleHref(p)}"><div class="image-frame">${img(p.cover_image,p.title)}</div><div><span class="pill ${p.category==='Bên ông bà'?'green':''}">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p>${meta(p)}</div></a>`).join('')}</div></div>`;}
function card(p){return `<article class="story-card reveal stagger"><div class="card-image">${img(p.cover_image,p.title)}<span class="pill">${esc(p.category)}</span></div><div class="card-body">${meta(p)}<h3><a href="${articleHref(p)}">${esc(p.title)}</a></h3><p>${esc(p.excerpt)}</p><div class="card-foot"><span class="card-author">${img(DATA.logo,'')}<span>${esc(p.author||'Vì mình và bạn')}</span></span><span class="round-arrow">${icon('arrow')}</span></div></div></article>`;}
function emptyHTML(title,text){return `<div class="empty-state"><h3>${esc(title)}</h3><p>${esc(text)}</p>${S.publicError?'<button class="btn btn-small" data-action="retry-public">Thử kết nối lại</button>':''}</div>`;}
function galleryItems(){if(S.site.gallery?.length)return S.site.gallery;if(S.site.use_stock_gallery===false)return [];return ['hero','children','kites','spring'].map(k=>({src:DATA.photos[k].src,caption:DATA.photos[k].caption,title:DATA.photos[k].title}));}
function cta(){return `<section class="cta-wrap" id="ket-noi"><div class="wrap"><div class="cta reveal"><div><div class="eyebrow">Mình và bạn, cùng viết tiếp</div><h2>Có bạn, câu chuyện<br>sẽ <em>đi xa hơn.</em></h2><p>Ghé fanpage để đọc những điều tử tế, chia sẻ câu chuyện của bạn và cùng chúng mình giữ kết nối.</p></div><div class="cta-buttons">${facebook('Kết nối trên Facebook','btn btn-white')}<a href="mailto:${EMAIL}" class="text-link">${icon('mail')}Gửi một lời nhắn qua email</a></div></div></div></section>`;}
function renderHome(){S.view='home';S.article=null;document.body.classList.remove('reading-comfort');document.title=TITLE+' — Thấy ai khó, có chúng ta!';const hero=S.site.hero_image||DATA.photos.hero.src;const hc=S.site.hero_caption||'Ảnh tư liệu minh họa · Duy Nguyen / Pexels';const gallery=galleryItems();$('#main').innerHTML=`<section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><div class="eyebrow">Từ miền Nam, gửi một chút thương</div><h1>Thấy ai khó,<em>có chúng ta.</em></h1><p class="hero-lead">Một câu chuyện tử tế có thể chạm đến một trái tim.<br>Một sự sẻ chia có thể làm ấm cả một ngày.<br>Mình và bạn, cùng bắt đầu từ những điều giản dị.</p><div class="hero-buttons"><a class="btn btn-red" href="#/cau-chuyen">Đọc những câu chuyện${icon('arrow')}</a><a class="text-link" href="#/ve-chung-minh">Về chúng mình${icon('chevron','icon-sm')}</a></div><div class="hero-bottom"><span class="hero-seal">${icon('heart')}</span><div><strong>Không cần điều lớn lao. Chỉ cần thật lòng.</strong><small>Kết nối những tấm lòng · Lan tỏa sự tử tế</small></div></div></div><div class="hero-art"><div class="hero-back-shape"></div><div class="hero-main-photo">${img(hero,'Khoảnh khắc quan tâm và sẻ chia — ảnh minh họa','',true)}</div><div class="round-seal" aria-hidden="true"><svg viewBox="0 0 120 120"><defs><path id="seal-circle" d="M60 60m-43 0a43 43 0 1 1 86 0a43 43 0 1 1-86 0"/></defs><text font-size="9.5" font-family="Arial,sans-serif" letter-spacing="2" fill="currentColor"><textPath href="#seal-circle">LAN TỎA YÊU THƯƠNG • CÙNG NHAU • </textPath></text></svg>${icon('heart')}</div><span class="hero-dots" aria-hidden="true">✳</span><figure class="polaroid">${photo('kites','','true')}<figcaption>Gửi một chút thương…</figcaption></figure><div class="hero-photo-note">${esc(hc)}<br><button data-action="credits">Tìm hiểu nguồn hình ảnh</button></div></div></div></section><section class="values-strip"><div class="wrap values-grid"><div class="value-item"><span class="value-icon">${icon('sun')}</span><div><strong>Vì những nụ cười trẻ thơ</strong><small>Nâng niu những ước mơ nhỏ</small></div></div><div class="value-item"><span class="value-icon">${icon('heart')}</span><div><strong>Vì những ngày an yên của ông bà</strong><small>Lắng nghe và ở bên bằng sự chân thành</small></div></div><div class="value-item"><span class="value-icon">${icon('users')}</span><div><strong>Vì một cộng đồng biết sẻ chia</strong><small>Không phân biệt vùng miền</small></div></div></div></section><section class="section"><div class="wrap"><div class="section-head reveal"><div><div class="eyebrow">Dừng lại một chút, đọc cùng nhau</div><h2>Những câu chuyện <em>chạm lòng.</em></h2></div><a class="text-link" href="#/cau-chuyen">Khám phá tất cả${icon('arrow')}</a></div>${S.loading?'<div class="loading-line" aria-label="Đang tải bài viết"></div>':''}${featuredHTML()}</div></section><section class="section story-section" id="cau-chuyen"><div class="wrap"><div class="section-head reveal"><div><div class="eyebrow">Nhật ký của sự tử tế</div><h2>Mỗi câu chuyện,<br>một chút <em>yêu thương.</em></h2><p>Những điều muốn kể, những người muốn quan tâm và những góc nhìn để chúng mình sống gần nhau hơn.</p></div><div class="search-box">${icon('search')}<label class="sr-only" for="story-search">Tìm bài viết</label><input id="story-search" type="search" placeholder="Tìm một câu chuyện…" value="${esc(S.search)}" autocomplete="off"></div></div><div class="story-controls"><div class="chips" aria-label="Lọc chuyên mục">${['Tất cả',...CATEGORIES].map(c=>`<button class="chip ${S.filter===c?'active':''}" data-action="filter" data-value="${esc(c)}" aria-pressed="${S.filter===c}">${esc(c)}</button>`).join('')}</div></div><div class="story-results-line"><span id="story-count" role="status"></span><label>Sắp xếp <select id="story-sort" aria-label="Sắp xếp bài viết"><option value="new" ${S.sort==='new'?'selected':''}>Mới nhất</option><option value="old" ${S.sort==='old'?'selected':''}>Cũ nhất</option><option value="title" ${S.sort==='title'?'selected':''}>Tên A → Z</option></select></label></div><div class="stories-grid" id="stories-grid"></div><div class="center-actions" id="more-stories"></div></div></section><section class="section" id="ve-chung-minh"><div class="wrap about-grid"><div class="about-art reveal">${img(S.site.about_image||DATA.photos.spring.src,'Một khoảnh khắc tuổi thơ — ảnh minh họa','about-photo')}<div class="about-tag">“Thương nhau,<br>đâu cần lý do lớn.”</div></div><div class="about-copy reveal"><div class="eyebrow">Vì mình và bạn là người Việt Nam</div><h2>Không phải điều lớn lao.<br>Chỉ là <em>đừng đi qua nhau.</em></h2><p>Mình là một người miền Nam, thường góp một phần nhỏ để hỗ trợ trẻ em đang điều trị ung thư, trẻ em mồ côi và các ông bà tại viện dưỡng lão.</p><p>Ngôi nhà nhỏ này được tạo ra để kể những điều tử tế và kết nối những tấm lòng. Không cần phải là ai đặc biệt, cũng không cần làm điều thật lớn. Chỉ mong mỗi khi nhìn thấy một hoàn cảnh cần quan tâm, chúng mình không vội quay đi.</p><p>Ở đây, câu chuyện được kể bằng sự chân thành, hình ảnh được chia sẻ bằng sự tôn trọng, và mọi sự đồng hành đều đáng quý.</p><div class="about-rule"></div><div class="principles"><span>${icon('check')}Chân thành</span><span>${icon('check')}Tôn trọng</span><span>${icon('check')}Có trách nhiệm</span></div><a href="${FB}" target="_blank" rel="noopener noreferrer" class="text-link">Gặp chúng mình trên Facebook${icon('arrow')}</a><p class="small muted" style="font-size:9px;margin-top:20px">${esc(S.site.about_caption||DATA.photos.spring.caption)}</p></div></div></section><section class="quote-section">${photo('landscape','quote-bg')}<div class="wrap reveal"><div class="quote-mark" aria-hidden="true">“</div><blockquote>Không cần làm điều gì thật lớn lao.<br>Chỉ cần mỗi người góp một chút yêu thương,<br>cuộc sống sẽ ấm áp hơn.</blockquote><p>Điều chúng mình muốn giữ trong mỗi hành trình</p></div></section>${gallery.length?`<section class="section" id="khoanh-khac"><div class="wrap"><div class="section-head reveal"><div><div class="eyebrow">Một góc nhìn dịu dàng</div><h2>Những khung hình <em>gợi thương.</em></h2></div><p>Đôi khi, một khoảnh khắc bình thường cũng nhắc mình về những điều đáng trân trọng.</p></div><div class="gallery-grid">${gallery.slice(0,4).map((x,i)=>`<button class="gallery-item reveal" data-action="gallery" data-index="${i}" aria-label="Xem ảnh: ${esc(x.title||x.caption)}">${img(x.src,x.title||x.caption)}${icon('expand')}<span>${esc(x.title||'Một khoảnh khắc sẻ chia')}</span></button>`).join('')}</div><div class="photo-disclaimer"><p>${S.site.gallery?.length?'Hình ảnh do Admin cập nhật. Người đăng chịu trách nhiệm về quyền sử dụng và sự đồng ý của người xuất hiện trong ảnh.':'Bộ ảnh tư liệu minh họa từ Pexels, không phải ảnh hoạt động của fanpage. Không suy đoán hoàn cảnh, tình trạng sức khỏe hoặc sự tham gia của người trong ảnh.'}</p><button data-action="credits">Xem nguồn ảnh ↗</button></div></div></section>`:''}<section class="section connect-section"><div class="wrap"><div class="section-head reveal"><div><div class="eyebrow">Có nhiều cách để cùng nhau</div><h2>Bắt đầu từ một điều <em>rất nhỏ.</em></h2></div></div><div class="connect-cards"><div class="connect-card reveal"><span class="number">01</span><h3>Đọc một câu chuyện</h3><p>Dành một chút thời gian để lắng nghe, hiểu thêm và nhìn cuộc sống bằng một góc nhìn dịu dàng hơn.</p><a class="text-link" href="#/cau-chuyen">Tìm điều muốn đọc${icon('arrow')}</a></div><div class="connect-card reveal"><span class="number">02</span><h3>Chia sẻ điều tử tế</h3><p>Một câu chuyện có thể đến đúng người nhờ bạn. Hãy giữ đúng nội dung, nguồn và sự riêng tư của người trong cuộc.</p><a class="text-link" href="${FB}" target="_blank" rel="noopener noreferrer">Lan tỏa trên Facebook${icon('arrow')}</a></div><div class="connect-card reveal"><span class="number">03</span><h3>Gửi một lời chào</h3><p>Muốn kể một câu chuyện hay trao đổi về việc đồng hành? Bạn cứ nhắn cho ngôi nhà nhỏ này nhé.</p><a class="text-link" href="mailto:${EMAIL}">Kết nối cùng chúng mình${icon('arrow')}</a></div></div></div></section><section class="section faq-section"><div class="wrap faq-layout"><div class="faq-intro reveal"><div class="eyebrow">Bạn có thể đang thắc mắc</div><h2>Trước khi mình<br><em>cùng bắt đầu.</em></h2><p>Một vài điều để bạn hiểu hơn về trang và cách chúng mình kết nối.</p></div><div class="faq-list reveal"><details><summary>Trang này chia sẻ những nội dung gì?</summary><p>Trang tập trung vào câu chuyện thiện nguyện, sự quan tâm dành cho trẻ em và người cao tuổi, cùng những góc nhìn về việc sẻ chia có trách nhiệm. Các bài mở đầu được ghi chú rõ, không trình bày như báo cáo về hoạt động đã diễn ra.</p></details><details><summary>Mình muốn đồng hành thì bắt đầu từ đâu?</summary><p>Bạn có thể nhắn trực tiếp fanpage để giới thiệu mong muốn và khu vực mình sinh sống. Trang sẽ trao đổi về khả năng kết nối; chưa có cam kết về lịch hoạt động hoặc việc tiếp nhận mọi đề nghị.</p></details><details><summary>Có thể gửi một câu chuyện hoặc hoàn cảnh cần quan tâm không?</summary><p>Có. Bạn hãy gửi thông tin khái quát qua fanpage hoặc email. Chưa cần gửi giấy tờ cá nhân, bệnh án hay thông tin nhạy cảm. Nội dung chỉ nên được chia sẻ khi đã tìm hiểu và có sự đồng ý phù hợp.</p></details><details><summary>Hình ảnh trên website có phải hoạt động của trang không?</summary><p>Bộ ảnh ban đầu là ảnh chụp tư liệu minh họa từ Pexels, có ghi nguồn. Không được hiểu là hình ảnh hoạt động, thành viên hoặc người nhận hỗ trợ của trang. Admin có thể thay thế bằng ảnh được phép sử dụng của mình.</p></details></div></div></section>${cta()}`;renderStoryGrid();observe();}
function renderStoryGrid(){if(!$('#stories-grid'))return;let rows=S.posts.filter(p=>(S.filter==='Tất cả'||p.category===S.filter)&&(!S.search||norm(p.title+' '+p.excerpt+' '+(p.tags||[]).join(' ')).includes(norm(S.search))));rows.sort(S.sort==='title'?(a,b)=>a.title.localeCompare(b.title,'vi'):S.sort==='old'?(a,b)=>new Date(a.published_at||a.created_at)-new Date(b.published_at||b.created_at):(a,b)=>new Date(b.published_at||b.created_at)-new Date(a.published_at||a.created_at));$('#story-count').textContent=`${rows.length} câu chuyện${S.search?' phù hợp':''}`;$('#stories-grid').innerHTML=rows.length?rows.slice(0,S.limit).map(card).join(''):emptyHTML(S.publicError?'Chưa tải được bài viết':'Chưa tìm thấy câu chuyện phù hợp',S.publicError||'Thử đổi từ khóa hoặc chọn một chuyên mục khác nhé.');$('#more-stories').innerHTML=rows.length>S.limit?`<button class="btn" data-action="load-more">Đọc thêm câu chuyện${icon('plus')}</button>`:rows.length?`<span class="small muted" style="font-size:10px">Bạn đã xem hết ${rows.length} câu chuyện.</span>`:'';$$('.chip').forEach(c=>{const active=c.dataset.value===S.filter;c.classList.toggle('active',active);c.setAttribute('aria-pressed',active);});observe();}
function inline(text){function simple(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}let out='',last=0;for(const m of String(text).matchAll(/\[([^\]\n]+)\]\(([^\s)]+)\)/g)){out+=simple(text.slice(last,m.index));const url=safeURL(m[2]);out+=url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${simple(m[1])}</a>`:simple(m[0]);last=m.index+m[0].length;}return out+simple(String(text).slice(last));}
function markdown(content){const lines=String(content||'').replace(/\r/g,'').split('\n');let html='',paragraph=[],list=[],listType='',quote=[],toc=[],n=0;function flushP(){if(paragraph.length){html+='<p>'+paragraph.map(inline).join('<br>')+'</p>';paragraph=[];}}function flushL(){if(list.length){html+=`<${listType}>`+list.map(x=>'<li>'+inline(x)+'</li>').join('')+`</${listType}>`;list=[];}}function flushQ(){if(quote.length){html+='<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>';quote=[];}}for(const line of lines){if(!line.trim()){flushP();flushL();flushQ();continue;}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){flushP();flushL();flushQ();const level=h[1].length<=2?2:3;const id='sec-'+(++n);html+=`<h${level} id="${id}">${inline(h[2])}</h${level}>`;toc.push({id,text:h[2].replace(/\*/g,'')});continue;}if(/^>\s?/.test(line)){flushP();flushL();quote.push(line.replace(/^>\s?/,''));continue;}const ul=line.match(/^[-*]\s+(.+)$/),ol=line.match(/^\d+[.)]\s+(.+)$/);if(ul||ol){flushP();flushQ();const type=ul?'ul':'ol';if(list.length&&listType!==type)flushL();listType=type;list.push((ul||ol)[1]);continue;}flushL();flushQ();paragraph.push(line);}flushP();flushL();flushQ();return {html,toc};}
async function renderArticle(slug,token){S.view='article';let p=S.posts.find(x=>x.slug===slug);if(online()){try{const rows=await api('/rest/v1/vmblog_posts?select=*&slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&limit=1');if(token!==S.routeToken)return;p=rows?.[0];}catch(e){if(token!==S.routeToken)return;$('#main').innerHTML=`<div class="wrap not-found"><h1>Chưa thể mở câu chuyện</h1><p>${esc(errorMessage(e))}</p><button class="btn btn-red" data-action="reload-route">Thử lại</button><a href="#/cau-chuyen" class="text-link">Quay lại danh sách</a></div>`;return;}}if(token!==S.routeToken)return;if(!p){$('#main').innerHTML='<div class="wrap not-found"><div class="eyebrow">Câu chuyện chưa sẵn sàng</div><h1>Bài viết chưa được công khai<br>hoặc không còn tồn tại.</h1><p class="muted">Bạn có thể khám phá những câu chuyện khác của trang.</p><a class="btn btn-red" href="#/cau-chuyen">Về danh sách bài viết</a></div>';document.title='Không tìm thấy bài viết — '+TITLE;return;}S.article=p;const md=markdown(p.content);document.title=p.title+' — '+TITLE;const related=S.posts.filter(x=>x.id!==p.id).sort((a,b)=>(b.category===p.category)-(a.category===p.category)).slice(0,3);$('#main').innerHTML=`<article class="article-page"><div class="wrap"><nav class="breadcrumb" aria-label="Đường dẫn"><a href="#/">Trang chủ</a>${icon('chevron')}<a href="#/cau-chuyen">Câu chuyện</a>${icon('chevron')}<span>${esc(p.category)}</span></nav><header class="article-heading"><span class="pill">${esc(p.category)}</span><h1>${esc(p.title)}</h1><p class="article-excerpt">${esc(p.excerpt)}</p><div class="article-byline">${img(DATA.logo,'')}<strong>${esc(p.author||'Vì mình và bạn')}</strong><span>·</span><span>Đăng ${date(p.published_at||p.created_at)}</span><span>·</span><span>${reading(p)} phút đọc</span></div></header><figure><div class="article-cover">${img(p.cover_image,p.title,'',true)}</div><figcaption class="article-caption">${esc(p.image_caption||'Hình ảnh do người đăng cung cấp.')}</figcaption></figure><div class="reading-layout"><aside class="article-aside"><h4>Trong câu chuyện này</h4><nav class="toc" aria-label="Mục lục">${md.toc.map(t=>`<a href="#${t.id}" data-toc="${t.id}">${esc(t.text)}</a>`).join('')||'<span class="muted">Đọc trọn câu chuyện bên cạnh.</span>'}</nav><div class="share-tools"><button class="icon-btn" data-action="share-facebook" aria-label="Chia sẻ bài lên Facebook">${icon('facebook')}</button><button class="icon-btn" data-action="copy-link" aria-label="Sao chép liên kết bài">${icon('copy')}</button><button class="icon-btn" data-action="print" aria-label="In bài viết">${icon('print')}</button></div></aside><div><div class="reading-toolbar"><span>${icon('clock','icon-sm')} Đọc chậm, cảm nhận nhiều hơn</span><div class="reading-tools"><button data-action="font-smaller" aria-label="Giảm cỡ chữ">A−</button><button data-action="font-larger" aria-label="Tăng cỡ chữ">A+</button><button data-action="reading-mode" aria-pressed="false">Êm mắt</button></div></div>${p.is_starter?'<div class="preview-label">Bài viết mở đầu được biên soạn cho website; không phải tường thuật về một chuyến đi đã diễn ra. Ảnh tư liệu chỉ dùng để minh họa.</div>':''}<div class="prose" id="article-prose">${md.html}</div>${p.gallery?.length?`<div class="article-gallery">${p.gallery.map((g,i)=>`<figure><button data-action="article-gallery" data-index="${i}" aria-label="Xem ảnh ${i+1}">${img(g.src,g.caption||'Hình ảnh trong bài viết')}</button><figcaption>${esc(g.caption||'')}</figcaption></figure>`).join('')}</div>`:''}<div class="article-tags">${(p.tags||[]).map(t=>`<button class="chip" data-action="search-tag" data-value="${esc(t)}">#${esc(t)}</button>`).join('')}</div><p class="small muted" style="font-size:10px;margin-top:16px">Tạo lúc ${date(p.created_at,true)} · Cập nhật ${date(p.updated_at,true)} · Giờ Việt Nam</p><div class="form-actions"><button class="btn btn-small btn-red" data-action="share-facebook">${icon('facebook')}Chia sẻ câu chuyện</button><button class="btn btn-small" data-action="copy-link">${icon('link')}Sao chép liên kết</button></div><div class="author-box">${img(DATA.logo,'Biểu tượng của trang')}<div><h4>Vì mình và bạn là người Việt Nam</h4><p>Kể những điều tử tế, kết nối những tấm lòng và cùng nhau gửi một chút yêu thương đến cuộc sống.</p><a href="${FB}" target="_blank" rel="noopener noreferrer">Ghé thăm fanpage ↗</a></div></div><a class="text-link" href="#/cau-chuyen">← Trở về những câu chuyện</a></div></div></div></article>${related.length?`<section class="section related"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Một chút thương nữa, dành cho bạn</div><h2>Đọc thêm <em>cùng chúng mình.</em></h2></div></div><div class="stories-grid">${related.map(card).join('')}</div></div></section>`:''}${cta()}`;observe();updateProgress();}
function observe(){if(!window.IntersectionObserver)return;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)return;document.body.classList.add('js-motion');$$('.reveal:not([data-observed])').forEach(el=>{el.dataset.observed='1';el.classList.add('ready');revealObserver.observe(el);});}
const revealObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');revealObserver.unobserve(e.target);}}),{threshold:.09,rootMargin:'0px 0px 20px 0px'}):null;
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;$('#scroll-progress').style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%';$('#site-header')?.classList.toggle('scrolled',scrollY>15);$('#back-top').classList.toggle('visible',scrollY>550);if(S.view==='article'){let active='';$$('#article-prose h2,#article-prose h3').forEach(h=>{if(h.getBoundingClientRect().top<175)active=h.id;});$$('[data-toc]').forEach(a=>a.classList.toggle('active',a.dataset.toc===active));}else if(S.view==='home'){let active='';['cau-chuyen','ve-chung-minh','khoanh-khac','ket-noi'].forEach(id=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<190)active=id;});$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===active));}}
function goSection(id){if(!id){scrollTo({top:0,behavior:'smooth'});return;}const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
async function route(){const hash=location.hash||'#/';if(S.busy&&hash!==S.lastHash){history.replaceState(null,'',S.lastHash);return;}if(S.dirty&&hash!==S.lastHash){if(!confirm('Bài viết có thay đổi chưa lưu. Bạn muốn rời trang và bỏ các thay đổi này?')){history.replaceState(null,'',S.lastHash);return;}S.dirty=false;}S.lastHash=hash;const token=++S.routeToken;$('#main-nav')?.classList.remove('open');$('[data-action="menu"]')?.setAttribute('aria-expanded','false');const path=hash.replace(/^#\/?/,'');if(path.startsWith('bai-viet/')){document.body.classList.remove('reading-comfort');$('#main').innerHTML='<div class="wrap" style="padding:70px 0"><div class="loading-line" role="status" aria-label="Đang mở bài viết"></div></div>';scrollTo({top:0,behavior:'instant'});await renderArticle(decodeURIComponent(path.slice(9)),token);}else if(path==='admin'){document.body.classList.remove('reading-comfort');if(!S.isAdmin){if(S.view!=='home')renderHome();showLogin();return;}S.view='admin';S.editor=null;S.dirty=false;await renderAdmin();scrollTo({top:0,behavior:'instant'});}else{if(S.view!=='home')renderHome();if(path)requestAnimationFrame(()=>goSection(path));else scrollTo({top:0,behavior:'instant'});}$('#main').focus({preventScroll:true});updateProgress();}
function showLogin(){if(S.isAdmin){if(S.view==='admin'){if(canDiscard()){S.editor=null;renderAdmin();}}else location.hash='/admin';return;}modal('Một góc riêng của Admin',`${img(DATA.logo,'','login-crest')}<p class="login-intro">Đăng nhập để viết, chỉnh sửa và xuất bản câu chuyện. Khách ghé thăm không cần tài khoản.</p>${!online()?'<div class="notice" style="margin-bottom:22px">Website chưa kết nối hệ thống đăng bài. Cần thiết lập Supabase một lần để tài khoản Admin hoạt động trên Internet.</div>':''}<form id="login-form"><label class="field"><span>Tài khoản</span><input name="username" value="Admin" autocomplete="username" readonly required></label><label class="field"><span>Mật khẩu</span><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu của Admin" required maxlength="128"><button type="button" data-action="toggle-password" aria-label="Hiện hoặc ẩn mật khẩu">${icon('eye')}</button></div></label><div class="form-error" id="login-error" role="alert"></div><button class="btn btn-red wide-button" type="submit">${icon('lock')}Đăng nhập quản trị${icon('arrow')}</button></form><p class="login-note">Chỉ một tài khoản Admin · Không mở đăng ký công khai</p>${!online()?'<div class="center-actions" style="margin-top:19px"><button class="text-link" style="background:none;border:0;color:var(--red)" data-action="setup">Thiết lập đăng bài trực tuyến →</button></div>':''}`);}
async function login(form){const err=$('#login-error');err.textContent='';if(!online()){err.textContent='Chưa cấu hình Supabase. Bấm “Thiết lập đăng bài trực tuyến” bên dưới trước khi đăng nhập.';return;}setBusy(form,true);try{const fd=new FormData(form);if(fd.get('username')!=='Admin')throw new Error('Chỉ tài khoản Admin được phép đăng nhập.');const x=await rawRequest('/auth/v1/token?grant_type=password',{method:'POST',body:{email:CONFIG.adminEmail||EMAIL,password:fd.get('password')}});const token=x.access_token;if(!token)throw new Error('Máy chủ chưa xác nhận đăng nhập.');const allowed=await rawRequest('/rest/v1/rpc/vmblog_is_admin',{method:'POST',body:{},token});if(allowed!==true){await rawRequest('/auth/v1/logout',{method:'POST',token}).catch(()=>{});throw new Error('Tài khoản chưa được cấp quyền Admin trong cơ sở dữ liệu.');}S.session={...x,expires_at:x.expires_at||Date.now()/1000+x.expires_in};S.isAdmin=true;form.reset();closeModal();updateAdminBar();toast('Đã đăng nhập Admin. Bạn có thể bắt đầu viết bài.');if(location.hash==='#/admin')await route();else location.hash='/admin';}catch(e){S.session=null;S.isAdmin=false;err.textContent=errorMessage(e);}finally{setBusy(form,false);}}
async function logout(){if(S.busy){toast('Đang lưu dữ liệu. Vui lòng hoàn tất thao tác trước khi đăng xuất.');return;}if(S.dirty&&!confirm('Có nội dung chưa lưu. Đăng xuất và bỏ nội dung đang sửa?'))return;S.dirty=false;const token=S.session?.access_token;S.session=null;S.isAdmin=false;S.editor=null;S.adminPosts=[];updateAdminBar();if(token)await rawRequest('/auth/v1/logout',{method:'POST',token}).catch(()=>{});closeModal();S.view='';location.hash='/';renderHome();toast('Đã đăng xuất. Bạn đang xem website công khai.');}
function validateConfig(url,key,email){url=url.trim().replace(/\/$/,'');key=key.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url))throw new Error('Project URL phải có dạng https://ten-du-an.supabase.co.');if(key.startsWith('sb_secret_'))throw new Error('Không được dùng secret key trong website công khai.');if(key.startsWith('eyJ')){try{const part=key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const payload=JSON.parse(atob(part));if(payload.role!=='anon')throw new Error();}catch{throw new Error('Chỉ dùng anon key có role anon, không dùng service_role.');}}else if(!/^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(key))throw new Error('Nhập publishable key (sb_publishable_…) hoặc anon key hợp lệ.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Email của tài khoản Admin chưa hợp lệ.');return {url,key,adminEmail:email.trim()};}
function showSetup(){modal('Thiết lập đăng bài trên Internet',`<p>GitHub Pages hiển thị website. Supabase giữ bài viết và xác thực một tài khoản Admin. Không đặt mật khẩu hoặc secret key trong mã nguồn.</p><ol class="setup-steps"><li><strong>Tạo dự án Supabase</strong>Vào supabase.com, tạo dự án của bạn. Mở SQL Editor và chạy tệp khởi tạo bên dưới. Các bảng mới đều có tiền tố <code>vmblog_</code>, không xóa dữ liệu của website cũ.<br><button class="btn btn-small" data-action="download-sql" style="margin-top:10px">Tải mã SQL khởi tạo</button></li><li><strong>Tạo đúng một người dùng quản trị</strong>Trong Authentication → Users, tạo người dùng bằng email quản trị; đặt mật khẩu bạn đã chọn và xác nhận email. Sao chép User UID. Tắt đăng ký người dùng mới (Allow new users to sign up), đăng nhập ẩn danh và các nhà cung cấp đăng nhập không dùng.</li><li><strong>Cấp quyền tại cơ sở dữ liệu</strong>Thay <code>USER_UID_CUA_ADMIN</code> bằng UID vừa sao chép, rồi chạy trong SQL Editor:<pre class="codeblock">insert into public.vmblog_admin (singleton, user_id)\nvalues (true, 'USER_UID_CUA_ADMIN'::uuid)\non conflict (singleton) do update set user_id = excluded.user_id;</pre>Bảng singleton chỉ cho phép một Admin. Khách chỉ đọc được bài đã công khai.</li><li><strong>Kết nối và xuất index.html</strong>Nhập Project URL, publishable key và email tài khoản vừa tạo. Nút dưới kiểm tra kết nối rồi xuất bản HTML đã cấu hình. Đưa bản này lên GitHub Pages; không đưa mật khẩu lên GitHub.</li></ol><form id="setup-form"><div class="field-row"><label class="field"><span>Project URL</span><input name="url" type="url" required placeholder="https://ten-du-an.supabase.co" value="${esc(CONFIG.url)}"></label><label class="field"><span>Email phía máy chủ của Admin</span><input name="email" type="email" required value="${esc(CONFIG.adminEmail||EMAIL)}"></label></div><label class="field"><span>Publishable key hoặc anon key</span><input name="key" autocomplete="off" required placeholder="sb_publishable_…" value="${esc(CONFIG.key)}"><small>Khóa công khai hoạt động cùng RLS. Không nhập service_role, secret key hay mật khẩu database.</small></label><div class="form-error" id="setup-error" role="alert"></div><button type="submit" class="btn btn-red">${icon('download')}Kiểm tra & xuất index.html</button></form><p class="small" style="margin-top:18px">Đây là cấu hình cho bản tải xuống, không thay đổi website đang hoạt động hay tài khoản máy chủ của bạn. Trên màn hình đăng nhập, tên tài khoản vẫn là <strong>Admin</strong>.</p>`,true);}
async function setup(form){setBusy(form,true);$('#setup-error').textContent='';try{const f=new FormData(form);const c=validateConfig(f.get('url'),f.get('key'),f.get('email'));await rawRequest('/rest/v1/vmblog_posts?select=id&limit=1',{config:c});const safeJSON=JSON.stringify(c).replace(/</g,'\\u003c');const html=ORIGINAL_HTML.replace(/(<script id="site-config" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+safeJSON+'$2');download('index.html',html,'text/html;charset=utf-8');toast('Đã kiểm tra kết nối và xuất index.html. Hãy tải bản này lên GitHub Pages.');}catch(e){$('#setup-error').textContent=errorMessage(e);}finally{setBusy(form,false);}}
function showCredits(){modal('Nguồn hình ảnh & cách sử dụng',`<p>Các ảnh chụp ban đầu được chọn từ Pexels để minh họa tinh thần sẻ chia và đời sống. Đây <strong>không phải</strong> bằng chứng hoạt động của fanpage; người xuất hiện không phải thành viên, người nhận hỗ trợ hoặc người bảo chứng cho trang. Không gán bệnh tật, hoàn cảnh mồ côi hay khó khăn cho người trong ảnh.</p><div class="credit-list" style="margin-top:22px">${Object.values(DATA.photos).map(p=>`<div class="credit-item"><strong>${esc(p.title)}</strong><br>${esc(p.author)} / Pexels<br><a href="${p.url}" target="_blank" rel="noopener noreferrer">Trang ảnh gốc ↗</a></div>`).join('')}</div><p style="margin-top:20px">Giấy phép và điều kiện sử dụng: <a href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">Pexels License</a>. Logo là thiết kế được cung cấp cho fanpage trong cuộc trò chuyện. Ảnh do Admin thay thế phải có quyền sử dụng và sự đồng ý phù hợp trước khi công khai.</p>`,true);}
function showPrivacy(){modal('Sự riêng tư luôn đáng quý',`<h3>Đọc mà không cần tài khoản</h3><p>Khách có thể xem nội dung công khai mà không đăng ký. Website không cài công cụ phân tích hoặc theo dõi quảng cáo riêng. GitHub Pages, nhà cung cấp dữ liệu, ảnh và font có thể xử lý thông tin kỹ thuật khi trình duyệt tải tài nguyên.</p><h3>Đối với thông tin trong bài viết</h3><p>Không công khai giấy tờ, bệnh án, địa chỉ riêng hay thông tin nhạy cảm khi chưa có sự đồng ý phù hợp. Khi cần phản ánh hoặc đề nghị xem lại nội dung, hãy gửi lời nhắn qua fanpage hoặc email ${esc(EMAIL)}.</p><h3>Ảnh minh họa</h3><p>Ảnh tư liệu ban đầu có ghi nguồn và không được hiểu là nhân vật, thành viên hay hoạt động của trang. Người đăng chịu trách nhiệm về nội dung và quyền sử dụng các ảnh được cập nhật.</p><h3>Quản trị website</h3><p>Mật khẩu được xác thực tại Supabase, không lưu trong HTML. Phiên Admin chỉ được giữ trong bộ nhớ của trang hiện tại; tải lại trang sẽ cần đăng nhập lại. Không có đăng ký công khai.</p>`,true);}
function showGallery(items,index=0){if(!items?.length)return;index=(index+items.length)%items.length;const x=items[index];modal('Một khoảnh khắc sẻ chia',`${img(x.src,x.caption||x.title||'Hình ảnh')}<p class="gallery-caption">${esc(x.caption||x.title||'')}</p><div class="lightbox-controls"><button class="icon-btn" data-action="gallery-prev" aria-label="Ảnh trước">←</button><span>${index+1} / ${items.length} · Dùng phím ← → để chuyển ảnh</span><button class="icon-btn" data-action="gallery-next" aria-label="Ảnh tiếp theo">→</button></div>`,true,'gallery');S.gallery={items,index};}
async function copyLink(){try{await navigator.clipboard.writeText(location.href);toast('Đã sao chép liên kết câu chuyện.');}catch{modal('Liên kết câu chuyện',`<label class="field"><span>Sao chép liên kết bên dưới</span><input value="${esc(location.href)}" readonly></label>`);}}
function shareFacebook(){const url=new URL(location.href);if(!/^https?:$/.test(url.protocol)){toast('Hãy đưa website lên GitHub Pages trước khi chia sẻ liên kết ra Internet.',true);return;}window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url.href),'_blank','noopener,noreferrer');}/* Admin workspace: all mutations use authenticated requests + server RLS. */
async function renderAdmin(refresh=true){if(!S.isAdmin){showLogin();return;}S.view='admin';document.title='Admin · Quản lý câu chuyện — '+TITLE;$('#main').innerHTML='<div class="wrap admin-page"><div class="loading-line" role="status" aria-label="Đang mở trang quản trị"></div></div>';try{if(refresh){S.adminPosts=await listRows(true);const site=await api('/rest/v1/vmblog_site?select=*&id=eq.1',{auth:true});S.site=site?.[0]||{};}$('#main').innerHTML=`<section class="admin-page"><div class="wrap"><div class="admin-heading"><div><div class="eyebrow">Một góc để kể chuyện</div><h1>Xin chào, Admin.</h1><p>Viết điều muốn kể. Giữ điều đáng trân trọng. Xuất bản khi đã sẵn sàng.</p></div><button class="btn btn-red" data-action="new-post">${icon('plus')}Viết câu chuyện mới</button></div><div class="admin-tabs"><button data-action="admin-tab" data-value="posts" class="${S.adminTab==='posts'?'active':''}">Bài viết</button><button data-action="admin-tab" data-value="appearance" class="${S.adminTab==='appearance'?'active':''}">Ảnh trang chủ</button><button data-action="admin-tab" data-value="help" class="${S.adminTab==='help'?'active':''}">Hướng dẫn & sao lưu</button></div><div id="admin-content"></div></div></section>`;renderAdminTab();}catch(e){$('#main').innerHTML=`<div class="wrap admin-page"><div class="notice error">${esc(errorMessage(e))}</div><div class="form-actions"><button class="btn btn-red" data-action="reload-admin">Tải lại quản trị</button><a class="btn" href="#/">Về trang công khai</a></div></div>`;}}
function renderAdminTab(){if(S.adminTab==='appearance'){renderAppearance();return;}if(S.adminTab==='help'){renderAdminHelp();return;}const all=S.adminPosts;$('#admin-content').innerHTML=`<div class="admin-stats"><div class="admin-stat"><strong>${all.length}</strong><span>Tổng số bài viết</span></div><div class="admin-stat"><strong>${all.filter(p=>p.status==='published').length}</strong><span>Đang công khai</span></div><div class="admin-stat"><strong>${all.filter(p=>p.status==='draft').length}</strong><span>Bản nháp riêng tư</span></div></div>${!all.length?'<div class="notice" style="margin-bottom:22px">Website trực tuyến chưa có bài. Bạn có thể viết bài mới hoặc đưa 8 bài mở đầu được biên soạn sẵn lên trang. Không có dữ liệu về những chuyến đi thật trong các bài mở đầu.<div class="form-actions"><button class="btn btn-small" data-action="seed-posts">Thêm 8 bài mở đầu</button></div></div>':''}<div class="admin-toolbar"><div class="search-box">${icon('search')}<input id="admin-search" type="search" placeholder="Tìm trong bài viết…" aria-label="Tìm bài viết quản trị" value="${esc(S.adminSearch)}"></div><div class="chips">${[['all','Tất cả'],['published','Công khai'],['draft','Bản nháp']].map(([v,t])=>`<button class="chip ${S.adminFilter===v?'active':''}" data-action="admin-filter" data-value="${v}">${t}</button>`).join('')}</div></div><div class="admin-list" id="admin-list"></div>`;renderAdminList();}
function renderAdminList(){const rows=S.adminPosts.filter(p=>(S.adminFilter==='all'||p.status===S.adminFilter)&&norm(p.title+' '+p.category).includes(norm(S.adminSearch)));$('#admin-list').innerHTML=rows.length?rows.map(p=>`<article class="admin-row">${img(p.cover_image,'','admin-thumb')}<div class="admin-row-copy"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${p.status==='published'?'green':'gray'}">${p.status==='published'?'Công khai':'Bản nháp'}</span>${p.featured?'<span class="pill gold">Nổi bật</span>':''}${p.is_starter?'<span class="pill gray">Bài mở đầu</span>':''}</div><h3>${esc(p.title)}</h3><div class="meta"><span>${esc(p.category)}</span><span>·</span><span>Cập nhật ${date(p.updated_at,true)}</span></div></div><div class="row-actions"><button class="btn btn-small" data-action="edit-post" data-id="${p.id}">${icon('edit','icon-sm')}Sửa</button>${p.status==='published'?`<a class="btn btn-small" href="${articleHref(p)}">Xem</a>`:`<button class="btn btn-small" data-action="preview-saved" data-id="${p.id}">Xem nháp</button>`}<button class="btn btn-small btn-danger" data-action="delete-post" data-id="${p.id}" aria-label="Xóa bài ${esc(p.title)}">${icon('trash','icon-sm')}</button></div></article>`).join(''):emptyHTML('Chưa có bài phù hợp','Đổi bộ lọc hoặc bắt đầu một câu chuyện mới.');}
function canDiscard(){if(S.busy){toast('Đang lưu. Vui lòng không rời biểu mẫu.');return false;}if(!S.dirty)return true;if(confirm('Bạn đang có thay đổi chưa lưu. Bỏ thay đổi và tiếp tục?')){S.dirty=false;return true;}return false;}
function newPost(){if(!S.isAdmin)return showLogin();if(!canDiscard())return;const id=crypto.randomUUID();openEditor({id,slug:'',title:'',excerpt:'',content:'',category:CATEGORIES[0],author:'Vì mình và bạn',cover_image:'',image_caption:'',tags:[],gallery:[],status:'draft',featured:false,is_starter:false,rights_confirmed:false,exists:false});}
function openEditor(p){if(!S.isAdmin)return;S.editor={...copy(p),exists:p.exists===false?false:true};S.dirty=false;const x=S.editor;$('#main').innerHTML=`<section class="admin-page"><div class="wrap"><div class="editor-top"><div><button class="btn btn-small btn-quiet" data-action="back-admin">← Danh sách bài viết</button><h2 style="margin-top:14px">${x.exists?'Chỉnh sửa câu chuyện':'Viết một câu chuyện mới'}</h2></div><span class="save-status" id="save-status">${x.exists?'Cập nhật gần nhất: '+date(x.updated_at,true):'Chưa lưu lên máy chủ'}</span></div><form id="post-form"><div class="editor-grid"><div><div class="editor-panel"><label class="field"><span>Tiêu đề bài viết *</span><input class="editor-title" name="title" required maxlength="180" placeholder="Bắt đầu bằng một điều muốn kể…" value="${esc(x.title)}"></label><label class="field"><span>Đoạn giới thiệu ngắn *</span><textarea name="excerpt" rows="3" required maxlength="360" placeholder="Một vài dòng mời người đọc bước vào câu chuyện.">${esc(x.excerpt)}</textarea><small>Hiển thị trên thẻ bài viết và phần mở đầu trang đọc. Tối đa 360 ký tự.</small></label><label class="field"><span>Nội dung *</span><div class="format-toolbar" aria-label="Định dạng nội dung"><button type="button" data-action="format" data-format="h2">Tiêu đề H2</button><button type="button" data-action="format" data-format="h3">H3</button><button type="button" data-action="format" data-format="bold"><strong>B</strong></button><button type="button" data-action="format" data-format="quote">Trích dẫn</button><button type="button" data-action="format" data-format="list">Danh sách</button><button type="button" data-action="format" data-format="link">Liên kết</button></div><textarea id="post-content" class="editor-content" name="content" required maxlength="80000" placeholder="Viết bằng sự chân thành. Dùng ## cho tiêu đề, **chữ đậm** và > cho một câu trích dẫn.">${esc(x.content)}</textarea><small>Nội dung dạng văn bản/Markdown an toàn; không thực thi HTML hoặc JavaScript. Tối đa 80.000 ký tự.</small></label><button type="button" class="btn btn-small" data-action="preview-editor">${icon('eye')}Xem trước bài viết</button><div id="editor-preview" hidden></div></div><div class="editor-panel" style="margin-top:22px"><h3>Những hình ảnh trong câu chuyện</h3><p class="editor-help" style="margin-bottom:15px">Tối đa 6 ảnh JPG, PNG hoặc WebP. Ảnh được thu nhỏ, nén và loại bỏ metadata khi chọn từ máy. Thêm chú thích và nguồn để người đọc hiểu đúng.</p><div class="editor-gallery" id="editor-gallery"></div><label class="field"><span>Thêm ảnh từ thiết bị</span><input id="gallery-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div></div><aside class="editor-sidebar"><div class="editor-panel"><h3>Xuất bản</h3><label class="field"><span>Trạng thái</span><select name="status"><option value="draft" ${x.status==='draft'?'selected':''}>Bản nháp — chỉ Admin xem</option><option value="published" ${x.status==='published'?'selected':''}>Công khai — mọi người cùng đọc</option></select></label><label class="field"><span>Chuyên mục</span><select name="category">${CATEGORIES.map(c=>`<option ${c===x.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="field"><span>Tên tác giả hiển thị</span><input name="author" maxlength="80" required value="${esc(x.author||'Vì mình và bạn')}"></label><label class="check-label"><input name="featured" type="checkbox" ${x.featured?'checked':''}><span>Đưa vào nhóm câu chuyện nổi bật</span></label><label class="check-label"><input name="is_starter" type="checkbox" ${x.is_starter?'checked':''}><span>Gắn chú thích “Bài viết mở đầu”</span></label><label class="check-label"><input name="rights_confirmed" type="checkbox" ${x.rights_confirmed?'checked':''}><span>Tôi đã rà soát nội dung, quyền sử dụng hình ảnh và sự đồng ý cần thiết trước khi công khai.</span></label><div class="form-error" id="post-error" role="alert"></div><button type="submit" class="btn btn-red wide-button">${icon('check')}Lưu bài viết</button><p class="editor-help">Bản nháp được bảo vệ tại cơ sở dữ liệu. Mật khẩu không nằm trong mã nguồn. Nội dung chưa lưu chỉ ở trang đang mở; hãy lưu nháp trước khi đóng tab.</p></div><div class="editor-panel"><h3>Ảnh đại diện bài viết</h3><label class="upload-area" for="cover-upload"><img id="cover-preview" src="${esc(safeURL(x.cover_image,true)||DATA.logo)}" alt="Xem trước ảnh bìa"><span>Chọn ảnh từ máy</span><input id="cover-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field" style="margin-top:15px"><span>Hoặc liên kết ảnh HTTPS</span><input id="cover-url" type="url" placeholder="https://…" value="${x.cover_image?.startsWith('https:')?esc(x.cover_image):''}"><small>Ảnh từ liên kết phụ thuộc máy chủ bên ngoài. Nên tải ảnh của bạn từ thiết bị để lưu cùng bài.</small></label><button type="button" class="btn btn-small btn-quiet" data-action="clear-cover">Bỏ ảnh hiện tại</button><label class="field" style="margin-top:15px"><span>Chú thích / nguồn ảnh</span><textarea name="image_caption" rows="3" maxlength="500" placeholder="Ví dụ: Ảnh của trang, sử dụng với sự đồng ý của người trong ảnh.">${esc(x.image_caption)}</textarea></label></div><div class="editor-panel"><label class="field"><span>Thẻ chủ đề</span><input name="tags" maxlength="240" placeholder="Yêu thương, Sẻ chia, Tình người" value="${esc((x.tags||[]).join(', '))}"><small>Ngăn cách bằng dấu phẩy; tối đa 8 thẻ.</small></label>${x.exists?`<p class="editor-help">Tạo: ${date(x.created_at,true)}<br>Cập nhật: ${date(x.updated_at,true)}<br>Đường dẫn bài không đổi khi sửa tiêu đề.</p>`:''}</div></aside></div></form></div></section>`;renderEditorGallery();scrollTo({top:0,behavior:'instant'});}
function editorData(){const f=$('#post-form');const fd=new FormData(f);return {title:String(fd.get('title')||'').trim(),excerpt:String(fd.get('excerpt')||'').trim(),content:String(fd.get('content')||'').trim(),category:fd.get('category'),author:String(fd.get('author')||'').trim(),cover_image:S.editor.cover_image||'',image_caption:String(fd.get('image_caption')||'').trim(),gallery:copy(S.editor.gallery||[]),tags:[...new Set(String(fd.get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean))].slice(0,8),status:fd.get('status'),featured:fd.has('featured'),is_starter:fd.has('is_starter'),rights_confirmed:fd.has('rights_confirmed')};}
function markDirty(){S.dirty=true;if($('#save-status'))$('#save-status').textContent='Có thay đổi chưa lưu';}
function slugify(t){return norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90)||'cau-chuyen';}
async function savePost(form){if(!S.isAdmin)throw new Error('Cần đăng nhập Admin.');if(S.busy)return;$('#post-error').textContent='';const p=editorData();if(!p.title||!p.excerpt||!p.content){$('#post-error').textContent='Nhập tiêu đề, đoạn giới thiệu và nội dung trước khi lưu.';return;}if(p.status==='published'&&!p.rights_confirmed){$('#post-error').textContent='Vui lòng xác nhận đã rà soát nội dung và quyền sử dụng ảnh trước khi công khai.';return;}if(p.cover_image&&!p.image_caption){$('#post-error').textContent='Hãy thêm chú thích hoặc nguồn cho ảnh đại diện bài viết.';return;}if(p.cover_image&&!safeURL(p.cover_image,true)){ $('#post-error').textContent='Liên kết ảnh chưa hợp lệ. Chỉ dùng HTTPS hoặc tải ảnh từ máy.';return;}if(p.gallery.some(g=>!String(g.caption||'').trim())){$('#post-error').textContent='Hãy bổ sung chú thích hoặc nguồn cho từng ảnh trong bài.';return;}if(JSON.stringify(p.gallery).length>5000000){$('#post-error').textContent='Bộ ảnh quá lớn. Hãy giảm số lượng hoặc kích thước ảnh.';return;}S.busy=true;setBusy(form,true);try{const ed=S.editor;const payload={...p,slug:ed.slug||slugify(p.title)+'-'+ed.id.slice(0,8)};let rows;if(ed.exists)rows=await api('/rest/v1/vmblog_posts?id=eq.'+ed.id+'&revision=eq.'+ed.revision,{auth:true,method:'PATCH',body:payload,headers:{Prefer:'return=representation'}});else rows=await api('/rest/v1/vmblog_posts',{auth:true,method:'POST',body:{id:ed.id,...payload},headers:{Prefer:'return=representation'}});if(!rows?.length)throw new Error('Bài viết đã thay đổi ở phiên khác. Nội dung đang soạn vẫn còn; sao chép lại rồi tải bản mới trước khi lưu.');S.dirty=false;S.editor=null;await loadPublic();await renderAdmin();toast(p.status==='published'?'Đã lưu và công khai bài viết. Khách truy cập có thể đọc trên website.':'Đã lưu bản nháp. Chỉ Admin được xem.');}catch(e){$('#post-error').textContent=errorMessage(e);}finally{S.busy=false;setBusy(form,false);}}
function renderEditorGallery(){const el=$('#editor-gallery');if(!el)return;el.innerHTML=(S.editor.gallery||[]).map((g,i)=>`<figure>${img(g.src,g.caption||'Ảnh '+(i+1))}<input data-gallery-caption="${i}" value="${esc(g.caption||'')}" maxlength="500" aria-label="Chú thích ảnh ${i+1}" placeholder="Chú thích / nguồn ảnh"><button type="button" data-action="remove-gallery" data-index="${i}">Bỏ ảnh</button></figure>`).join('');}
async function optimizeImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Chỉ nhận ảnh JPG, PNG hoặc WebP.');if(file.size>15*1024*1024)throw new Error('Ảnh gốc quá lớn; hãy chọn ảnh dưới 15 MB.');const u=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Không đọc được tệp ảnh. Vui lòng chọn lại.'));reader.readAsDataURL(file);});try{const pic=new Image();pic.src=u;await pic.decode();if(!pic.naturalWidth||pic.naturalWidth*pic.naturalHeight>80000000)throw new Error('Ảnh có độ phân giải quá lớn hoặc không đọc được.');const ratio=Math.min(1,1600/pic.naturalWidth,1600/pic.naturalHeight);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(pic.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(pic.naturalHeight*ratio));const c=canvas.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,canvas.width,canvas.height);c.drawImage(pic,0,0,canvas.width,canvas.height);let q=.84,uri=canvas.toDataURL('image/jpeg',q);while(uri.length>650000&&q>.45){q-=.08;uri=canvas.toDataURL('image/jpeg',q);}if(uri.length>780000)throw new Error('Ảnh còn quá lớn sau khi nén. Hãy giảm kích thước ảnh trước khi tải.');return uri;}finally{/* Local data URL only; no remote upload before saving. */}}
async function handleCover(input){if(!input.files?.[0])return;input.disabled=true;try{const src=await optimizeImage(input.files[0]);S.editor.cover_image=src;$('#cover-preview').src=src;$('#cover-url').value='';markDirty();toast('Đã thêm ảnh bìa. Ảnh sẽ được lưu khi bạn bấm Lưu bài viết.');}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
async function handleGalleryUpload(input){const files=[...(input.files||[])];if(!files.length)return;const available=6-(S.editor.gallery||[]).length;if(files.length>available){toast('Mỗi bài có tối đa 6 ảnh trong bộ ảnh. Hãy chọn lại số ảnh phù hợp.',true);input.value='';return;}input.disabled=true;try{const images=[];for(const f of files)images.push({src:await optimizeImage(f),caption:''});S.editor.gallery.push(...images);renderEditorGallery();markDirty();toast('Đã thêm ảnh. Nhớ bổ sung chú thích và lưu bài viết.');}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
function formatEditor(type){const t=$('#post-content');const start=t.selectionStart,end=t.selectionEnd,selected=t.value.slice(start,end);let text='';if(type==='bold')text='**'+(selected||'Nội dung nhấn mạnh')+'**';if(type==='h2')text='\n\n## '+(selected||'Tiêu đề nội dung')+'\n\n';if(type==='h3')text='\n\n### '+(selected||'Tiêu đề phụ')+'\n\n';if(type==='quote')text='\n\n> '+(selected||'Một điều muốn gửi gắm')+'\n\n';if(type==='list')text='\n\n- '+(selected||'Ý thứ nhất')+'\n- Ý thứ hai\n\n';if(type==='link')text='['+(selected||'Tên liên kết')+'](https://example.com)';t.setRangeText(text,start,end,'end');t.focus();markDirty();}
function previewEditor(){const x=editorData();const md=markdown(x.content);const el=$('#editor-preview');el.hidden=false;el.className='editor-preview';el.innerHTML=`<div class="eyebrow">Xem trước — chưa phải bài đã công khai</div><h1>${esc(x.title||'Tiêu đề bài viết')}</h1><p class="muted" style="margin-bottom:25px">${esc(x.excerpt)}</p><div class="prose">${md.html}</div>`;el.scrollIntoView({behavior:'smooth',block:'start'});}
function previewSaved(id){const p=S.adminPosts.find(x=>x.id===id);if(!p)return;modal('Xem bản nháp — chỉ Admin',`<div class="preview-label">Bài viết này chưa được công khai. Nội dung được tải bằng phiên Admin.</div><h2 style="font-size:28px;margin:20px 0">${esc(p.title)}</h2><p style="margin-bottom:25px">${esc(p.excerpt)}</p><div class="prose">${markdown(p.content).html}</div>`,true);}
async function deletePost(id){if(S.busy||!S.isAdmin)return;const p=S.adminPosts.find(x=>x.id===id);if(!p||!confirm('Xóa vĩnh viễn bài “'+p.title+'”? Thao tác này không thể hoàn tác.'))return;S.busy=true;try{const rows=await api('/rest/v1/vmblog_posts?id=eq.'+id+'&revision=eq.'+p.revision,{auth:true,method:'DELETE',headers:{Prefer:'return=representation'}});if(!rows?.length)throw new Error('Bài đã được sửa hoặc xóa ở phiên khác. Hãy tải lại danh sách.');await loadPublic();await renderAdmin();toast('Đã xóa bài viết.');}finally{S.busy=false;}}
function renderAdminHelp(){$('#admin-content').innerHTML=`<div class="editor-panel"><h3>Quy trình đăng một câu chuyện</h3><ol class="setup-steps"><li><strong>Viết và chuẩn bị ảnh</strong>Tạo bài mới, nhập tiêu đề, giới thiệu, chuyên mục và nội dung. Tải ảnh có quyền sử dụng, thêm chú thích và nguồn.</li><li><strong>Lưu nháp, đọc lại</strong>Bản nháp chỉ Admin được đọc qua API. Dùng Xem trước để rà soát. Tiêu đề mục trong nội dung sẽ tạo mục lục trên trang chi tiết.</li><li><strong>Chọn Công khai rồi lưu</strong>Xác nhận đã rà soát nội dung và ảnh. Thời gian tạo/cập nhật lấy từ máy chủ, hiển thị theo giờ Việt Nam.</li><li><strong>Chia sẻ liên kết bài</strong>Mở bài ngoài trang công khai để sao chép liên kết. Website liên kết tới fanpage, không tự đăng hoặc đồng bộ bài lên Facebook.</li></ol><div class="notice">Nội dung đang soạn chưa lưu sẽ mất khi tải lại trang. Phiên Admin không được lưu trong trình duyệt; đóng hoặc tải lại trang cần đăng nhập lại. Ảnh và nội dung của bản nháp được bảo vệ cùng hàng dữ liệu bằng RLS.</div><div class="form-actions"><button class="btn" data-action="backup">${icon('download')}Sao lưu bài viết & ảnh trang chủ</button><button class="btn" data-action="seed-posts">Thêm các bài mở đầu còn thiếu</button><button class="btn" data-action="setup">Cấu hình kết nối</button></div><p class="editor-help">Bản sao lưu JSON có thể chứa bản nháp và ảnh chưa công khai. Giữ riêng, không đẩy lên kho GitHub công khai. Khi nhập các bài mở đầu, hệ thống chỉ thêm ID chưa tồn tại và không ghi đè bài của bạn.</p><h3 style="margin-top:35px">Giới hạn cần biết</h3><p class="editor-help">Ảnh tải từ thiết bị được nén rồi lưu cùng bài trong cơ sở dữ liệu. Mỗi bài tối đa 6 ảnh nội dung, ngoài ảnh bìa; phù hợp blog gọn, không thay thế kho ảnh lớn. Liên kết dạng #/bai-viet/... chạy trên GitHub Pages, nhưng bản xem trước khi chia sẻ Facebook dùng thông tin chung của website, không bảo đảm ảnh và tiêu đề riêng của từng bài. Để có SEO/preview riêng từng bài cần xuất trang HTML tĩnh hoặc bổ sung máy chủ dựng trang.</p></div>`;}
async function seedPosts(){if(!S.isAdmin||S.busy)return;if(!confirm('Thêm và công khai các bài mở đầu chưa có? Đây là nội dung biên soạn, không phải báo cáo hoạt động thực tế.'))return;S.busy=true;try{const ids=new Set(S.adminPosts.map(p=>p.id));const rows=DATA.posts.filter(p=>!ids.has(p.id)).map(p=>{const {created_at,updated_at,published_at,revision,...rest}=p;return {...rest,rights_confirmed:true};});if(!rows.length){toast('Các bài mở đầu đều đã có. Không thêm trùng.');return;}await api('/rest/v1/vmblog_posts',{auth:true,method:'POST',body:rows,headers:{Prefer:'return=minimal'}});await loadPublic();await renderAdmin();toast('Đã thêm '+rows.length+' bài mở đầu, không ghi đè nội dung hiện có.');}finally{S.busy=false;}}
async function backup(){if(!S.isAdmin)return;const posts=await listRows(true);const site=await api('/rest/v1/vmblog_site?select=*&id=eq.1',{auth:true});const out={format:'vmvb-blog-backup',version:2,exported_at:new Date().toISOString(),posts,site:site?.[0]||{}};download('vmvb-sao-luu-rieng-tu-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(out,null,2),'application/json');toast('Đã xuất bản sao lưu. Giữ riêng vì tệp có thể chứa bản nháp.');}
function renderAppearance(){S.siteDraft={...copy(S.site),hero_image:S.site.hero_image||'',hero_caption:S.site.hero_caption||'',about_image:S.site.about_image||'',about_caption:S.site.about_caption||'',gallery:copy(S.site.gallery||[])};const d=S.siteDraft;$('#admin-content').innerHTML=`<form id="appearance-form"><div class="editor-grid"><div><div class="editor-panel"><h3>Ảnh chính đầu trang</h3><p class="editor-help" style="margin-bottom:18px">Thay ảnh tư liệu bằng hình ảnh của trang mà bạn có quyền công khai. Nên dùng ảnh dọc, chủ thể rõ ở giữa khung.</p><label class="upload-area">${img(d.hero_image||DATA.photos.hero.src,'Xem trước ảnh đầu trang','',false)}<span>Thay ảnh đầu trang</span><input type="file" data-home-upload="hero" accept="image/jpeg,image/png,image/webp"></label><label class="field" style="margin-top:15px"><span>Chú thích ảnh đầu trang</span><input name="hero_caption" maxlength="500" value="${esc(d.hero_caption)}" placeholder="Nguồn ảnh, bối cảnh và thông tin cần làm rõ"></label><button type="button" class="btn btn-small" data-action="reset-home-image" data-value="hero">Dùng ảnh tư liệu ban đầu</button></div><div class="editor-panel" style="margin-top:22px"><h3>Ảnh tại mục Về chúng mình</h3><label class="upload-area">${img(d.about_image||DATA.photos.spring.src,'Xem trước ảnh giới thiệu')}<span>Thay ảnh giới thiệu</span><input type="file" data-home-upload="about" accept="image/jpeg,image/png,image/webp"></label><label class="field" style="margin-top:15px"><span>Chú thích ảnh giới thiệu</span><input name="about_caption" maxlength="500" value="${esc(d.about_caption)}"></label><button type="button" class="btn btn-small" data-action="reset-home-image" data-value="about">Dùng ảnh tư liệu ban đầu</button></div></div><aside class="editor-sidebar"><div class="editor-panel"><h3>Bộ ảnh trang chủ</h3><p class="editor-help">Tối đa 4 ảnh. Khi có ảnh riêng, bộ ảnh này thay bộ ảnh tư liệu trong mục Khoảnh khắc.</p><div class="editor-gallery" id="home-gallery" style="margin-top:15px"></div><label class="field"><span>Thêm ảnh</span><input id="home-gallery-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="check-label"><input type="checkbox" name="use_stock_gallery" ${S.site.use_stock_gallery!==false?'checked':''}><span>Hiện bộ ảnh tư liệu khi chưa có bộ ảnh riêng. Bỏ chọn để ẩn mục này khi chưa có ảnh.</span></label><label class="check-label"><input type="checkbox" name="rights" required><span>Tôi có quyền sử dụng các ảnh được cập nhật và đã rà soát sự đồng ý của người xuất hiện.</span></label><div class="form-error" id="appearance-error" role="alert"></div><button type="submit" class="btn btn-red wide-button">${icon('check')}Lưu ảnh trang chủ</button></div><div class="notice">Không có ảnh hoạt động thật nào được tự tạo cho trang. Các ảnh tư liệu ban đầu luôn có chú thích và nguồn.</div></aside></div></form>`;renderHomeGallery();}
function renderHomeGallery(){$('#home-gallery').innerHTML=(S.siteDraft.gallery||[]).map((g,i)=>`<figure>${img(g.src,g.caption||'Ảnh '+(i+1))}<input data-home-caption="${i}" value="${esc(g.caption||'')}" maxlength="500" placeholder="Chú thích / nguồn" aria-label="Chú thích ảnh ${i+1}"><button type="button" data-action="remove-home-gallery" data-index="${i}">Bỏ ảnh</button></figure>`).join('');}
async function homeUpload(input){if(!input.files?.[0])return;input.disabled=true;try{const key=input.dataset.homeUpload;const src=await optimizeImage(input.files[0]);S.siteDraft[key+'_image']=src;input.closest('.upload-area').querySelector('img').src=src;markDirty();toast('Đã chọn ảnh. Nhớ lưu ảnh trang chủ.');}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
async function homeGalleryUpload(input){const files=[...(input.files||[])];if(files.length+(S.siteDraft.gallery||[]).length>4){toast('Bộ ảnh trang chủ tối đa 4 ảnh.',true);input.value='';return;}input.disabled=true;try{const g=[];for(const f of files)g.push({src:await optimizeImage(f),caption:'',title:''});S.siteDraft.gallery.push(...g);renderHomeGallery();markDirty();}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
async function saveAppearance(form){if(S.busy||!S.isAdmin)return;const fd=new FormData(form),d=S.siteDraft;$('#appearance-error').textContent='';if(!fd.has('rights')){$('#appearance-error').textContent='Vui lòng xác nhận quyền sử dụng ảnh.';return;}if((d.hero_image&&!String(fd.get('hero_caption')).trim())||(d.about_image&&!String(fd.get('about_caption')).trim())||d.gallery.some(g=>!g.caption?.trim())){$('#appearance-error').textContent='Vui lòng bổ sung chú thích / nguồn cho tất cả ảnh riêng.';return;}const payload={hero_image:d.hero_image,hero_caption:fd.get('hero_caption'),about_image:d.about_image,about_caption:fd.get('about_caption'),gallery:d.gallery.map(g=>({...g,title:g.caption})),use_stock_gallery:fd.has('use_stock_gallery')};S.busy=true;setBusy(form,true);try{const rows=await api('/rest/v1/vmblog_site?id=eq.1&revision=eq.'+(S.site.revision||1),{auth:true,method:'PATCH',body:payload,headers:{Prefer:'return=representation'}});if(!rows?.length)throw new Error('Ảnh trang chủ đã thay đổi ở phiên khác. Hãy tải lại cấu hình trước khi lưu.');S.dirty=false;S.site=rows[0];await renderAdmin();toast('Đã cập nhật ảnh trang chủ cho mọi người cùng xem.');}catch(e){$('#appearance-error').textContent=errorMessage(e);}finally{S.busy=false;setBusy(form,false);}}
/* Central events: no unsafe HTML from post bodies is executed. */
document.addEventListener('click',async e=>{const toc=e.target.closest('[data-toc]');if(toc){e.preventDefault();document.getElementById(toc.dataset.toc)?.scrollIntoView({behavior:'smooth',block:'start'});return;}const same=e.target.closest('a[href^="#/"]');if(same&&same.getAttribute('href')===location.hash){e.preventDefault();if(location.hash==='#/admin'&&S.isAdmin){if(canDiscard()){S.editor=null;await renderAdmin();}}else if(S.view==='home')goSection(location.hash.replace('#/',''));return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;e.preventDefault();try{if(a==='close-modal')closeModal();else if(a==='menu'){const n=$('#main-nav');n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open'));}else if(a==='login')showLogin();else if(a==='logout')await logout();else if(a==='toggle-password'){const p=$('#login-password');p.type=p.type==='password'?'text':'password';b.setAttribute('aria-pressed',p.type==='text');}else if(a==='setup')showSetup();else if(a==='download-sql')download('supabase_setup.sql',SQL);else if(a==='credits')showCredits();else if(a==='privacy')showPrivacy();else if(a==='filter'){S.filter=b.dataset.value;S.limit=6;renderStoryGrid();}else if(a==='load-more'){S.limit+=6;renderStoryGrid();}else if(a==='gallery')showGallery(galleryItems(),Number(b.dataset.index));else if(a==='article-gallery')showGallery(S.article?.gallery,Number(b.dataset.index));else if(a==='gallery-next'&&S.gallery)showGallery(S.gallery.items,S.gallery.index+1);else if(a==='gallery-prev'&&S.gallery)showGallery(S.gallery.items,S.gallery.index-1);else if(a==='copy-link')await copyLink();else if(a==='share-facebook')shareFacebook();else if(a==='print')window.print();else if(a==='font-smaller'||a==='font-larger'){const p=$('#article-prose');const size=parseFloat(getComputedStyle(p).fontSize);p.style.setProperty('--article-size',Math.min(25,Math.max(13,size+(a==='font-larger'?1:-1)))+'px');document.body.classList.remove('reading-comfort');}else if(a==='reading-mode'){document.body.classList.toggle('reading-comfort');b.setAttribute('aria-pressed',document.body.classList.contains('reading-comfort'));}else if(a==='search-tag'){S.filter='Tất cả';S.search=b.dataset.value;S.limit=6;S.view='';location.hash='/cau-chuyen';}else if(a==='top')scrollTo({top:0,behavior:'smooth'});else if(a==='retry-public'){await loadPublic();renderHome();}else if(a==='reload-route')await route();else if(a==='new-post')newPost();else if(a==='back-admin'){if(canDiscard()){S.editor=null;await renderAdmin();}}else if(a==='reload-admin'){if(canDiscard())await renderAdmin();}else if(a==='admin-tab'){if(canDiscard()){S.adminTab=b.dataset.value;S.editor=null;await renderAdmin(false);}}else if(a==='admin-filter'){S.adminFilter=b.dataset.value;renderAdminTab();}else if(a==='edit-post'){if(canDiscard()){const p=S.adminPosts.find(x=>x.id===b.dataset.id);if(p)openEditor(p);}}else if(a==='delete-post')await deletePost(b.dataset.id);else if(a==='preview-saved')previewSaved(b.dataset.id);else if(a==='format')formatEditor(b.dataset.format);else if(a==='preview-editor')previewEditor();else if(a==='remove-gallery'){S.editor.gallery.splice(Number(b.dataset.index),1);renderEditorGallery();markDirty();}else if(a==='clear-cover'){S.editor.cover_image='';$('#cover-preview').src=DATA.logo;$('#cover-url').value='';markDirty();}else if(a==='seed-posts')await seedPosts();else if(a==='backup')await backup();else if(a==='remove-home-gallery'){S.siteDraft.gallery.splice(Number(b.dataset.index),1);renderHomeGallery();markDirty();}else if(a==='reset-home-image'){const key=b.dataset.value;S.siteDraft[key+'_image']='';S.siteDraft[key+'_caption']='';const input=$(`[data-home-upload="${key}"]`);input.closest('.upload-area').querySelector('img').src=DATA.photos[key==='hero'?'hero':'spring'].src;$(`[name="${key}_caption"]`).value='';markDirty();}}catch(err){toast(errorMessage(err),true);}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['login-form','setup-form','post-form','appearance-form'].includes(f.id))return;e.preventDefault();try{if(f.id==='login-form')await login(f);if(f.id==='setup-form')await setup(f);if(f.id==='post-form')await savePost(f);if(f.id==='appearance-form')await saveAppearance(f);}catch(err){toast(errorMessage(err),true);}});
let searchTimer;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='story-search'){S.search=t.value;S.limit=6;clearTimeout(searchTimer);searchTimer=setTimeout(renderStoryGrid,120);}if(t.id==='admin-search'){S.adminSearch=t.value;renderAdminList();}if(t.closest('#post-form')&&!['cover-upload','gallery-upload'].includes(t.id)){markDirty();if(t.hasAttribute('data-gallery-caption'))S.editor.gallery[Number(t.dataset.galleryCaption)].caption=t.value;}if(t.closest('#appearance-form')){markDirty();if(t.hasAttribute('data-home-caption'))S.siteDraft.gallery[Number(t.dataset.homeCaption)].caption=t.value;}});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.id==='story-sort'){S.sort=t.value;renderStoryGrid();}if(t.id==='cover-upload')await handleCover(t);if(t.id==='gallery-upload')await handleGalleryUpload(t);if(t.id==='cover-url'){const v=t.value.trim();if(v&&!safeURL(v,true)){toast('Liên kết ảnh phải bắt đầu bằng HTTPS và không chứa thông tin đăng nhập.',true);return;}S.editor.cover_image=v;$('#cover-preview').src=v||DATA.logo;markDirty();}if(t.dataset.homeUpload)await homeUpload(t);if(t.id==='home-gallery-upload')await homeGalleryUpload(t);}catch(err){toast(errorMessage(err),true);}});
document.addEventListener('keydown',e=>{if(S.gallery&&$('#modal').open){if(e.key==='ArrowRight'){e.preventDefault();showGallery(S.gallery.items,S.gallery.index+1);}if(e.key==='ArrowLeft'){e.preventDefault();showGallery(S.gallery.items,S.gallery.index-1);}}});
$('#modal').addEventListener('close',()=>{S.gallery=null;});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('hashchange',()=>route().catch(e=>toast(errorMessage(e),true)));
let scrollQueued=false;window.addEventListener('scroll',()=>{if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{updateProgress();scrollQueued=false;});},{passive:true});
document.addEventListener('error',e=>{const t=e.target;if(t.tagName!=='IMG'||t.dataset.fallback)return;t.dataset.fallback='1';const label='Ảnh chưa tải được';const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#e4d9c9"/><stop offset="1" stop-color="#f3eee5"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><path d="M340 240c-35-45-100 8-48 60l108 95 108-95c52-52-13-105-48-60l-60 55z" fill="none" stroke="#b68978" stroke-width="3"/><text x="400" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#7d6d5d">'+label+'</text></svg>';t.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);},{capture:true});
(async function boot(){renderShell();if(!online())S.posts=copy(DATA.posts);else S.loading=true;renderHome();if(online()){await loadPublic();if(S.view==='home')renderHome();}S.remoteReady=true;await route();})().catch(e=>{toast(errorMessage(e),true);});</script>
</body>
