c ph\u00e9p, ho\u1eb7c ch\u00ednh ph\u1ea7n vi\u1ec7c c\u1ee7a nh\u00f3m m\u00e0 kh\u00f4ng l\u00e0m l\u1ed9 ng\u01b0\u1eddi kh\u00e1c.\n\nM\u1ed9t b\u00e0i vi\u1ebft kh\u00f4ng c\u00f3 g\u01b0\u01a1ng m\u1eb7t \u0111\u1eabm n\u01b0\u1edbc m\u1eaft v\u1eabn c\u00f3 th\u1ec3 ch\u1ea1m l\u00f2ng. Th\u1eadm ch\u00ed, khi kh\u00f4ng d\u1ef1a v\u00e0o n\u1ed7i \u0111au c\u1ee7a ai \u0111\u1ec3 t\u1ea1o c\u1ea3m x\u00fac, ng\u01b0\u1eddi vi\u1ebft bu\u1ed9c ph\u1ea3i nh\u00ecn s\u00e2u h\u01a1n v\u00e0o gi\u00e1 tr\u1ecb c\u1ee7a h\u00e0nh \u0111\u1ed9ng.\n\nC\u00e2u chuy\u1ec7n c\u00f3 th\u1ec3 l\u00e0 s\u1ef1 ki\u00ean nh\u1eabn, c\u00e1ch gi\u1eef l\u1eddi, c\u00e1ch ng\u01b0\u1eddi tr\u1ebb h\u1ecdc c\u00f9ng nhau. Nh\u1eefng \u0111i\u1ec1u \u1ea5y \u0111\u1ee7 \u0111\u00e1ng k\u1ec3 m\u00e0 kh\u00f4ng c\u1ea7n ai ph\u1ea3i \u0111\u00e1nh \u0111\u1ed5i s\u1ef1 ri\u00eang t\u01b0.\n\n## Gi\u1eef l\u1ea1i m\u1ed9t \u0111i\u1ec1u cho ri\u00eang cu\u1ed9c g\u1eb7p\n\nKh\u00f4ng ph\u1ea3i m\u1ecdi tr\u1ea3i nghi\u1ec7m \u0111\u1ec1u c\u1ea7n \u0111\u01b0\u1ee3c chuy\u1ec3n th\u00e0nh n\u1ed9i dung. C\u00f3 m\u1ed9t ph\u1ea7n c\u1ee7a \u0111\u1eddi s\u1ed1ng n\u00ean \u0111\u01b0\u1ee3c ph\u00e9p ch\u1ec9 \u1edf l\u1ea1i v\u1edbi nh\u1eefng ng\u01b0\u1eddi \u0111\u00e3 c\u00f3 m\u1eb7t.\n\nM\u1ed9t l\u1eddi t\u00e2m s\u1ef1 \u0111\u01b0\u1ee3c nghe kh\u00f4ng t\u1ef1 nhi\u00ean tr\u1edf th\u00e0nh l\u1eddi \u0111\u01b0\u1ee3c ph\u00e9p tr\u00edch. M\u1ed9t t\u00ecnh hu\u1ed1ng l\u00e0m m\u00ecnh ngh\u1eb9n ng\u00e0o kh\u00f4ng t\u1ef1 nhi\u00ean tr\u1edf th\u00e0nh \u0111o\u1ea1n m\u1edf \u0111\u1ea7u cho b\u00e0i \u0111\u0103ng. Khi kh\u00f4ng ch\u1eafc, h\u00e3y h\u1ecfi l\u1ea1i ho\u1eb7c ch\u1ecdn kh\u00f4ng k\u1ec3.\n\n> Kh\u00f4ng ph\u1ea3i \u0111i\u1ec1u g\u00ec l\u00e0m m\u00ecnh x\u00fac \u0111\u1ed9ng c\u0169ng tr\u1edf th\u00e0nh \u0111i\u1ec1u m\u00ecnh c\u00f3 quy\u1ec1n c\u00f4ng khai.\n\nC\u00f3 nh\u1eefng b\u1ee9c \u1ea3nh \u0111\u1eb9p nh\u1ea5t l\u00e0 b\u1ee9c \u1ea3nh kh\u00f4ng ch\u1ee5p. B\u1edfi b\u00ean ngo\u00e0i khung h\u00ecnh \u0111\u00e3 \u0111\u01b0\u1ee3c t\u1eeb b\u1ecf \u1ea5y, m\u1ed9t ng\u01b0\u1eddi v\u1eabn gi\u1eef \u0111\u01b0\u1ee3c quy\u1ec1n ch\u1ecdn c\u00e1ch m\u00ecnh xu\u1ea5t hi\u1ec7n trong th\u1ebf gi\u1edbi. V\u00e0 s\u1ef1 t\u1eed t\u1ebf, l\u1ea7n n\u00e0y, \u0111\u00e3 kh\u00f4ng l\u1ea5y \u0111i \u0111i\u1ec1u g\u00ec \u0111\u1ec3 ch\u1ee9ng minh m\u00ecnh t\u1ed3n t\u1ea1i.","tags":["\u1ee8ng x\u1eed","T\u00f4n tr\u1ecdng","Thi\u1ec7n nguy\u1ec7n","T\u1ea3n v\u0103n bi\u00ean so\u1ea1n"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3},{"id":"c19f51ad-9448-5dcf-a4ab-ff8807199c7f","slug":"logistics-cua-mot-chuyen-di","title":"Sau khi chuy\u1ebfn xe v\u1ec1, xin \u0111\u1eebng \u0111\u1ec3 l\u00f2ng t\u1ed1t d\u1eebng l\u1ea1i","excerpt":"Qu\u00e0 \u0111\u00e3 trao xong kh\u00f4ng c\u00f3 ngh\u0129a m\u1ecdi vi\u1ec7c \u0111\u00e3 xong. C\u00f2n m\u1ed9t l\u1eddi c\u1ea3m \u01a1n, m\u1ed9t ph\u1ea7n ghi ch\u00e9p v\u00e0 nh\u1eefng \u0111i\u1ec1u m\u00ecnh \u0111\u00e3 nh\u1eadn tr\u00e1ch nhi\u1ec7m theo \u0111\u1ebfn c\u00f9ng.","category":"G\u00f3c s\u1ebb chia","author":"V\u00ec m\u00ecnh v\u00e0 b\u1ea1n","cover_image":"https://user-cdn.uef.edu.vn/newsimg/hinhanh/2024/vi-cong-dong/ueftangqua-benhvien-ungbuou%20%288%29.jpg","image_caption":"\u1ea2nh trong b\u00e0i UEF v\u1ec1 ho\u1ea1t \u0111\u1ed9ng d\u00e0nh cho b\u1ec7nh nhi t\u1ea1i B\u1ec7nh vi\u1ec7n Ung B\u01b0\u1edbu TP.HCM. Ngu\u1ed3n: Tr\u01b0\u1eddng \u0110\u1ea1i h\u1ecdc Kinh t\u1ebf \u2013 T\u00e0i ch\u00ednh TP.HCM (UEF). \u1ea2nh t\u01b0 li\u1ec7u ho\u1ea1t \u0111\u1ed9ng c\u1ee7a \u0111\u01a1n v\u1ecb ngu\u1ed3n, kh\u00f4ng ph\u1ea3i c\u1ee7a fanpage.","content":"Chuy\u1ebfn xe tr\u1edf v\u1ec1 th\u01b0\u1eddng mang m\u1ed9t nh\u1ecbp kh\u00e1c l\u00fac kh\u1edfi h\u00e0nh. Nh\u1eefng c\u00e2u chuy\u1ec7n trong ng\u00e0y l\u1eafng xu\u1ed1ng, \u0111\u1ed3 \u0111\u1ea1c \u0111\u01b0\u1ee3c \u0111\u1eb7t g\u1ecdn, m\u1ed7i ng\u01b0\u1eddi d\u1ea7n tr\u1edf l\u1ea1i v\u1edbi l\u1ecbch h\u1ecdc v\u00e0 c\u00f4ng vi\u1ec7c c\u1ee7a m\u00ecnh.\n\nNh\u01b0ng m\u1ed9t ho\u1ea1t \u0111\u1ed9ng kh\u00f4ng h\u1eb3n k\u1ebft th\u00fac khi xe d\u1eebng. C\u00f3 th\u1ec3 c\u00f2n ph\u1ea7n \u0111\u1ed3 c\u1ea7n b\u00e0n giao, th\u00f4ng tin c\u1ea7n x\u00e1c nh\u1eadn, m\u1ed9t cu\u1ed9c g\u1ecdi \u0111\u00e3 h\u1eb9n s\u1ebd tr\u1ea3 l\u1eddi. Nh\u1eefng vi\u1ec7c \u1ea5y \u00edt c\u1ea3m x\u00fac h\u01a1n ph\u00fat g\u1eb7p g\u1ee1, nh\u01b0ng l\u1ea1i n\u00f3i nhi\u1ec1u v\u1ec1 c\u00e1ch m\u00ecnh hi\u1ec3u s\u1ef1 \u0111\u1ed3ng h\u00e0nh.\n\n## \u0110\u1eebng \u0111\u1ec3 ng\u01b0\u1eddi \u1edf l\u1ea1i ph\u1ea3i \u0111o\u00e1n\n\nN\u1ebfu nh\u00f3m \u0111\u00e3 nh\u1eadn m\u1ed9t vi\u1ec7c, n\u01a1i ti\u1ebfp nh\u1eadn c\u1ea7n bi\u1ebft n\u00f3 \u0111\u00e3 \u0111\u1ebfn \u0111\u00e2u. Xong th\u00ec b\u00e1o xong. Ch\u01b0a l\u00e0m \u0111\u01b0\u1ee3c th\u00ec n\u00f3i r\u00f5. M\u1ed9t l\u1eddi c\u1eadp nh\u1eadt \u0111\u01a1n gi\u1ea3n gi\u00fap ng\u01b0\u1eddi kh\u00e1c kh\u00f4ng ph\u1ea3i ch\u1edd \u0111i\u1ec1u m\u00ecnh \u0111\u00e3 qu\u00ean.\n\nKhi c\u00f3 \u0111\u00f3ng g\u00f3p, vi\u1ec7c ghi ch\u00e9p v\u00e0 \u0111\u1ed1i chi\u1ebfu c\u1ea7n \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n theo \u0111\u00fang c\u00e1ch \u0111\u00e3 th\u1ed1ng nh\u1ea5t. Kh\u00f4ng d\u00f9ng s\u1ef1 x\u00fac \u0111\u1ed9ng c\u1ee7a chuy\u1ebfn \u0111i \u0111\u1ec3 thay cho th\u00f4ng tin r\u00f5 r\u00e0ng. Minh b\u1ea1ch kh\u00f4ng l\u00e0m t\u00ecnh c\u1ea3m l\u1ea1nh \u0111i; n\u00f3 gi\u00fap ni\u1ec1m tin c\u00f3 ch\u1ed7 \u0111\u1ee9ng v\u1eefng h\u01a1n.\n\n\u0110\u00f4i khi \u0111i\u1ec1u t\u1eed t\u1ebf nh\u1ea5t sau m\u1ed9t ch\u01b0\u01a1ng tr\u00ecnh l\u00e0 ng\u1ed3i l\u1ea1i th\u00eam m\u1ed9t bu\u1ed5i, l\u00e0m n\u1ed1t nh\u1eefng vi\u1ec7c ch\u1eb3ng c\u00f2n ai mu\u1ed1n ch\u1ee5p \u1ea3nh.\n\n## \u0110i\u1ec1u g\u00ec th\u1eadt s\u1ef1 c\u00f3 \u00edch?\n\nM\u1ed9t cu\u1ed9c nh\u00ecn l\u1ea1i n\u00ean c\u00f3 ch\u1ed7 cho c\u1ea3 \u0111i\u1ec1u ch\u01b0a t\u1ed1t. Nh\u00f3m c\u00f3 \u0111\u1ebfn qu\u00e1 \u0111\u00f4ng kh\u00f4ng? C\u00f3 ph\u1ea7n vi\u1ec7c n\u00e0o t\u1ea1o th\u00eam g\u00e1nh n\u1eb7ng cho ng\u01b0\u1eddi ph\u1ee5 tr\u00e1ch? C\u00f3 th\u1ee9 m\u00ecnh t\u01b0\u1edfng c\u1ea7n nh\u01b0ng h\u00f3a ra ch\u01b0a ph\u00f9 h\u1ee3p?\n\nH\u1ecfi nh\u1eefng c\u00e2u \u1ea5y kh\u00f4ng ph\u1ea3i \u0111\u1ec3 ph\u1ee7 nh\u1eadn c\u00f4ng s\u1ee9c. \u0110\u00f3 l\u00e0 c\u00e1ch t\u00f4n tr\u1ecdng ng\u01b0\u1eddi \u0111\u01b0\u1ee3c h\u1ed7 tr\u1ee3 v\u00e0 c\u1ea3 ng\u01b0\u1eddi \u0111\u00e3 \u0111\u00f3ng g\u00f3p. L\u1ea7n sau t\u1ed1t h\u01a1n kh\u00f4ng nh\u1ea5t thi\u1ebft l\u00e0 quy m\u00f4 l\u1edbn h\u01a1n; c\u00f3 khi l\u00e0 g\u1ecdn h\u01a1n, \u0111\u00fang nhu c\u1ea7u h\u01a1n, \u00edt l\u00e0m x\u00e1o tr\u1ed9n h\u01a1n.\n\nC\u0169ng n\u00ean h\u1ecfi c\u00e1c th\u00e0nh vi\u00ean c\u00f3 m\u1ec7t qu\u00e1 kh\u00f4ng. M\u1ed9t h\u00e0nh tr\u00ecnh b\u1ec1n kh\u00f4ng \u0111\u01b0\u1ee3c x\u00e2y b\u1eb1ng vi\u1ec7c v\u00e0i ng\u01b0\u1eddi lu\u00f4n ph\u1ea3i g\u1ed3ng l\u00ean thay c\u1ea3 nh\u00f3m.\n\n## Gi\u1eef l\u1ea1i m\u1ed9t vi\u1ec7c nh\u1ecf sau c\u1ea3m x\u00fac l\u1edbn\n\nKh\u00f4ng ph\u1ea3i ai c\u0169ng c\u00f3 th\u1ec3 quay l\u1ea1i th\u01b0\u1eddng xuy\u00ean. Nh\u01b0ng sau chuy\u1ebfn \u0111i, m\u00ecnh c\u00f3 th\u1ec3 gi\u1eef m\u1ed9t th\u00f3i quen: tr\u1ea3 l\u1eddi l\u1eddi nh\u1eafn \u0111\u00e3 nh\u1eadn, gi\u1eef \u0111\u00fang vi\u1ec7c \u0111\u00e3 h\u1ee9a, h\u1ecfi tr\u01b0\u1edbc khi quy\u1ebft \u0111\u1ecbnh thay ng\u01b0\u1eddi kh\u00e1c.\n\n\u0110\u00f3 l\u00e0 c\u00e1ch thi\u1ec7n nguy\u1ec7n b\u01b0\u1edbc ra kh\u1ecfi ng\u00e0y c\u00f3 l\u1ecbch tr\u00ecnh, tr\u1edf th\u00e0nh m\u1ed9t ph\u1ea7n trong c\u00e1ch s\u1ed1ng. Ng\u01b0\u1eddi t\u1eed t\u1ebf kh\u00f4ng ch\u1ec9 c\u00f3 m\u1eb7t trong m\u1ed9t chi\u1ebfc \u00e1o \u0111\u1ed3ng ph\u1ee5c. S\u1ef1 t\u1eed t\u1ebf c\u0169ng n\u1eb1m \u1edf c\u00e1ch m\u00ecnh l\u00e0m vi\u1ec7c, \u0111\u1ed1i tho\u1ea1i v\u00e0 ch\u1ecbu tr\u00e1ch nhi\u1ec7m m\u1ed7i ng\u00e0y.\n\n> M\u1ed9t chuy\u1ebfn \u0111i k\u1ebft th\u00fac \u1edf b\u1ebfn xe. S\u1ef1 c\u00f3 tr\u00e1ch nhi\u1ec7m k\u1ebft th\u00fac khi nh\u1eefng vi\u1ec7c \u0111\u00e3 nh\u1eadn \u0111\u01b0\u1ee3c l\u00e0m \u0111\u1ebfn n\u01a1i.\n\nMong khi chuy\u1ebfn xe \u0111\u00e3 v\u1ec1, th\u1ee9 c\u00f2n \u1edf l\u1ea1i kh\u00f4ng ch\u1ec9 l\u00e0 m\u1ed9t album. C\u00f2n l\u00e0 m\u1ed9t m\u1ed1i li\u00ean h\u1ec7 \u0111\u01b0\u1ee3c gi\u1eef c\u1ea9n th\u1eadn, m\u1ed9t vi\u1ec7c \u0111\u01b0\u1ee3c ho\u00e0n t\u1ea5t, v\u00e0 m\u1ed9t ch\u00fat tin t\u01b0\u1edfng \u0111\u1ec3 l\u1ea7n sau ng\u01b0\u1eddi ta v\u1eabn y\u00ean t\u00e2m m\u1edf c\u1eeda \u0111\u00f3n nhau.","tags":["Logistics","T\u1ed5 ch\u1ee9c","Nh\u00f3m tr\u01b0\u1edfng","T\u1ea3n v\u0103n bi\u00ean so\u1ea1n"],"gallery":[],"status":"published","featured":false,"is_starter":true,"rights_confirmed":false,"created_at":"2026-11-21T09:00:00+07:00","updated_at":"2026-11-21T21:00:00+07:00","published_at":"2026-11-21T09:00:00+07:00","revision":1,"reading_minutes":3}],"research":{"checked":"21/11/2026","sources":{"sos":{"title":"SOS Vi\u1ec7t Nam \u2014 danh b\u1ea1 c\u00e1c l\u00e0ng","url":"https://sosvietnam.org/tre-em-sos-children","note":"\u0110\u1ecba ch\u1ec9 G\u00f2 V\u1ea5p, \u0111i\u1ec7n tho\u1ea1i v\u00e0 email \u0111\u01b0\u1ee3c c\u00f4ng b\u1ed1 trong danh b\u1ea1; t\u00ean \u0111\u01a1n v\u1ecb h\u00e0nh ch\u00ednh theo ngu\u1ed3n c\u0169."},"govap":{"title":"B\u1ec7nh vi\u1ec7n Y h\u1ecdc c\u1ed5 truy\u1ec1n TP.HCM \u2014 ho\u1ea1t \u0111\u1ed9ng t\u1ea1i G\u00f2 V\u1ea5p, 13/10/2025","url":"https://www.yhct.vn/tin-tuc/hoat-dong/benh-vien   created_at timestamptz NOT NULL DEFAULT now()

    WHERE singleton = true AND user_id = (SELECT auth.uid())

$$;

CREATE TABLE IF NOT EXISTS public.vmblog_posts (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  slug text NOT NULL UNIQUE CHECK (slug ~ '^[a-z0-9]+(-[a-z0-9]+)*$' AND length(slug) <= 150),
  title text NOT NULL CHECK (length(trim(title)) BETWEEN 1 AND 180),
  excerpt text NOT NULL DEFAULT '' CHECK (length(excerpt) <= 360),
  content text NOT NULL CHECK (length(trim(content)) BETWEEN 1 AND 80000),
  category text NOT NULL DEFAULT 'Câu chuyện tử tế'
    CHECK (category IN ('Câu chuyện tử tế','Vì trẻ em','Bên ông bà','Góc sẻ chia','Sinh viên thiện nguyện','Bệnh nhi ung thư','Mái ấm & địa chỉ','Dữ liệu Việt Nam')),
  author text NOT NULL DEFAULT 'Vì mình và bạn' CHECK (length(trim(author)) BETWEEN 1 AND 80),
  cover_image text NOT NULL DEFAULT '' CHECK (octet_length(cover_image) <= 800000),
  image_caption text NOT NULL DEFAULT '' CHECK (length(image_caption) <= 500),
  gallery jsonb NOT NULL DEFAULT '[]'::jsonb
    CHECK (jsonb_typeof(gallery) = 'array' AND jsonb_array_length(gallery) <= 6 AND octet_length(gallery::text) <= 5000000),
  tags text[] NOT NULL DEFAULT '{}'::text[] CHECK (cardinality(tags) <= 8),
  status text NOT NULL DEFAULT 'draft' CHECK (status IN ('draft', 'published')),
  featured boolean NOT NULL DEFAULT false,
  is_starter boolean NOT NULL DEFAULT false,
  rights_confirmed boolean NOT NULL DEFAULT false,
  reading_minutes integer NOT NULL DEFAULT 1 CHECK (reading_minutes BETWEEN 1 AND 999),
  revision bigint NOT NULL DEFAULT 1 CHECK (revision > 0),
  created_at timestamptz NOT NULL DEFAULT now(),
  updated_at timestamptz NOT NULL DEFAULT now(),
  published_at timestamptz,
  CHECK (status <> 'published' OR rights_confirmed = true)
);
CREATE INDEX IF NOT EXISTS vmblog_posts_public_date
  ON public.vmblog_posts (status, published_at DESC, created_at DESC);
CREATE INDEX IF NOT EXISTS vmblog_posts_category
  ON public.vmblog_posts (category, status);

CREATE OR REPLACE FUNCTION public.vmblog_stamp_post()
RETURNS trigger LANGUAGE plpgsql SET search_path = ''
AS $$
BEGIN
  NEW.title := trim(NEW.title);
  NEW.author := trim(NEW.author);
  IF TG_OP = 'INSERT' THEN
    NEW.created_at := now();
    NEW.revision := 1;
    NEW.published_at := CASE WHEN NEW.status = 'published' THEN now() ELSE NULL END;
  ELSE
    NEW.created_at := OLD.created_at;
    NEW.revision := OLD.revision + 1;
    NEW.published_at := COALESCE(OLD.published_at, CASE WHEN NEW.status = 'published' THEN now() ELSE NULL END);
  END IF;
  NEW.updated_at := now();
  NEW.reading_minutes := greatest(1, ceil(array_length(regexp_split_to_array(trim(NEW.content), E'\\s+'), 1) / 230.0)::integer);
  RETURN NEW;
END;
$$;
REVOKE ALL ON FUNCTION public.vmblog_stamp_post() FROM PUBLIC;
DROP TRIGGER IF EXISTS vmblog_post_stamp ON public.vmblog_posts;
CREATE TRIGGER vmblog_post_stamp BEFORE INSERT OR UPDATE ON public.vmblog_posts
FOR EACH ROW EXECUTE FUNCTION public.vmblog_stamp_post();

function setHero(index, animate=true, announce=true){

 HERO.animation?.cancel();clearTimeout(HERO.finishTimer);$('.opening-flight',root)?.remove();
 const sr=selected.getBoundingClientRect(),hr=root.getBoundingClientRect();
 const reduced=motionReduced();const canAnimate=animate&&!reduced&&typeof root.animate==='function';
 HERO.index=next;V6Motion.elapsed=0;
 const oldTitle=$('#opening-copy');oldTitle.innerHTML=heroCopy(s);
 $('#opening-source').textContent=s.source;$('#opening-counter').textContent=String(next+1).padStart(2,'0');
 $('#opening-meter-fill').style.width=((next+1)/n*100)+'%';
 $('.opening-panel-label>span:last-child').textContent=String(next+1).padStart(2,'0')+' — 04';
 $$('[data-hero-index]',root).forEach((b,i)=>{b.classList.toggle('selected',i===next);b.setAttribute('aria-pressed',String(i===next));});
 if(announce)$('#opening-announcement').textContent=`Chủ đề ${next+1} trên ${n}: ${s.plain}`;
 const backdrop=$('.opening-backdrop',root);

 if(canAnimate){
  const fly=document.createElement('div');fly.className='opening-flight';fly.setAttribute('aria-hidden','true');fly.innerHTML=img(s.photo,'','',true);root.appendChild(fly);
  // FLIP: the geometry is measured once; frames change transform/opacity only.
  const sx=Math.max(.08,sr.width/hr.width),sy=Math.max(.08,sr.height/hr.height);
  const anim=fly.animate([
   {transform:`translate3d(${sr.left-hr.left}px,${sr.top-hr.top}px,0) scale(${sx},${sy})`,opacity:.78},
   {transform:'translate3d(0,0,0) scale(1,1)',opacity:1}
  ],{duration:1050,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});

  anim.oncancel=()=>fly.remove();

 }else finish();

 });

function inline(text){function simple(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}let out='',last=0;for(const m of String(text).matchAll(/\[([^\]\n]+)\]\(([^\s)]+)\)/g)){out+=simple(text.slice(last,m.index));const url=safeURL(m[2]);out+=url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${simple(m[1])}</a>`:simple(m[0]);last=m.index+m[0].length;}return out+simple(String(text).slice(last));}
function markdown(content){const lines=String(content||'').replace(/\r/g,'').split('\n');let html='',paragraph=[],list=[],listType='',quote=[],toc=[],n=0;function flushP(){if(paragraph.length){html+='<p>'+paragraph.map(inline).join('<br>')+'</p>';paragraph=[];}}function flushL(){if(list.length){html+=`<${listType}>`+list.map(x=>'<li>'+inline(x)+'</li>').join('')+`</${listType}>`;list=[];}}function flushQ(){if(quote.length){html+='<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>';quote=[];}}for(const line of lines){if(!line.trim()){flushP();flushL();flushQ();continue;}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){flushP();flushL();flushQ();const level=h[1].length<=2?2:3;const id='sec-'+(++n);html+=`<h${level} id="${id}">${inline(h[2])}</h${level}>`;toc.push({id,level,text:h[2].replace(/\*/g,'')});continue;}if(/^>\s?/.test(line)){flushP();flushL();quote.push(line.replace(/^>\s?/,''));continue;}const ul=line.match(/^[-*]\s+(.+)$/),ol=line.match(/^\d+[.)]\s+(.+)$/);if(ul||ol){flushP();flushQ();const type=ul?'ul':'ol';if(list.length&&listType!==type)flushL();listType=type;list.push((ul||ol)[1]);continue;}flushL();flushQ();paragraph.push(line);}flushP();flushL();flushQ();return {html,toc};}
function observe(){initInteractions();if(!window.IntersectionObserver)return;const reduce=motionReduced();if(reduce)return;document.body.classList.add('js-motion');$$('.reveal:not([data-observed])').forEach(el=>{el.dataset.observed='1';el.classList.add('ready');revealObserver.observe(el);});}
const revealObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');revealObserver.unobserve(e.target);}}),{threshold:.09,rootMargin:'0px 0px 20px 0px'}):null;
function goSection(id){if(!id){scrollTo({top:0,behavior:motionReduced()?'auto':'smooth'});return;}const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:motionReduced()?'auto':'smooth',block:'start'});}
function validateConfig(url,key,email){url=url.trim().replace(/\/$/,'');key=key.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url))throw new Error('Project URL phải có dạng https://ten-du-an.supabase.co.');if(key.startsWith('sb_secret_'))throw new Error('Không được dùng secret key trong website công khai.');if(key.startsWith('eyJ')){try{const part=key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const payload=JSON.parse(atob(part));if(payload.role!=='anon')throw new Error();}catch{throw new Error('Chỉ dùng anon key có role anon, không dùng service_role.');}}else if(!/^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(key))throw new Error('Nhập publishable key (sb_publishable_…) hoặc anon key hợp lệ.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Email của tài khoản Admin chưa hợp lệ.');return {url,key,adminEmail:email.trim()};}
function showSetup(){modal('Thiết lập đăng bài trên Internet',`<p>GitHub Pages hiển thị website. Supabase giữ bài viết và xác thực một tài khoản Admin. Không đặt mật khẩu hoặc secret key trong mã nguồn.</p><ol class="setup-steps"><li><strong>Tạo dự án Supabase</strong>Vào supabase.com, tạo dự án của bạn. Mở SQL Editor và chạy tệp khởi tạo bên dưới. Các bảng mới đều có tiền tố <code>vmblog_</code>, không xóa dữ liệu của website cũ.<br><button class="btn btn-small" data-action="download-sql" style="margin-top:10px">Tải mã SQL khởi tạo</button></li><li><strong>Tạo đúng một người dùng quản trị</strong>Trong Authentication → Users, tạo người dùng bằng email quản trị; đặt mật khẩu bạn đã chọn và xác nhận email. Sao chép User UID. Tắt đăng ký người dùng mới (Allow new users to sign up), đăng nhập ẩn danh và các nhà cung cấp đăng nhập không dùng.</li><li><strong>Cấp quyền tại cơ sở dữ liệu</strong>Thay <code>USER_UID_CUA_ADMIN</code> bằng UID vừa sao chép, rồi chạy trong SQL Editor:<pre class="codeblock">insert into public.vmblog_admin (singleton, user_id)\nvalues (true, 'USER_UID_CUA_ADMIN'::uuid)\non conflict (singleton) do nothing;</pre>Bảng singleton chỉ cho phép một Admin. Nếu đã có Admin khác, dùng tệp cấp quyền V13 để kiểm tra; không tự thay người quản trị. Khách chỉ đọc được bài đã công khai.</li><li><strong>Kết nối và xuất index.html</strong>Nhập Project URL, publishable key và email tài khoản vừa tạo. Nút dưới kiểm tra kết nối rồi xuất bản HTML đã cấu hình. Đưa bản này lên GitHub Pages; không đưa mật khẩu lên GitHub.</li></ol><form id="setup-form"><div class="field-row"><label class="field"><span>Project URL</span><input name="url" type="url" required placeholder="https://ten-du-an.supabase.co" value="${esc(CONFIG.url)}"></label><label class="field"><span>Email phía máy chủ của Admin</span><input name="email" type="email" required value="${esc(CONFIG.adminEmail||EMAIL)}"></label></div><label class="field"><span>Publishable key hoặc anon key</span><input name="key" autocomplete="off" required placeholder="sb_publishable_…" value="${esc(CONFIG.key)}"><small>Khóa công khai hoạt động cùng RLS. Không nhập service_role, secret key hay mật khẩu database.</small></label><fieldset class="editor-panel" style="margin:20px 0"><legend>Tiếp nhận tình nguyện viên</legend><label class="check-label"><input type="checkbox" name="volunteerEnabled" ${CONFIG.volunteerEnabled?'checked':''}><span>Bật biểu mẫu trực tuyến (sau khi cài SQL và Edge Function V12)</span></label><label class="field"><span>Turnstile site key công khai</span><input name="turnstileSiteKey" autocomplete="off" value="${esc(CONFIG.turnstileSiteKey||'')}" placeholder="0x4AAAA..."><small>Chỉ site key. Secret key phải lưu trong Supabase Edge Secrets, không điền ở đây.</small></label><p class="small">Xem <code>README.md</code> V12 để cài <code>volunteer-signup</code>. Kiểm tra bên dưới chỉ xác nhận kết nối bài viết; cần gửi thử trên trang HTTPS sau khi triển khai.</p></fieldset><div class="form-error" id="setup-error" role="alert"></div><button type="submit" class="btn btn-red">${icon('download')}Kiểm tra & xuất index.html</button></form><p class="small" style="margin-top:18px">Đây là cấu hình cho bản tải xuống, không thay đổi website đang hoạt động hay tài khoản máy chủ của bạn. Trên màn hình đăng nhập, tên tài khoản vẫn là <strong>Admin</strong>.</p>`,true);}
async function setup(form){setBusy(form,true);$('#setup-error').textContent='';try{const f=new FormData(form);const c=validateConfig(f.get('url'),f.get('key'),f.get('email'));c.volunteerEnabled=f.has('volunteerEnabled');c.turnstileSiteKey=String(f.get('turnstileSiteKey')||'').trim();if(c.turnstileSiteKey&&!/^[A-Za-z0-9_-]{10,100}$/.test(c.turnstileSiteKey))throw new Error('Site key không hợp lệ.');if(c.volunteerEnabled&&!c.turnstileSiteKey)throw new Error('Cần Turnstile site key để bật tiếp nhận.');await rawRequest('/rest/v1/vmblog_posts?select=id&limit=1',{config:c});const safeJSON=JSON.stringify(c).replace(/</g,'\\u003c');const html=ORIGINAL_HTML.replace(/(<script id="site-config" type="application\/json">)[\s\S]*?(<\/script>)/,'$1'+safeJSON+'$2');download('index.html',html,'text/html;charset=utf-8');toast('Đã kiểm tra kết nối và xuất index.html. Hãy tải bản này lên GitHub Pages.');}catch(e){$('#setup-error').textContent=errorMessage(e);}finally{setBusy(form,false);}}
function showPrivacy(){modal('Sự riêng tư luôn đáng quý',`<h3>Đọc mà không cần tài khoản</h3><p>Khách có thể xem nội dung công khai mà không đăng ký. Website không cài công cụ phân tích hoặc theo dõi quảng cáo riêng. GitHub Pages, nhà cung cấp dữ liệu, ảnh và font có thể xử lý thông tin kỹ thuật khi trình duyệt tải tài nguyên.</p><h3>Tùy chọn chuyển động</h3><p>Website lưu lựa chọn bật/tắt hiệu ứng trong trình duyệt của bạn. Tùy chọn này không chứa tài khoản hoặc mật khẩu.</p><h3>Đối với thông tin trong bài viết</h3><p>Không công khai giấy tờ, bệnh án, địa chỉ riêng hay thông tin nhạy cảm khi chưa có sự đồng ý phù hợp. Khi cần phản ánh hoặc đề nghị xem lại nội dung, hãy gửi lời nhắn qua fanpage hoặc email ${esc(EMAIL)}.</p><h3>Ảnh minh họa</h3><p>Ảnh tư liệu ban đầu có ghi nguồn và không được hiểu là nhân vật, thành viên hay hoạt động của trang. Người đăng chịu trách nhiệm về nội dung và quyền sử dụng các ảnh được cập nhật.</p><h3>Quản trị website</h3><p>Mật khẩu được xác thực tại Supabase, không lưu trong HTML. Phiên Admin chỉ được giữ trong bộ nhớ của trang hiện tại; tải lại trang sẽ cần đăng nhập lại. Khách không thể đăng ký tài khoản quản trị.</p>${volPrivacy()}`,true);}

function renderAdminList(){const rows=S.adminPosts.filter(p=>(S.adminFilter==='all'||p.status===S.adminFilter)&&norm(p.title+' '+p.category).includes(norm(S.adminSearch)));$('#admin-list').innerHTML=rows.length?rows.map(p=>`<article class="admin-row">${img(p.cover_image,'','admin-thumb')}<div class="admin-row-copy"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${p.status==='published'?'green':'gray'}">${p.status==='published'?'Công khai':'Bản nháp'}</span>${p.featured?'<span class="pill gold">Nổi bật</span>':''}${p.is_starter?'<span class="pill gray">Bài mở đầu</span>':''}</div><h3>${esc(p.title)}</h3><div class="meta"><span>${esc(p.category)}</span><span>·</span><span>Cập nhật ${date(p.updated_at,true)}</span></div></div><div class="row-actions"><button class="btn btn-small" data-action="edit-post" data-id="${p.id}">${icon('edit','icon-sm')}Sửa</button>${p.status==='published'?`<a class="btn btn-small" href="${articleHref(p)}">Xem</a>`:`<button class="btn btn-small" data-action="preview-saved" data-id="${p.id}">Xem nháp</button>`}<button class="btn btn-small btn-danger" data-action="delete-post" data-id="${p.id}" aria-label="Xóa bài ${esc(p.title)}">${icon('trash','icon-sm')}</button></div></article>`).join(''):emptyHTML('Chưa có bài phù hợp','Đổi bộ lọc hoặc bắt đầu một câu chuyện mới.');}
function canDiscard(){if(S.busy){toast('Đang lưu. Vui lòng không rời biểu mẫu.');return false;}if(!S.dirty)return true;if(confirm('Bạn đang có thay đổi chưa lưu. Bỏ thay đổi và tiếp tục?')){S.dirty=false;return true;}return false;}
function newPost(){if(!S.isAdmin)return showLogin();if(!canDiscard())return;const id=crypto.randomUUID();openEditor({id,slug:'',title:'',excerpt:'',content:'',category:CATEGORIES[0],author:'Vì mình và bạn',cover_image:'',image_caption:'',tags:[],gallery:[],status:'draft',featured:false,is_starter:false,rights_confirmed:false,exists:false});}
function openEditor(p){if(!S.isAdmin)return;destroyChapterReader11();S.editor={...copy(p),exists:p.exists===false?false:true};S.dirty=false;const x=S.editor;$('#main').innerHTML=`<section class="admin-page"><div class="wrap"><div class="editor-top"><div><button class="btn btn-small btn-quiet" data-action="back-admin">← Danh sách bài viết</button><h2 style="margin-top:14px">${x.exists?'Chỉnh sửa câu chuyện':'Viết một câu chuyện mới'}</h2></div><span class="save-status" id="save-status">${x.exists?'Cập nhật gần nhất: '+date(x.updated_at,true):'Chưa lưu lên máy chủ'}</span></div><form id="post-form"><div class="editor-grid"><div><div class="editor-panel"><label class="field"><span>Tiêu đề bài viết *</span><input class="editor-title" name="title" required maxlength="180" placeholder="Bắt đầu bằng một điều muốn kể…" value="${esc(x.title)}"></label><label class="field"><span>Đoạn giới thiệu ngắn *</span><textarea name="excerpt" rows="3" required maxlength="360" placeholder="Một vài dòng mời người đọc bước vào câu chuyện.">${esc(x.excerpt)}</textarea><small>Hiển thị trên thẻ bài viết và phần mở đầu trang đọc. Tối đa 360 ký tự.</small></label><label class="field"><span>Nội dung *</span><div class="format-toolbar" aria-label="Định dạng nội dung"><button type="button" data-action="format" data-format="h2">Tiêu đề H2</button><button type="button" data-action="format" data-format="h3">H3</button><button type="button" data-action="format" data-format="bold"><strong>B</strong></button><button type="button" data-action="format" data-format="quote">Trích dẫn</button><button type="button" data-action="format" data-format="list">Danh sách</button><button type="button" data-action="format" data-format="link">Liên kết</button></div><textarea id="post-content" class="editor-content" name="content" required maxlength="80000" placeholder="Viết bằng sự chân thành. Dùng ## cho tiêu đề, **chữ đậm** và > cho một câu trích dẫn.">${esc(x.content)}</textarea><small>Nội dung dạng văn bản/Markdown  type="submit" class="btn btn-red wide-button">${icon('check')}Lưu bài viết</button><p class="editor-help">Bản nháp được bảo vệ tại cơ sở dữ liệu. Mật khẩu không nằm trong mã nguồn. Nội dung chưa lưu chỉ ở trang đang mở; hãy lưu nháp trước khi đóng tab.</p></div><div class="editor-panel"><h3>Ảnh đại diện bài viết</h3><label class="upload-area" for="cover-upload"><img id="cover-preview" src="${esc(safeURL(x.cover_image,true)||DATA.logo)}" alt="Xem trước ảnh bìa"><span>Chọn ảnh từ máy</span><input id="cover-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field" style="margin-top:15px"><span>Hoặc liên kết ảnh HTTPS</span><input id="cover-url" type="url" placeholder="https://…" value="${x.cover_image?.startsWith('https:')?esc(x.cover_image):''}"><small>Ảnh từ liên kết phụ thuộc máy chủ bên ngoài. Nên tải ảnh của bạn từ thiết bị để lưu cùng bài.</small></label><button type="button" class="btn btn-small btn-quiet" data-action="clear-cover">Bỏ ảnh hiện tại</button><label class="field" style="margin-top:15px"><span>Chú thích / nguồn ảnh</span><textarea name="image_caption" rows="3" maxlength="500" placeholder="Ví dụ: Ảnh của trang, sử dụng với sự đồng ý của người trong ảnh.">${esc(x.image_caption)}</textarea></label></div><div class="editor-panel"><label class="field"><span>Thẻ chủ đề</span><input name="tags" maxlength="240" placeholder="Yêu thương, Sẻ chia, Tình người" value="${esc((x.tags||[]).join(', '))}"><small>Ngăn cách bằng dấu phẩy; tối đa 8 thẻ.</small></label>${x.exists?`<p class="editor-help">Tạo: ${date(x.created_at,true)}<br>Cập nhật: ${date(x.updated_at,true)}<br>Đường dẫn bài không đổi khi sửa tiêu đề.</p>`:''}</div></aside></div></form></div></section>`;renderEditorGallery();scrollTo({top:0,behavior:'instant'});}
function editorData(){const f=$('#post-form');const fd=new FormData(f);return {title:String(fd.get('title')||'').trim(),excerpt:String(fd.get('excerpt')||'').trim(),content:String(fd.get('content')||'').trim(),category:fd.get('category'),author:String(fd.get('author')||'').trim(),cover_image:S.editor.cover_image||'',image_caption:String(fd.get('image_caption')||'').trim(),gallery:copy(S.editor.gallery||[]),tags:[...new Set(String(fd.get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean))].slice(0,8),status:fd.get('status'),featured:fd.has('featured'),is_starter:fd.has('is_starter'),rights_confirmed:fd.has('rights_confirmed')};}
function markDirty(){S.dirty=true;if($('#save-status'))$('#save-status').textContent='Có thay đổi chưa lưu';}
function slugify(t){return norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90)||'cau-chuyen';}
async function savePost(form){if(!S.isAdmin)throw new Error('Cần đăng nhập Admin.');if(S.busy)return;$('#post-error').textContent='';const p=editorData();const chapterError=validateChapterGallery11(p);if(chapterError){$('#post-error').textContent=chapterError;return;}if(!p.title||!p.excerpt||!p.content){$('#post-error').textContent='Nhập tiêu đề, đoạn giới thiệu và nội dung trước khi lưu.';return;}if(p.status==='published'&&!p.rights_confirmed){$('#post-error').textContent='Vui lòng xác nhận đã rà soát nội dung và quyền sử dụng ảnh trước khi công khai.';return;}if(p.cover_image&&!p.image_caption){$('#post-error').textContent='Hãy thêm chú thích hoặc nguồn cho ảnh đại diện bài viết.';return;}if(p.cover_image&&!safeURL(p.cover_image,true)){ $('#post-error').textContent='Liên kết ảnh chưa hợp lệ. Chỉ dùng HTTPS hoặc tải ảnh từ máy.';return;}if(p.gallery.some(g=>!String(g.caption||'').trim())){$('#post-error').textContent='Hãy bổ sung chú thích hoặc nguồn cho từng ảnh trong bài.';return;}if(JSON.stringify(p.gallery).length>5000000){$('#post-error').textContent='Bộ ảnh quá lớn. Hãy giảm số lượng hoặc kích thước ảnh.';return;}S.busy=true;setBusy(form,true);try{const ed=S.editor;const payload={...p,slug:ed.slug||slugify(p.title)+'-'+ed.id.slice(0,8)};let rows;if(ed.exists)rows=await api('/rest/v1/vmblog_posts?id=eq.'+ed.id+'&revision=eq.'+ed.revision,{auth:true,method:'PATCH',body:payload,headers:{Prefer:'return=representation'}});else rows=await api('/rest/v1/vmblog_posts',{auth:true,method:'POST',body:{id:ed.id,...payload},headers:{Prefer:'return=representation'}});if(!rows?.length)throw new Error('Bài viết đã thay đổi ở phiên khác. Nội dung đang soạn vẫn còn; sao chép lại rồi tải bản mới trước khi lưu.');S.dirty=false;S.editor=null;await loadPublic();await renderAdmin();toast(p.status==='published'?'Đã lưu và công khai bài viết. Khách truy cập có thể đọc trên website.':'Đã lưu bản nháp. Chỉ Admin được xem.');}catch(e){$('#post-error').textContent=errorMessage(e);}finally{S.busy=false;setBusy(form,false);}}

async function optimizeImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Chỉ nhận ảnh JPG, PNG hoặc WebP.');if(file.size>15*1024*1024)throw new Error('Ảnh gốc quá lớn; hãy chọn ảnh dưới 15 MB.');const u=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Không đọc được tệp ảnh. Vui lòng chọn lại.'));reader.readAsDataURL(file);});try{const pic=new Image();pic.src=u;await pic.decode();if(!pic.naturalWidth||pic.naturalWidth*pic.naturalHeight>80000000)throw new Error('Ảnh có độ phân giải quá lớn hoặc không đọc được.');const ratio=Math.min(1,1600/pic.naturalWidth,1600/pic.naturalHeight);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(pic.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(pic.naturalHeight*ratio));const c=canvas.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,canvas.width,canvas.height);c.drawImage(pic,0,0,canvas.width,canvas.height);let q=.84,uri=canvas.toDataURL('image/jpeg',q);while(uri.length>650000&&q>.45){q-=.08;uri=canvas.toDataURL('image/jpeg',q);}if(uri.length>780000)throw new Error('Ảnh còn quá lớn sau khi nén. Hãy giảm kích thước ảnh trước khi tải.');return uri;}finally{/* Local data URL only; no remote upload before saving. */}}
async function handleCover(input){if(!input.files?.[0])return;input.disabled=true;try{const src=await optimizeImage(input.files[0]);S.editor.cover_image=src;$('#cover-preview').src=src;$('#cover-url').value='';markDirty();toast('Đã thêm ảnh bìa. Ảnh sẽ được lưu khi bạn bấm Lưu bài viết.');}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
async function handleGalleryUpload(input){const files=[...(input.files||[])];if(!files.length)return;const available=6-(S.editor.gallery||[]).length;if(files.length>available){toast('Mỗi bài có tối đa 6 ảnh trong bộ ảnh. Hãy chọn lại số ảnh phù hợp.',true);input.value='';return;}input.disabled=true;try{const images=[];for(const f of files)images.push({src:await optimizeImage(f),caption:''});S.editor.gallery.push(...images);renderEditorGallery();markDirty();toast('Đã thêm ảnh. Nhớ bổ sung chú thích và lưu bài viết.');}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
function formatEditor(type){const t=$('#post-content');const start=t.selectionStart,end=t.selectionEnd,selected=t.value.slice(start,end);let text='';if(type==='bold')text='**'+(selected||'Nội dung nhấn mạnh')+'**';if(type==='h2')text='\n\n## '+(selected||'Tiêu đề nội dung')+'\n\n';if(type==='h3')text='\n\n### '+(selected||'Tiêu đề phụ')+'\n\n';if(type==='quote')text='\n\n> '+(selected||'Một điều muốn gửi gắm')+'\n\n';if(type==='list')text='\n\n- '+(selected||'Ý thứ nhất')+'\n- Ý thứ hai\n\n';if(type==='link')text='['+(selected||'Tên liên kết')+'](https://example.com)';t.setRangeText(text,start,end,'end');t.focus();markDirty();}
function previewEditor(){const x=editorData();const md=markdown(x.content);const el=$('#editor-preview');el.hidden=false;el.className='editor-preview';el.innerHTML=`<div class="eyebrow">Xem trước — chưa phải bài đã công khai</div><h1>${esc(x.title||'Tiêu đề bài viết')}</h1><p class="muted" style="margin-bottom:25px">${esc(x.excerpt)}</p><div class="prose">${md.html}</div>`;el.scrollIntoView({behavior:motionReduced()?'auto':'smooth',block:'start'});}
function previewSaved(id){const p=S.adminPosts.find(x=>x.id===id);if(!p)return;modal('Xem bản nháp — chỉ Admin',`<div class="preview-label">Bài viết này chưa được công khai. Nội dung được tải bằng phiên Admin.</div><h2 style="font-size:28px;margin:20px 0">${esc(p.title)}</h2><p style="margin-bottom:25px">${esc(p.excerpt)}</p><div class="prose">${markdown(p.content).html}</div>`,true);}
async function deletePost(id){if(S.busy||!S.isAdmin)return;const p=S.adminPosts.find(x=>x.id===id);if(!p||!confirm('Xóa vĩnh viễn bài “'+p.title+'”? Thao tác này không thể hoàn tác.'))return;S.busy=true;try{const rows=await api('/rest/v1/vmblog_posts?id=eq.'+id+'&revision=eq.'+p.revision,{auth:true,method:'DELETE',headers:{Prefer:'return=representation'}});if(!rows?.length)throw new Error('Bài đã được sửa hoặc xóa ở phiên khác. Hãy tải lại danh sách.');await loadPublic();await renderAdmin();toast('Đã xóa bài viết.');}finally{S.busy=false;}}
function renderAdminHelp(){$('#admin-content').innerHTML=`<div class="editor-panel"><h3>Quy trình đăng một câu chuyện</h3><ol class="setup-steps"><li><strong>Viết và chuẩn bị ảnh</strong>Tạo bài mới, nhập tiêu đề, giới thiệu, chuyên mục và nội dung. Tải ảnh có quyền sử dụng, thêm chú thích và nguồn.</li><li><strong>Lưu nháp, đọc lại</strong>Bản nháp chỉ Admin được đọc qua API. Dùng Xem trước để rà soát. Tiêu đề mục trong nội dung sẽ tạo mục lục trên trang chi tiết.</li><li><strong>Chọn Công khai rồi lưu</strong>Xác nhận đã rà soát nội dung và ảnh. Thời gian tạo/cập nhật lấy từ máy chủ, hiển thị theo giờ Việt Nam.</li><li><strong>Chia sẻ liên kết bài</strong>Mở bài ngoài trang công khai để sao chép liên kết. Website liên kết tới fanpage, không tự đăng hoặc đồng bộ bài lên Facebook.</li></ol><div class="notice">Nội dung đang soạn chưa lưu sẽ mất khi tải lại trang. Phiên Admin không được lưu trong trình duyệt; đóng hoặc tải lại trang cần đăng nhập lại. Ảnh và nội dung của bản nháp được bảo vệ cùng hàng dữ liệu bằng RLS.</div><div class="form-actions"><button class="btn" data-action="backup">${icon('download')}Sao lưu bài viết & ảnh trang chủ</button><button class="btn" data-action="seed-posts">Thêm bản nháp còn thiếu</button><button class="btn" data-action="setup">Cấu hình kết nối</button></div><p class="editor-help">Bản sao lưu JSON có thể chứa bản nháp và ảnh chưa công khai. Giữ riêng, không đẩy lên kho GitHub công khai. Khi nhập các bài mở đầu, hệ thống chỉ thêm bài chưa trùng ID hoặc đường dẫn bài và không ghi đè bài của bạn.</p><h3 style="margin-top:35px">Giới hạn cần biết</h3><p class="editor-help">Ảnh tải từ thiết bị được nén rồi lưu cùng bài trong cơ sở dữ liệu. Mỗi bài tối đa 6 ảnh nội dung, ngoài ảnh bìa; phù hợp blog gọn, không thay thế kho ảnh lớn. Liên kết dạng #/bai-viet/... chạy trên GitHub Pages, nhưng bản xem trước khi chia sẻ Facebook dùng thông tin chung của website, không bảo đảm ảnh và tiêu đề riêng của từng bài. Để có SEO/preview riêng từng bài cần xuất trang HTML tĩnh hoặc bổ sung máy chủ dựng trang.</p></div>`;}
async function seedPosts(){if(!S.isAdmin||S.busy)return;if(!confirm('Thêm các bài biên soạn còn thiếu dưới dạng BẢN NHÁP? Cần kiểm tra nội dung và quyền sử dụng ảnh trước khi công khai. Không ghi đè bài hiện có.'))return;S.busy=true;try{const ids=new Set(S.adminPosts.map(p=>p.id)),slugs=new Set(S.adminPosts.map(p=>p.slug));const fields=['id','slug','title','excerpt','content','category','author','cover_image','image_caption','tags','gallery','featured','is_starter'];const rows=DATA.posts.filter(p=>!ids.has(p.id)&&!slugs.has(p.slug)).map(p=>{const r={};for(const k of fields)if(p[k]!==undefined)r[k]=p[k];r.status='draft';r.rights_confirmed=false;return r;});if(!rows.length){toast('Các bài đã có; không thêm trùng.');return;}await api('/rest/v1/vmblog_posts',{auth:true,method:'POST',body:rows,headers:{Prefer:'return=minimal'}});await loadPublic();await renderAdmin();toast('Đã thêm '+rows.length+' bản nháp. Chưa công khai và không ghi đè dữ liệu.');}finally{S.busy=false;}}

function renderAppearance(){S.siteDraft={...copy(S.site),hero_image:S.site.hero_image||'',hero_caption:S.site.hero_caption||'',about_image:S.site.about_image||'',about_caption:S.site.about_caption||'',gallery:copy(S.site.gallery||[])};const d=S.siteDraft;$('#admin-content').innerHTML=`<form id="appearance-form"><div class="editor-grid"><div><div class="editor-panel"><h3>Ảnh chính đầu trang</h3><p class="editor-help" style="margin-bottom:18px">Thay ảnh tư liệu bằng hình ảnh của trang mà bạn có quyền công khai. Nên dùng ảnh ngang đủ nét (tỉ lệ khoảng 16:9). Vùng bên trái sẽ có tiêu đề phủ lên; không đặt thông tin quan trọng sát mép.</p><label class="upload-area">${img(d.hero_image||DATA.photos.hero.src,'Xem trước ảnh đầu trang','',false)}<span>Thay ảnh đầu trang</span><input type="file" data-home-upload="hero" accept="image/jpeg,image/png,image/webp"></label><label class="field" style="margin-top:15px"><span>Chú thích ảnh đầu trang</span><input name="hero_caption" maxlength="500" value="${esc(d.hero_caption)}" placeholder="Nguồn ảnh, bối cảnh và thông tin cần làm rõ"></label><button type="button" class="btn btn-small" data-action="reset-home-image" data-value="hero">Dùng ảnh tư liệu ban đầu</button></div><div class="editor-panel" style="margin-top:22px"><h3>Ảnh giới thiệu tại tab Đồng hành</h3><label class="upload-area">${img(d.about_image||DATA.photos.departure.src,'Xem trước ảnh giới thiệu')}<span>Thay ảnh giới thiệu</span><input type="file" data-home-upload="about" accept="image/jpeg,image/png,image/webp"></label><label class="field" style="margin-top:15px"><span>Chú thích ảnh giới thiệu</span><input name="about_caption" maxlength="500" value="${esc(d.about_caption)}"></label><button type="button" class="btn btn-small" data-action="reset-home-image" data-value="about">Dùng ảnh tư liệu ban đầu</button></div></div><aside class="editor-sidebar"><div class="editor-panel"><h3>Thư viện ảnh</h3><p class="editor-help">Tối đa 40 ảnh. Khi có ảnh riêng, bộ ảnh này thay bộ ảnh function renderHomeGallery(){$('#home-gallery').innerHTML=(S.siteDraft.gallery||[]).map((g,i)=>`<figure>${img(g.src,g.caption||'Ảnh '+(i+1))}<input data-home-caption="${i}" value="${esc(g.caption||'')}" maxlength="500" placeholder="Chú thích / nguồn" aria-label="Chú thích ảnh ${i+1}"><button type="button" data-action="remove-home-gallery" data-index="${i}">Bỏ ảnh</button></figure>`).join('');}
async function homeUpload(input){if(!input.files?.[0])return;input.disabled=true;try{const key=input.dataset.homeUpload;const src=await optimizeImage(input.files[0]);S.siteDraft[key+'_image']=src;input.closest('.upload-area').querySelector('img').src=src;markDirty();toast('Đã chọn ảnh. Nhớ lưu ảnh trang chủ.');}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
async function homeGalleryUpload(input){const files=[...(input.files||[])];if(files.length+(S.siteDraft.gallery||[]).length>40){toast('Thư viện tối đa 40 ảnh; tổng dữ liệu tối đa 32 MB.',true);input.value='';return;}input.disabled=true;try{const g=[];for(const f of files)g.push({src:await optimizeImage(f),caption:'',title:''});S.siteDraft.gallery.push(...g);renderHomeGallery();markDirty();}catch(e){toast(errorMessage(e),true);}finally{input.disabled=false;input.value='';}}
async function saveAppearance(form){if(S.busy||!S.isAdmin)return;const fd=new FormData(form),d=S.siteDraft;$('#appearance-error').textContent='';if(!fd.has('rights')){$('#appearance-error').textContent='Vui lòng xác nhận quyền sử dụng ảnh.';return;}if((d.hero_image&&!String(fd.get('hero_caption')).trim())||(d.about_image&&!String(fd.get('about_caption')).trim())||d.gallery.some(g=>!g.caption?.trim())){$('#appearance-error').textContent='Vui lòng bổ sung chú thích / nguồn cho tất cả ảnh riêng.';return;}if(JSON.stringify(d.gallery).length>32000000){$('#appearance-error').textContent='Thư viện quá 32 MB. Hãy giảm ảnh trước khi lưu.';return;}const payload={hero_image:d.hero_image,hero_caption:fd.get('hero_caption'),about_image:d.about_image,about_caption:fd.get('about_caption'),gallery:d.gallery.map(g=>({...g,title:g.caption})),use_stock_gallery:fd.has('use_stock_gallery')};S.busy=true;setBusy(form,true);try{const rows=await api('/rest/v1/vmblog_site?id=eq.1&revision=eq.'+(S.site.revision||1),{auth:true,method:'PATCH',body:payload,headers:{Prefer:'return=representation'}});if(!rows?.length)throw new Error('Ảnh trang chủ đã thay đổi ở phiên khác. Hãy tải lại cấu hình trước khi lưu.');S.dirty=false;S.site=rows[0];await renderAdmin();toast('Đã cập nhật ảnh trang chủ cho mọi người cùng xem.');}catch(e){$('#appearance-error').textContent=errorMessage(e);}finally{S.busy=false;setBusy(form,false);}}

assList.toggle('reading-comfort');b.setAttribute('aria-pressed',document.body.classList.contains('reading-comfort'));}else if(a==='search-tag'){S.filter='Tất cả';S.search=b.dataset.value;S.limit=12;S.view='';location.hash='/cau-chuyen';}else if(a==='top')scrollTo({top:0,behavior:motionReduced()?'auto':'smooth'});else if(a==='retry-public'){await loadPublic();await route();}else if(a==='reload-route')await route();else if(a==='new-post')newPost();else if(a==='back-admin'){if(canDiscard()){S.editor=null;await renderAdmin();}}else if(a==='reload-admin'){if(canDiscard())await renderAdmin();}else if(a==='admin-tab'){if(canDiscard()){S.adminTab=b.dataset.value;S.editor=null;await renderAdmin(false);}}else if(a==='admin-filter'){S.adminFilter=b.dataset.value;renderAdminTab();}else if(a==='edit-post'){if(canDiscard()){const p=S.adminPosts.find(x=>x.id===b.dataset.id);if(p)openEditor(p);}}else if(a==='delete-post')await deletePost(b.dataset.id);else if(a==='preview-saved')previewSaved(b.dataset.id);else if(a==='format')formatEditor(b.dataset.format);else if(a==='preview-editor')previewEditor();else if(a==='remove-gallery'){S.editor.gallery.splice(Number(b.dataset.index),1);renderEditorGallery();markDirty();}else if(a==='clear-cover'){S.editor.cover_image='';$('#cover-preview').src=DATA.logo;$('#cover-url').value='';markDirty();}else if(a==='seed-posts')await seedPosts();else if(a==='backup')await backup();else if(a==='remove-home-gallery'){S.siteDraft.gallery.splice(Number(b.dataset.index),1);renderHomeGallery();markDirty();}else if(a==='reset-home-image'){const key=b.dataset.value;S.siteDraft[key+'_image']='';S.siteDraft[key+'_caption']='';const input=$(`[data-home-upload="${key}"]`);input.closest('.upload-area').querySelector('img').src=DATA.photos[key==='hero'?'hero':'departure'].src;$(`[name="${key}_caption"]`).value='';markDirty();}}catch(err){toast(errorMessage(err),true);}});

/* V3 motion: progressive enhancement; native scroll and keyboard navigation remain. */
const motionMedia = window.matchMedia("(prefers-reduced-motion: reduce)");
let pausedByReader = false;
try { pausedByReader = localStorage.getItem('vmvb-motion-paused') === '1'; } catch {}
function motionReduced() { return motionMedia.matches || pausedByReader; }
function syncMotion() {
  const paused = motionReduced();
  document.documentElement.classList.toggle('motion-paused', paused);
  $$('[data-motion-toggle]').forEach(b => {
    b.setAttribute('aria-pressed', String(paused));
    b.setAttribute('aria-label', paused ? 'Chuyển động đang tắt. Bấm để thay đổi tùy chọn.' : 'Tạm dừng chuyển động');
    const label = b.querySelector('[data-motion-label]');
    if (label) label.textContent = paused ? 'Hiệu ứng: Đã tắt' : 'Hiệu ứng: Đang bật';
    const glyph = b.querySelector('.motion-symbol');
    if (glyph) glyph.textContent = paused ? '▷' : 'Ⅱ';
  });
  if(paused && typeof HERO!=='undefined' && HERO.animation){HERO.animation.cancel();HERO.animation=null;const bg=$('.opening-backdrop');if(bg&&HERO.slides[HERO.index]){const s=HERO.slides[HERO.index];bg.innerHTML=img(s.photo,s.alt,'opening-background',true);}}
  if (paused) {
    $$('.reveal').forEach(el => el.classList.add('visible'));
    $$('[data-tilt],.story-card,.btn-magnetic').forEach(el => {
      ['--tilt-x','--tilt-y','--magnet-x','--magnet-y'].forEach(p => el.style.removeProperty(p));
    });
  }
  syncV6Motion();
}
function initInteractions(){syncMotion();updateFilmstripControls();setupV6Motion();}
function updateFilmstripControls(){
  const rail=$('#gallery-filmstrip');if(!rail)return;
  const max=rail.scrollWidth-rail.clientWidth;
  $$('[data-gallery-scroll]').forEach(b=>{
    b.disabled=Number(b.dataset.galleryScroll)<0?rail.scrollLeft<3:rail.scrollLeft>=max-3;
  });
  if(!rail.dataset.scrollBound){
    rail.dataset.scrollBound='1';
    rail.addEventListener('scroll',updateFilmstripControls,{passive:true});
  }
}
document.addEventListener('click', e=>{
  const motion=e.target.closest('[data-motion-toggle]');
  if(motion){
    e.preventDefault();
    if(motionMedia.matches){
      pausedByReader=true;toast('Thiết bị đang bật giảm chuyển động. Website tôn trọng cài đặt này.');
    }else{pausedByReader=!pausedByReader;}
    try{localStorage.setItem('vmvb-motion-paused',pausedByReader?'1':'0');}catch{}
    syncMotion();if(!motionReduced())observe();return;
  }
  const filter=e.target.closest('[data-topic]');
  if(filter){
    e.preventDefault();S.filter=filter.dataset.topic;S.search='';S.limit=12;
    if(location.hash!=='#/cau-chuyen')location.hash='#/cau-chuyen';else{renderStories();syncTabs();scrollTo({top:0,behavior:'instant'});}
  }
  const arrow=e.target.closest('[data-gallery-scroll]');
  if(arrow){
    e.preventDefault();const rail=$('#gallery-filmstrip');if(!rail)return;
    const first=rail.querySelector('.gallery-frame');
    rail.scrollBy({left:Number(arrow.dataset.galleryScroll)*((first?.offsetWidth||300)+25),behavior:motionReduced()?'auto':'smooth'});
  }
});
motionMedia.addEventListener?.('change',()=>{syncMotion();if(!motionReduced())observe();});
window.addEventListener('resize',updateFilmstripControls,{passive:true});


/* Motion V6: no scroll hijacking, no framework/CDN dependency.
   Native scroll, bounded FLIP transitions, one autoplay clock, lifecycle cleanup. */
const V6Motion={auto:true,elapsed:0,last:0,raf:0,hero:null,inView:false,hover:false,focus:false,io:null,pointerRAF:0};
function updateAutoButton(){
 const b=$('[data-hero-auto]');if(!b)return;const paused=!V6Motion.auto||motionReduced();

function canAutoPlay(){return V6Motion.auto&&V6Motion.inView&&!V6Motion.hover&&!V6Motion.focus&&!motionReduced()&&!document.hidden&&!$('#modal').open&&S.view==='home'&&V6Motion.hero?.isConnected;}
function wakeMotion(){
 if(V6Motion.raf||!canAutoPlay())return;V6Motion.last=0;V6Motion.raf=requestAnimationFrame(motionTick);
}
function motionTick(now){
 V6Motion.raf=0;if(!canAutoPlay()){V6Motion.last=0;return;}
 if(V6Motion.last)V6Motion.elapsed+=Math.min(80,now-V6Motion.last);
 V6Motion.last=now;
 const progress=$('#autoplay-progress');if(progress)progress.style.transform=`scaleX(${Math.min(1,V6Motion.elapsed/8000)})`;
 if(V6Motion.elapsed>=8000){V6Motion.elapsed=0;setHero(HERO.index+1,true,false);}
 V6Motion.raf=requestAnimationFrame(motionTick);
}

  $$('.btn').forEach(e=>{e.style.removeProperty('--mx');e.style.removeProperty('--my');});

function setupV6Motion(){

  V6Motion.io?.disconnect();cancelAnimationFrame(V6Motion.raf);V6Motion.raf=0;

  if('IntersectionObserver' in window){
   V6Motion.io=new IntersectionObserver(es=>es.forEach(e=>{
    V6Motion.inView=e.isIntersecting&&e.intersectionRatio>.15;root.classList.toggle('motion-visible',V6Motion.inView);
    if(V6Motion.inView)wakeMotion();

 }

function placeCard(p,i=0){return `<article class="v9-place reveal" id="place-${p.id}"><div class="v9-place-side"><span class="v9-place-code">HCM / ${String(R.places.indexOf(p)+1).padStart(2,'0')}</span><span class="v9-place-icon">${icon(p.icon)}</span><span>${esc(p.area)}</span><small>${esc(p.type)}</small></div><div class="v9-place-copy"><span class="pill">${esc(p.type)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><dl><div><dt>Địa chỉ theo nguồn</dt><dd>${esc(p.address)}<small>${esc(p.addressNote)}</small></dd></div><div><dt>Liên hệ</dt><dd>${p.phone?`<a href="tel:${p.phone}">${esc(p.phoneLabel)}</a>`:esc(p.phoneLabel)}${p.email?`<br><a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:''}</dd></div><div><dt>Số người được chăm sóc</dt><dd>${esc(p.population)}</dd></div></dl><div class="v9-place-suggestion"><strong>Gợi ý trao đổi — không phải danh sách đang kêu gọi</strong><p>${esc(p.suggestion)}</p></div><div class="v9-place-actions"><a class="btn btn-small" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+p.address)}" target="_blank" rel="noopener noreferrer">Tìm trên bản đồ ↗</a><button class="btn btn-small" data-copy-place="${p.id}">Sao chép địa chỉ</button><button class="btn btn-small" data-select-place="${p.id}" aria-pressed="${VS.selectedPlaces.includes(p.id)}">${VS.selectedPlaces.includes(p.id)?'Đã lưu vào kế hoạch':'Lưu vào kế hoạch'}</button></div><div class="v9-source-inline">${p.sources.map(k=>sourceLink(k,R.sources[k].title)).join('')}</div><small class="muted">Tra cứu ${R.checked} · Chưa xác nhận lịch thăm trực tiếp.</small></div></article>`;}
function placeResults(){let rows=R.places.filter(p=>(VS.placeFilter==='Tất cả'||p.type===VS.placeFilter)&&norm(p.name+' '+p.address+' '+p.type).includes(norm(VS.placeSearch)));$('#place-results').innerHTML=rows.map(placeCard).join('')||emptyHTML('Chưa có địa điểm phù hợp','Thử đổi từ khóa hoặc chọn nhóm khác.');$('#place-count').textContent=`${rows.length} / ${R.places.length} địa điểm trong danh bạ`;$$('[data-place-filter]').forEach(b=>{const on=b.dataset.placeFilter===VS.placeFilter;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);});observe();}
function renderPlaces(){S.view='places';$('#main').innerHTML=v9Head('Chỉ tại Thành phố Hồ Chí Minh','Một nơi để đến.<br><em>Một đầu mối để hỏi.</em>','Danh bạ tham khảo gồm cơ sở chăm sóc trẻ em, người cao tuổi và bệnh viện. Mỗi địa điểm có nguồn, tình trạng số liệu và gợi ý chuẩn bị riêng.','places-head')+`<section class="v9-location-intro"><div class="wrap v9-location-summary"><strong>${R.places.length}<small>địa điểm TP.HCM</small></strong><p>Không phải tất cả cơ sở đều là mái ấm từ thiện; bệnh viện, dưỡng lão tự nguyện và chăm sóc thay thế là các loại hình khác nhau. Danh bạ không xác nhận nơi nào đang tiếp nhận đoàn hoặc cần một loại quà cụ thể.</p></div></section><section class="section"><div class="wrap v9-directory-layout"><aside class="v9-directory-aside"><span class="eyebrow">Tìm theo nhu cầu</span><label class="field"><span>Tên, đường, khu vực</span><input id="place-search" type="search" value="${esc(VS.placeSearch)}" placeholder="Ví dụ: Gò Vấp, người cao tuổi"></label><div class="v9-filter-list">${['Tất cả','Trẻ em','Người cao tuổi','Bệnh viện'].map(t=>`<button class="chip" data-place-filter="${t}">${t}</button>`).join('')}</div><p id="place-count" role="status"></p><a class="text-link" href="#/dong-hanh">Xem kế hoạch đã lưu ↗</a><div class="v9-mini-note"><strong>Đừng bỏ qua chú thích</strong><p>Tên phường/quận cũ được giữ theo nguồn, không tự đổi. Chỗ chưa kiểm chứng được ghi rõ, không điền 0 hay số ước đoán.</p></div></aside><div id="place-results"></div></div></section>`+v9Section('Trước khi bấm mở bản đồ','Bốn câu hỏi <em>nên hỏi trước.</em>',v9Tiles([['Cổng nào, cơ sở nào?','Một tên tổ chức có thể có nhiều cơ sở. Xác nhận địa chỉ, tên người tiếp nhận và số điện thoại của đầu mối.'],['Nhóm được đến lúc nào?','Không coi giờ mở cửa trên bản đồ là lịch tiếp đoàn. Hỏi quy mô nhóm, thời lượng và hoạt động được phép.'],['Đang cần hỗ trợ gì?','Hỏi theo thời điểm: chủng loại, quy cách, số lượng và hạn dùng. Không tự suy từ một bài báo cũ.'],['Ảnh và ghi chép ra sao?','Thống nhất trước việc chụp ảnh, đăng bài, ghi nhận bàn giao và các nội dung không được công khai.']]))+v9Notice('Bản đồ mở kết quả tìm kiếm theo tên và địa chỉ; chưa xác minh ghim tọa độ hay tuyến đường. Không dùng danh bạ này thay xác nhận trực tiếp.')+cta();placeResults();}
function renderPediatric(){S.view='pediatric';const hs=R.places.filter(x=>x.type==='Bệnh viện');$('#main').innerHTML=`<section class="v9-pediatric-hero"><div class="wrap v9-split"><div><span class="eyebrow">Đồng hành cùng bệnh nhi · TP.HCM</span><h1>Để trong ngày<br>điều trị, vẫn có<br><em>một điều dịu dàng.</em></h1><p class="v9-lead">Không chỉ là một món quà. Đó còn là cách mình hỏi trước, chờ đúng lúc và để trẻ được nghỉ khi cần.</p><a class="btn btn-red" href="#/dia-diem">Xem đầu mối bệnh viện ↗</a></div><figure class="v9-portrait">${photo('hospital1','',true)}<figcaption>${esc(DATA.photos.hospital1.caption)}</figcaption></figure></div></section>`+v9Section('Bắt đầu từ đúng đầu mối','Hai địa chỉ y tế <em>tại TP.HCM.</em>',hs.map(placeCard).join(''))+v9Section('Khung chuẩn bị đề xuất','Một chuyến thăm tốt<br><em>bắt đầu trước ngày đến.</em>',`<div class="v9-timeline">${[['Liên hệ','Xin kết nối Phòng Công tác xã hội, nói rõ mục đích, số người dự kiến và loại hoạt động. Chưa có xác nhận thì chưa tổ chức đến.'],['Thống nhất','Hỏi giờ thăm, khoa, quy mô nhóm, điều kiện vệ sinh và danh mục đồ được tiếp nhận. Chỉ cán bộ bệnh viện quyết định điều phù hợp với bệnh nhi.'],['Chuẩn bị','Chia nhiệm vụ, kiểm kê theo danh sách đã thống nhất. Không tự chọn thuốc, thực phẩm bổ sung hay chế độ ăn cho trẻ.'],['Gặp gỡ','Để trẻ và gia đình chọn tham gia hoặc nghỉ. Không hỏi bệnh án, yêu cầu tạo dáng hay hứa hẹn kết quả điều trị.'],['Sau chuyến thăm','Gửi tổng hợp bàn giao tới đầu mối, xin duyệt nội dung có liên quan tới bệnh viện hoặc hình ảnh trẻ trước khi đăng.']].map(([t,d],i)=>`<article class="reveal"><span>${i+1}</span><div><h3>${t}</h3><p>${d}</p></div></article>`).join('')}</div>`,'v9-sky')+v9Section('Một cách nói nhẹ hơn','Động viên mà <em>không tạo thêm áp lực.</em>',`<div class="v9-phrases"><div><small>Thay vì hỏi</small><blockquote>“Sao con không cố hơn?”</blockquote><p>Không đánh giá nỗ lực hay cảm xúc của trẻ qua một buổi gặp.</p></div><div><small>Có thể nói</small><blockquote>“Con muốn vẽ một chút,<br>hay mình nghỉ nhé?”</blockquote><p>Một lời mời có quyền từ chối giúp cuộc gặp dễ chịu hơn.</p></div></div>`)+v9Section('Biết để đồng hành có trách nhiệm','Thông tin y tế và<br><em>giới hạn của việc thiện nguyện.</em>',`<div class="v9-editorial-columns"><p>Số ước tính 3.000–3.500 trường hợp ung thư trẻ em mỗi năm được Sức khỏe & Đời sống dẫn vào tháng 08/2026. Đây không phải số trẻ đang điều trị tại TP.HCM và không cho biết số trẻ ở một khoa vào ngày bạn đến.</p><p>Các hoạt động trên trang là gợi ý chuẩn bị, không phải hướng dẫn điều trị hay quy định chung của bệnh viện. Mọi hỗ trợ chăm sóc, ăn uống, vệ sinh và sinh hoạt cần theo hướng dẫn của cán bộ chuyên môn tại nơi tiếp nhận.</p></div>${sourceBox(['cancer','nhi2','ungbuou'])}`)+v9StoryBlock(['Bệnh nhi ung thư'],'Đọc thêm, <em>để hiểu hơn.</em>')+cta();observe();}
function renderElders(){S.view='elders';$('#main').innerHTML=`<section class="v9-elder-hero"><div class="wrap"><span class="eyebrow">Bên ông bà · TP.HCM</span><div class="v9-elder-title"><h1>Ngồi lại<br><em>thêm một chút.</em></h1><p>Có những món quà không nằm trong chiếc túi mang đến.<br>Chúng nằm ở khoảng thời gian mình chưa vội rời đi.</p></div><div class="v9-elder-photo">${photo('elder','',true)}<span>Một lời hỏi thăm.<br>Một người chịu lắng nghe.</span></div><p class="v9-image-credit">${esc(DATA.photos.elder.caption)}</p></div></section>`+v9Section('Biết nơi đến, hiểu người gặp','Những điểm kết nối <em>với người cao tuổi.</em>',R.places.filter(p=>p.type==='Người cao tuổi').map(placeCard).join(''))+v9Section('Khung buổi gặp — để cùng điều chỉnh','Không cần một sân khấu.<br><em>Cần một cuộc gặp vừa sức.</em>',`<div class="v9-program"><div><strong>01</strong><h3>Chào và hỏi</h3><p>Giới thiệu tên, xin phép trò chuyện. Hỏi người phụ trách về điều cần lưu ý trước khi hỗ trợ bất cứ việc gì.</p></div><div><strong>02</strong><h3>Chia thành nhóm nhỏ</h3><p>Gợi chuyện về sở thích, đọc một đoạn sách hoặc nghe một bài hát quen. Không buộc ông bà tham gia mọi hoạt động.</p></div><div><strong>03</strong><h3>Góp một việc vừa sức</h3><p>Thu dọn không gian chung hoặc hỗ trợ công việc được cơ sở giao. Không tự đỡ, bế hay di chuyển người hạn chế vận động.</p></div><div><strong>04</strong><h3>Chào bằng lời hẹn thật</h3><p>Chỉ hẹn điều nhóm chắc chắn làm được. Khi lịch thay đổi, báo lại với đầu mối thay vì để một lời hẹn bị quên.</p></div></div>`,'v9-ochre')+v9Section('Để lòng tốt được đón nhận','Những điều <em>nên mang theo.</em>',v9Tiles([['Sự kiên nhẫn','Nghe hết câu chuyện dù có thể bạn đã nghe một lần. Khoảng im lặng cũng có thể là một phần của cuộc trò chuyện.'],['Danh sách đã xác nhận','Mua đúng quy cách và số lượng cơ sở cần. Không tự mặc định mọi người cao tuổi dùng chung một loại sữa hoặc thực phẩm.'],['Quyền lựa chọn','Không chụp ảnh hoặc ghi âm khi chưa được đồng ý; để ông bà chọn cách xuất hiện, hoặc không xuất hiện.']]))+`<section class="v9-quiet-quote"><div class="wrap"><blockquote>Ông bà không chỉ là người<br>được chúng mình tới thăm.<br><em>Ông bà là cả một cuộc đời<br>đáng được lắng nghe.</em></blockquote><p>Thông điệp biên soạn của trang.</p></div></section>`+v9StoryBlock(['Bên ông bà'],'Những chuyện <em>muốn ngồi lại để đọc.</em>')+cta();observe();}
function renderData(){S.view='data';const share=(14200000/101112656*100).toFixed(1).replace('.',',');$('#main').innerHTML=v9Head('Việt Nam qua dữ liệu · có nguồn, có giới hạn','Đằng sau con số,<br><em>vẫn là một con người.</em>','Dữ liệu toàn quốc để hiểu bối cảnh. Danh bạ và địa điểm hành động của website chỉ tập trung tại TP.HCM. Không cộng các nhóm chồng lấn thành một tổng số người cần giúp.','data-head')+`<section class="v9-data-kpis"><div class="wrap"><div class="v9-fact-row">${v9Fact('14,2 triệu','người từ 60 tuổi trở lên','Mốc điều tra: 01/04/2024 · Việt Nam')}${v9Fact('3.000–3.500','trường hợp ung thư trẻ em/năm','Ước tính được dẫn: 02/08/2026')}${v9Fact('Chưa xác minh','tổng số người cơ nhỡ toàn quốc','Không dùng dân số cao tuổi thay thế')}</div><div class="v9-source-inline">${sourceLink('population','Nguồn dân số')} ${sourceLink('cancer','Nguồn ung thư nhi')}</div></div></section>`+
 v9Section('01 / Già hóa dân số','Già đi không đồng nghĩa<br><em>với không nơi nương tựa.</em>',`<div class="v9-data-split"><div class="v9-chart-card"><h3>Cơ cấu dân số theo nhóm tuổi</h3><p>Việt Nam · 01/04/2024 · đơn vị: %</p>${[['Dưới 15 tuổi',23.3],['15–64 tuổi',67.4],['Từ 65 tuổi',9.3]].map(([t,v],i)=>`<div class="v9-bar"><div><span>${t}</span><strong>${String(v).replace('.',',')}%</strong></div><div class="v9-bar-track"><i style="--bar:${v}%;--bar-tone:${i}"></i></div></div>`).join('')}<small>Nguồn: Điều tra dân số và nhà ở giữa kỳ 2024.</small></div><div class="v9-data-copy"><p class="eyebrow">Đọc đúng phạm vi</p><h3>${share}% dân số<br><em>từ 60 tuổi trở lên</em></h3><p>Tỷ trọng tính xấp xỉ từ 14,2 triệu người trên tổng dân số 101.112.656 người tại cùng mốc điều tra. Con số 14,2 triệu đã làm tròn nên tỷ lệ cũng là gần đúng.</p><p>Biểu đồ bên cạnh dùng ngưỡng <strong>65 tuổi</strong>, còn phép tính này dùng <strong>60 tuổi</strong>. Không lấy hai nhóm tuổi để thay thế hoặc so sánh như cùng một chỉ tiêu.</p><p>Không có căn cứ suy ra mọi người cao tuổi đều sống một mình, cần viện dưỡng lão hoặc thuộc nhóm bảo trợ xã hội.</p>${sourceLink('population')}</div></div>`)+
 v9Section('02 / Ung thư trẻ em','Một khoảng ước tính.<br><em>Không phải bảng đếm thời gian thực.</em>',`<div class="v9-estimate-band"><div><span>Khoảng ước tính toàn quốc</span><strong>3.000 <i>—</i> 3.500</strong><small>trường hợp ung thư trẻ em mỗi năm · theo nguồn tháng 08/2026</small></div><div><h3>Không phải số đang nằm viện</h3><p>Không phân bổ con số này cho từng tỉnh, từng bệnh viện hay từng ngày. Không suy ra số ca mới tại TP.HCM theo tỷ lệ dân số.</p><a href="#/benh-nhi" class="text-link">Tìm hiểu cách đồng hành ↗</a></div></div>${sourceBox(['cancer'])}`,'v9-data-light')+
 v9Section('03 / Khoảng trống thông tin','Chỗ chưa biết,<br><em>cần được để trống đúng cách.</em>',v9Tiles([['Người cơ nhỡ','Chưa xác minh được một tổng số quốc gia có định nghĩa, thời điểm và phạm vi đồng nhất. Website không tự đặt số.'],['Trẻ em có hoàn cảnh đặc biệt','Không dùng số 1,5 triệu từ những công bố cũ làm hiện trạng năm 2026. Chưa có chuỗi mới đủ cơ sở để biểu diễn xu hướng.'],['Số người tại từng cơ sở','Sức chứa, số giường, tổng số từng hỗ trợ và số người đang sống tại cơ sở là bốn đại lượng khác nhau. Chỉ ghi số kèm mốc của nguồn.']]))+
 v9Section('04 / Từ bối cảnh đến chuẩn bị','Dữ liệu giúp đặt <em>câu hỏi tốt hơn.</em>',`<div class="v9-table-wrap"><table class="v9-data-table"><thead><tr><th>Thông tin</th><th>Có thể sử dụng để</th><th>Không nên suy diễn</th></tr></thead><tbody><tr><td>Dân số cao tuổi</td><td>Hiểu bối cảnh nhu cầu chăm sóc dài hạn</td><td>Tất cả người cao tuổi đều neo đơn</td></tr><tr><td>Ước tính ung thư trẻ em/năm</td><td>Hiểu quy mô thách thức y tế</td><td>Số trẻ hiện có mặt trong một khoa</td></tr><tr><td>Số người trong bài cơ sở cũ</td><td>Làm đầu mối để hỏi lại</td><td>Số phần quà phải mua hôm nay</td></tr><tr><td>${R.places.length} mục của danh bạ</td><td>Chọn nơi để liên hệ tìm hiểu</td><td>Tổng số cơ sở trợ giúp tại TP.HCM</td></tr></tbody></table></div>`)+
 v9Section('05 / Nhật ký nguồn','Có thể mở nguồn.<br><em>Có thể đối chiếu.</em>',`<div class="v9-research-register"><p><strong>Ngày tra cứu:</strong> ${R.checked}. Đây là dữ liệu tĩnh được biên soạn, không tự cập nhật theo thời gian hay tự kết nối cơ sở dữ liệu quốc gia.</p><p><strong>Địa bàn:</strong> số liệu dân số và ung thư nhi có phạm vi toàn quốc; danh bạ địa điểm chỉ trong TP.HCM. Nguồn công khai không thay việc liên hệ cơ sở để xác nhận.</p><p><strong>Cách cập nhật:</strong> kiểm tra định nghĩa, đơn vị, năm tham chiếu và cơ quan công bố trước khi thay một con số. Giữ ghi chú nguồn cũ để truy vết.</p></div>${sourceBox(['population','cancer'])}<div class="center-actions"><a class="btn" href="#/dia-diem">Chuyển sang danh bạ TP.HCM ↗</a></div>`)+cta();observe();}

const s=V12.step,d=V12.draft;let body='';

if(s===2)body=`<p class="vol-step-help12">Chọn những việc vừa sức. Có thể trao đổi lại khi có hoạt động cụ thể.</p>${volChoices('interests','Bạn muốn đồng hành cùng *')}${volChoices('skills','Kỹ năng có thể đóng góp')}${volChoices('availability','Thời gian thuận tiện *')}${volSelect('participation','Hình thức tham gia',VO.participation)}<label class="field"><span>Một lời nhắn / kinh nghiệm (không bắt buộc)</span><textarea id="vol-motivation" name="motivation" maxlength="600" rows="4">${esc(d.motivation)}</textarea><small>Tối đa 600 ký tự. Không nhập bệnh án, giấy tờ hay hoàn cảnh riêng của người khác.</small></label>`;
if(s===3)body=`<p class="vol-step-help12">Đọc lại thông tin trước khi gửi. Có thể quay lại để sửa.</p>${volSummary(d)}<details class="vol-privacy-details12"><summary>Cách lưu và sử dụng thông tin</summary>${volPrivacy()}</details><label class="check-label vol-consent12"><input type="checkbox" id="vol-consent" name="consent" ${d.consent?'checked':''}><span>Tôi đã đọc và đồng ý để trang lưu, sử dụng thông tin nhằm xét đăng ký và liên hệ điều phối; không công khai liên hệ hay dùng để gửi quảng cáo. *</span></label><div id="vol-captcha12"></div><p id="vol-captcha-status12" class="small muted">${volReady()?'Sau khi đồng ý, hệ thống sẽ tải bước xác minh chống gửi rác.':'Chưa bật gửi trực tuyến.'}</p>`;
const titles=['Làm quen một chút','Bạn muốn góp điều gì?','Kiểm tra & gửi đăng ký'];

function volRead(){const f=$('#volunteer-form12');if(!f)return;const fd=new FormData(f);for(const k of ['full_name','phone','email','contact_method','area','organization','age_group','participation','motivation','website'])if(fd.has(k))V12.draft[k]=String(fd.get(k)).trim();if(V12.step===1)V12.draft.guardian_consent=V12.draft.age_group==='under18'&&fd.has('guardian_consent');if(V12.step===2)for(const k of ['interests','skills','availability'])V12.draft[k]=fd.getAll(k);if(V12.step===3)V12.draft.consent=fd.has('consent');}
function volNormalized(){const d=copy(V12.draft);delete d.website;d.phone=d.phone.replace(/[\s().-]/g,'').replace(/^\+84/,'0');d.email=d.email.toLowerCase();d.full_name=d.full_name.normalize('NFC');return d;}
function volValidate(step){const d=volNormalized(),e=[];if(step===1||step==='all'){
if(d.full_name.length<2||d.full_name.length>80)e.push(['full_name','Tên cần từ 2 đến 80 ký tự.']);
if(!d.phone&&!d.email)e.push(['phone','Cần ít nhất điện thoại hoặc email.']);
if(d.phone&&!/^0\d{9}$/.test(d.phone))e.push(['phone','Kiểm tra số Việt Nam: 10 chữ số hoặc dạng +84.']);
if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))e.push(['email','Kiểm tra lại email.']);
if(d.contact_method==='email'?!d.email:!d.phone)e.push([d.contact_method==='email'?'email':'phone','Bổ sung thông tin cho kênh liên hệ đã chọn.']);
if(!['adult','under18'].includes(d.age_group))e.push(['age_group','Chọn nhóm tuổi.']);
if(d.age_group==='under18'&&!d.guardian_consent)e.push(['guardian_consent','Cần xác nhận của người giám hộ.']);}
if(step===2||step==='all'){if(!d.interests.length)e.push(['interests','Chọn ít nhất một nhóm muốn đồng hành.']);if(!d.availability.length)e.push(['availability','Chọn thời gian thuận tiện hoặc Linh hoạt.']);if(d.motivation.length>600)e.push(['motivation','Lời nhắn tối đa 600 ký tự.']);}
if((step===3||step==='all')&&!d.consent)e.push(['consent','Cần sự đồng ý của bạn trước khi gửi.']);return e;}
function volErrors(errors){const box=$('#vol-errors12');if(!box)return;$$('[aria-invalid="true"]',$('#volunteer-form12')).forEach(x=>{x.removeAttribute('aria-invalid');x.removeAttribute('aria-describedby');});box.hidden=!errors.length;box.innerHTML=errors.length?'<strong>Vui lòng kiểm tra:</strong><ul>'+errors.map(([k,t])=>`<li>${esc(t)}</li>`).join('')+'</ul>':'';errors.forEach(([k])=>{const x=$('#vol-'+k);x?.setAttribute('aria-invalid','true');x?.setAttribute('aria-describedby','vol-errors12');});if(errors.length)box.focus();}
function removeCaptcha(){V12.epoch++;if(V12.widget!==null){try{window.turnstile?.remove(V12.widget);}catch{}}V12.widget=null;V12.token='';}
function loadCaptcha(){if(window.turnstile)return Promise.resolve();if(V12.loader)return V12.loader;V12.loader=new Promise((resolve,reject)=>{document.getElementById('turnstile-loader12')?.remove();const s=document.createElement('script');s.id='turnstile-loader12';s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;let finished=false;const fail=()=>{if(!finished){finished=true;V12.loader=null;s.remove();reject(new Error('CAPTCHA_LOAD'));}};const t=setTimeout(fail,12000);s.onload=()=>{if(!finished){finished=true;clearTimeout(t);resolve();}};s.onerror=()=>{clearTimeout(t);fail();};document.head.appendChild(s);});return V12.loader;}
async function mountCaptcha(){if(!volReady()||!V12.draft.consent||!$('#vol-captcha12')||V12.widget!==null)return;const epoch=++V12.epoch;try{await loadCaptcha();if(epoch!==V12.epoch||S.view!=='volunteer'||V12.step!==3||!V12.draft.consent)return;const status=$('#vol-captcha-status12');status.textContent='Hoàn thành xác minh chống gửi rác.';V12.widget=window.turnstile.render('#vol-captcha12',{sitekey:CONFIG.turnstileSiteKey,action:'volunteer_signup',theme:'light',size:'flexible',language:'vi',callback:token=>{if(epoch===V12.epoch){V12.token=token;status.textContent='Đã xác minh. Bạn có thể gửi đăng ký.';}},'expired-callback':()=>{if(epoch===V12.epoch){V12.token='';status.textContent='Xác minh hết hạn; vui lòng xác minh lại.';}},'error-callback':()=>{if(epoch===V12.epoch){V12.token='';status.innerHTML='Chưa xác minh được. <button type="button" class="text-link" data-v12="captcha-retry">Thử lại</button>';}}});}catch{if(epoch===V12.epoch&&$('#vol-captcha-status12'))$('#vol-captcha-status12').innerHTML='Không tải được xác minh. <button type="button" class="text-link" data-v12="captcha-retry">Thử lại</button>';}}
async function volSubmit(){if(V12.sending)return;volRead();const errors=volValidate('all');if(errors.length)return volErrors(errors);if(!volReady())return volErrors([['','Chưa bật tiếp nhận trực tuyến. Chưa gửi thông tin.']]);if(!V12.token)return volErrors([['','Vui lòng hoàn thành xác minh chống gửi rác.']]);if(V12.draft.website)return volErrors([['','Phiếu không hợp lệ.']]);
const app=volNormalized(),serialized=JSON.stringify(app);if(serialized!==V12.lastPayload||!V12.requestId){V12.requestId=crypto.randomUUID();V12.lastPayload=serialized;}V12.sending=true;S.busy=true;const form=$('#volunteer-form12');form.setAttribute('aria-busy','true');$$('button,input,select,textarea',form).forEach(x=>x.disabled=true);$('#vol-send12').textContent='Đang gửi...';volErrors([]);const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);
try{const r=await fetch(CONFIG.url.replace(/\/$/,'')+'/functions/v1/volunteer-signup',{method:'POST',headers:{apikey:CONFIG.key,'Content-Type':'application/json'},body:JSON.stringify({application:app,request_id:V12.requestId,turnstile_token:V12.token,website:''}),credentials:'omit',cache:'no-store',signal:ctrl.signal});let result;try{result=await r.json();}catch{throw new Error('SAVE_UNAVAILABLE');}if(!r.ok)throw new Error(result?.code||'SAVE_UNAVAILABLE');if(!/^TNV-[A-F0-9]{16}$/.test(result?.receipt)||!Number.isFinite(Date.parse(result?.created_at)))throw new Error('SAVE_UNAVAILABLE');V12.receipt={receipt:result.receipt,created_at:result.created_at};V12.draft=volEmpty();V12.lastPayload='';V12.requestId='';V12.dirty=false;volRender();}
catch(e){const msg=e.message==='RATE_LIMIT'?'Hệ thống đang giới hạn số phiếu. Thử lại sau hoặc nhắn fanpage.':e.message?.startsWith('CAPTCHA')?'Xác minh không còn hợp lệ. Xác minh lại rồi gửi.':['NOT_READY','ORIGIN_NOT_ALLOWED'].includes(e.message)?'Cấu hình tiếp nhận chưa sẵn sàng. Hãy liên hệ fanpage.':'Chưa nhận được xác nhận lưu. Nội dung vẫn còn; bạn có thể xác minh lại và gửi lại cùng phiếu để tránh tạo trùng.';volErrors([['',msg]]);removeCaptcha();mountCaptcha();}
finally{clearTimeout(timer);V12.sending=false;S.busy=false;if(form.isConnected){form.setAttribute('aria-busy','false');$$('button,input,select,textarea',form).forEach(x=>x.disabled=false);$('#vol-send12').textContent='Gửi đăng ký';}}}
function clearVolAdmin(){V12.seq++;V12.rows=[];V12.selected=null;V12.adminDirty=false;}

async function loadVolunteerAdmin(){if(!volAdminActive())return;const seq=++V12.seq;$('#vol-admin-result12').innerHTML='<p role="status">Đang tải hồ sơ riêng tư...</p>';const fields='id,receipt,full_name,phone,email,contact_method,area,organization,age_group,guardian_consent,interests,skills,availability,participation,motivation,consent_version,status,admin_note,created_at,updated_at,revision';let url='/rest/v1/vmblog_volunteers?select='+fields+'&order=created_at.desc,id.asc&limit=51&offset='+(V12.page*50);if(V12.filter!=='all')url+='&status=eq.'+encodeURIComponent(V12.filter);const q=V12.query.replace(/[^\p{L}\p{N}\s@.+_-]/gu,' ').trim();if(q){const term=q.replace(/[_%*]/g,' ');url+='&or='+encodeURIComponent('(full_name.ilike.*'+term+'*,email.ilike.*'+term+'*,phone.ilike.*'+term+'*,receipt.ilike.*'+term+'*)');}
try{const [rows,counts]=await Promise.all([api(url,{auth:true}),api('/rest/v1/rpc/vmblog_volunteer_counts',{auth:true,method:'POST',body:{}})]);if(seq!==V12.seq||!volAdminActive())return;if(!Array.isArray(rows))throw new Error('Dữ liệu trả về không hợp lệ.');V12.more=rows.length>50;V12.rows=rows.slice(0,50);$('#vol-admin-stats12').innerHTML=[['total','Tổng hồ sơ'],...Object.entries(VO.status)].map(([k,t])=>`<div><strong>${Number(counts[k]||0)}</strong><span>${t}</span></div>`).join('');$('#vol-admin-result12').innerHTML=V12.rows.length?`<div class="vol-admin-list12">${V12.rows.map(p=>`<article><div class="vol-avatar12" aria-hidden="true">${esc(p.full_name?.trim().slice(0,1)||'?')}</div><div class="vol-admin-copy12"><span class="pill ${p.status==='approved'?'green':'gray'}">${VO.status[p.status]||esc(p.status)}</span><h3>${esc(p.full_name)}</h3><p>${esc([p.phone,p.email].filter(Boolean).join(' / '))}</p><small>${esc(p.receipt)} · ${date(p.created_at,true)}</small><p class="small">${esc((p.interests||[]).map(k=>VO.interests[k]||k).join(' / '))}</p></div><button class="btn btn-small" data-v12="admin-detail" data-id="${p.id}">Xem & xử lý</button></article>`).join('')}</div><div class="vol-admin-paging12"><button class="btn btn-small" data-v12="admin-prev" ${V12.page===0?'disabled':''}>Trang trước</button><span>Trang ${V12.page+1} · ${V12.rows.length} hồ sơ</span><button class="btn btn-small" data-v12="admin-next" ${V12.more?'':'disabled'}>Trang sau</button></div>`:`<div class="empty-state"><h3>Chưa có hồ sơ phù hợp</h3><p>Thử đổi bộ lọc.</p></div>${V12.page?'<button class="btn btn-small" data-v12="admin-prev">Trang trước</button>':''}`;
}catch(e){if(seq!==V12.seq||!volAdminActive())return;V12.rows=[];$('#vol-admin-stats12').innerHTML='';$('#vol-admin-result12').innerHTML=`<div class="notice error"><strong>Chưa tải được hồ sơ</strong><p>${esc(errorMessage(e))}</p><p>Nếu mới nâng cấp, chạy <code>nang_cap_v12.sql</code>. Không tạo chính sách đọc công khai cho bảng này.</p></div>`;}}
function volDetail(id){if(!S.isAdmin)return;const p=V12.rows.find(x=>x.id===id);if(!p)return;V12.selected=copy(p);V12.adminDirty=false;modal('Hồ sơ tình nguyện viên',`<p class="small muted">${esc(p.receipt)} · Nhận ${date(p.created_at,true)} · Phiên bản ${p.revision}</p>${volSummary(p)}<p class="small muted">Đồng ý lưu thông tin: ${esc(p.consent_version)}. ${p.age_group==='under18'?'Cần trao đổi với người giám hộ trước khi xác nhận.':''}</p><form id="vol-admin-form12"><label class="field"><span>Trạng thái xử lý</span><select name="status">${Object.entries(VO.status).map(([k,l])=>`<option value="${k}" ${p.status===k?'selected':''}>${l}</option>`).join('')}</select></label><label class="field"><span>Ghi chú nội bộ</span><textarea name="admin_note" rows="4" maxlength="1500" placeholder="Việc đã trao đổi, bước tiếp theo. Không ghi bệnh án hay thông tin nhạy cảm.">${esc(p.admin_note||'')}</textarea></label><div id="vol-admin-error12" class="form-error" role="alert"></div><div class="form-actions"><button type="submit" class="btn btn-red">Lưu xử lý</button><button type="button" class="btn btn-danger" data-v12="admin-delete">Xóa vĩnh viễn</button></div><p class="small muted">Lưu không tự gửi email/SMS. Chỉ cho sửa trạng thái và ghi chú; thay đổi liên hệ cần xác minh với người đăng ký.</p></form>`,true);}
