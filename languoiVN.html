<script id="setup-sql" type="text/plain">-- VI MINH VA BAN - Schema v1.0
-- Run once in your own Supabase SQL Editor. Safe to run again.
-- This script only creates/changes tables prefixed vm_ and one vm-media bucket.
-- NEVER place a database password, secret key, or service_role key in the HTML.
begin;
create table if not exists public.vm_admins (
  user_id uuid primary key references auth.users(id) on delete cascade,
  created_at timestamptz not null default now()
);
alter table public.vm_admins enable row level security;
revoke all on public.vm_admins from anon, authenticated;
grant select on public.vm_admins to authenticated;
drop policy if exists vm_admin_self on public.vm_admins;
create policy vm_admin_self on public.vm_admins for select to authenticated using (user_id = (select auth.uid()));

create or replace function public.vm_is_admin()
returns boolean language sql stable security definer set search_path = ''
as $$ select exists (select 1 from public.vm_admins where user_id = (select auth.uid())); $$;
revoke all on function public.vm_is_admin() from public;
grant execute on function public.vm_is_admin() to anon, authenticated;

create table if not exists public.vm_settings (
  id text primary key default 'main' check (id='main'),
  title text not null default 'Vì mình và bạn là người Việt Nam',
  slogan text not null default 'Thấy ai khó, có chúng ta!',
  about text not null default 'Từ miền Nam, kết nối những tấm lòng Việt. Cùng sẻ chia với trẻ em đang điều trị ung thư, trẻ em mồ côi và người cao tuổi tại viện dưỡng lão.',
  email text not null default 'viminhvabanlanguoivietnam@gmail.com',
  facebook_url text not null default '',
  logo text not null default '',
  cover text not null default '',
  qr_url text not null default '',
  bank text not null default '',
  account_no text not null default '',
  account_holder text not null default '',
  transfer_note text not null default '',
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create table if not exists public.vm_posts (
  id uuid primary key default gen_random_uuid(),
  title text not null check (length(trim(title)) between 1 and 180),
  excerpt text not null default '',
  content text not null check (length(trim(content))>0),
  category text not null default 'Câu chuyện tử tế',
  author_display text not null default 'Ban quản trị',
  image text not null default '',
  status text not null default 'draft' check (status in ('draft','published')),
  is_sample boolean not null default false,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create table if not exists public.vm_campaigns (
  id uuid primary key default gen_random_uuid(),
  title text not null check (length(trim(title)) between 1 and 180),
  description text not null default '',
  target bigint not null default 0 check (target between 0 and 900000000000000),
  start_date date not null default current_date,
  end_date date,
  status text not null default 'draft' check (status in ('draft','active','paused','completed')),
  location text not null default '',
  image text not null default '',
  qr_url text not null default '',
  bank text not null default '',
  account_no text not null default '',
  account_holder text not null default '',
  transfer_note text not null default '',
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  check (end_date is null or end_date >= start_date)
);
create table if not exists public.vm_transactions (
  id uuid primary key default gen_random_uuid(),
  campaign_id uuid not null references public.vm_campaigns(id) on delete restrict,
  kind text not null check (kind in ('income','expense')),
  amount bigint not null check (amount between 1 and 900000000000000),
  happened_on date not null default current_date,
  public_name text not null default 'Ẩn danh',
  note text not null default '',
  reference text not null default '',
  proof_url text not null default '',
  status text not null default 'pending' check (status in ('pending','confirmed','void')),
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create unique index if not exists vm_tx_unique_reference on public.vm_transactions(reference) where reference <> '';
create index if not exists vm_tx_campaign_idx on public.vm_transactions(campaign_id);
create table if not exists public.vm_members (
  id uuid primary key default gen_random_uuid(),
  display_name text not null check (length(trim(display_name)) between 1 and 100),
  role text not null default 'Tình nguyện viên',
  bio text not null default '',
  photo text not null default '',
  joined_on date not null default current_date,
  published boolean not null default false,
  consent boolean not null default false,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  check (not published or consent)
);
create table if not exists public.vm_events (
  id uuid primary key default gen_random_uuid(),
  title text not null check (length(trim(title)) between 1 and 180),
  description text not null default '',
  location text not null default '',
  starts_at timestamptz not null,

create or replace function public.vm_touch()
returns trigger language plpgsql set search_path = '' as $$
begin
  if TG_OP='INSERT' then NEW.created_at := now();
  else NEW.created_at := OLD.created_at;
  end if;
  NEW.updated_at := now();
  return NEW;
end; $$;
create or replace function public.vm_audit_change()
returns trigger language plpgsql security definer set search_path = '' as $$
begin
  insert into public.vm_audit(entity,record_id,operation,actor,before_data,after_data)
  values (TG_TABLE_NAME, case when TG_OP='DELETE' then OLD.id::text else NEW.id::text end,
          TG_OP, auth.uid(),
          case when TG_OP='INSERT' then null else to_jsonb(OLD) end,
          case when TG_OP='DELETE' then null else to_jsonb(NEW) end);
  if TG_OP='DELETE' then return OLD; end if;
  return NEW;
end; $$;
revoke all on function public.vm_touch() from public;
revoke all on function public.vm_audit_change() from public;

function pager(current,total,action){
 if(total<=1)return '';
 return `<div class="pagination"><button class="btn btn-sm" data-action="${action}" data-page="${current-1}" ${current<=1?'disabled':''}>← Trước</button><span>Trang ${current} / ${total}</span><button class="btn btn-sm" data-action="${action}" data-page="${current+1}" ${current>=total?'disabled':''}>Tiếp →</button></div>`;
}

  else{activeAdmin=parts[1]||'overview';$('#main').innerHTML=adminView();}

function rerenderKeepingFocus(){
 const active=document.activeElement,id=active?.id,filter=active?.dataset?.filter;
 let start=null,end=null;try{start=active?.selectionStart;end=active?.selectionEnd;}catch{}
 render();
 const target=id?document.getElementById(id):filter?$(`[data-filter="${filter}"]`):null;
 if(target){target.focus({preventScroll:true});try{if(start!==null)target.setSelectionRange(start,end);}catch{}}
}


// --- Persistence and authentication ------------------------------------------------
async function refreshSession() {
 if(!session?.refresh_token)throw new Error('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
 if(refreshing)return refreshing;
 refreshing=(async()=>{
  const response=await fetch(CONFIG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CONFIG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token}),signal:AbortSignal.timeout(20000)});
  const result=await response.json();
  if(!response.ok){session=null;throw new Error('Phiên đăng nhập không còn hợp lệ. Vui lòng đăng nhập lại.');}
  session={...result,isAdmin:true,expires_at:Date.now()+result.expires_in*1000};
 })();
 try{await refreshing;}finally{refreshing=null;}
}
async function api(path,{method='GET',body,auth=true,headers:extra={}}={}) {
 if(auth&&session?.access_token&&session.expires_at<Date.now()+60000)await refreshSession();
 const headers={apikey:CONFIG.key,...extra};
 if(auth&&session?.access_token)headers.Authorization='Bearer '+session.access_token;
 let payload=body;
 if(body!==undefined&&!(body instanceof Blob)){headers['Content-Type']='application/json';payload=JSON.stringify(body);}
 let response;
 try{response=await fetch(CONFIG.url+path,{method,headers,body:payload,signal:AbortSignal.timeout(25000)});}catch{throw new Error('Không kết nối được máy chủ. Kiểm tra Internet, địa chỉ dự án và thử lại. Dữ liệu chưa được xác nhận là đã lưu.');}
 const text=await response.text();let result=null;try{result=text?JSON.parse(text):null;}catch{result=text;}
 if(!response.ok){
  if(response.status===401)throw new Error('Đăng nhập không hợp lệ hoặc phiên đã hết hạn. Kiểm tra tài khoản và mật khẩu.');
  if(response.status===403)throw new Error('Tài khoản chưa được cấp quyền quản trị hoặc chính sách truy cập chưa được thiết lập.');
  if(result?.code==='23505')throw new Error('Mã tham chiếu giao dịch đã tồn tại. Kiểm tra để tránh ghi nhận trùng.');
  if(result?.code==='23503')throw new Error('Bản ghi đang được liên kết với dữ liệu khác. Không thể xóa hoặc dùng mã quỹ không tồn tại.');
  if(response.status===429)throw new Error('Có quá nhiều yêu cầu. Vui lòng thử lại sau.');
  throw new Error(result?.message||result?.msg||result?.error_description||`Máy chủ trả lỗi ${response.status}. Kiểm tra cấu hình và bảng dữ liệu.`);
 }
 return result;
}
async function fetchAll(kind) {
 const out=[],size=500;
 for(let offset=0;;offset+=size){
  const rows=await api(`/rest/v1/vm_${kind}?select=*&order=created_at.desc&limit=${size}&offset=${offset}`);
  if(!Array.isArray(rows))throw new Error('Định dạng dữ liệu trả về không hợp lệ.');
  out.push(...rows);if(rows.length<size)break;
 }
 return out;
}
async function loadData({silent=false}={}){
 if(!online()){
  data=storeGet('data');
  if(!data){data=seedData();storeSet('data',data);}
  loadError='';lastSynced=stamp();if(!silent)render();return;
 }
 try {
  const loaded=await Promise.all(TABLES.map(fetchAll)),next={audit:[]};
  TABLES.forEach((k,i)=>next[k]=loaded[i]);
  if(isAdmin())next.audit=await api('/rest/v1/vm_audit?select=id,entity,record_id,operation,actor,created_at&order=created_at.desc&limit=100');
  data=next;loadError='';lastSynced=stamp();
 }catch(error){loadError=error.message;}
 if(!silent)render();
}
async function passwordHash(password,saltHex) {
 if(!crypto.subtle)throw new Error('Trình duyệt không hỗ trợ tạo tài khoản ở cách mở này. Hãy dùng Chrome/Edge mới hoặc mở qua localhost/HTTPS.');
 const salt=Uint8Array.from(saltHex.match(/.{2}/g),x=>parseInt(x,16));
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);
 return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function handleAuth(form){
 const fd=new FormData(form),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||'');
 if(online()){
  const result=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}});
  session={...result,isAdmin:false,expires_at:Date.now()+result.expires_in*1000};
  try{
   const admins=await api('/rest/v1/vm_admins?select=user_id&user_id=eq.'+encodeURIComponent(result.user.id));
   if(!admins.length)throw new Error('Tài khoản đã xác thực nhưng chưa được cấp quyền quản trị. Chủ dự án cần thêm tài khoản vào bảng vm_admins.');
   session.isAdmin=true;
  }catch(error){try{await api('/auth/v1/logout?scope=local',{method:'POST'});}catch{}session=null;throw error;}
 }else{
  const account=storeGet('account');
  if(form.dataset.creating==='true'){
   if(account)throw new Error('Tài khoản đã được tạo ở cửa sổ khác. Hãy mở lại màn hình đăng nhập.');
   if(password.length<10)throw new Error('Mật khẩu dùng thử cần ít nhất 10 ký tự.');
   if(password!==fd.get('confirm_password'))throw new Error('Hai mật khẩu chưa trùng nhau.');
   const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
   storeSet('account',{email,salt,hash:await passwordHash(password,salt)});
  }else{
   if(!account||email!==account.email||await passwordHash(password,account.salt)!==account.hash)throw new Error('Tài khoản hoặc mật khẩu chưa đúng.');
  }
  localAdmin=true;
 }
 await loadData({silent:true});$('#dialog').close();$('#dialog-body').replaceChildren();location.hash='#admin/overview';render();toast('Đã đăng nhập quản trị.');
}
async function logout(){
 let remoteFailed=false;
 if(online()&&session)try{await api('/auth/v1/logout?scope=local',{method:'POST'});}catch{remoteFailed=true;}
 session=null;localAdmin=false;$('#dialog').close();$('#dialog-body').replaceChildren();location.hash='#home';await loadData();
 toast(remoteFailed?'Đã xóa phiên trên trang này; chưa xác nhận thu hồi phiên ở máy chủ do lỗi kết nối.':'Đã đăng xuất.');
}
async function uploadDataURL(value) {
 if(!value.startsWith('data:'))return value;
 const blob=await (await fetch(value)).blob();
 const extension={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[blob.type];
 if(!extension)throw new Error('Định dạng ảnh không được hỗ trợ.');
 const path='images/'+uid()+'.'+extension;
 await api('/storage/v1/object/vm-media/'+path,{method:'POST',body:blob,headers:{'Content-Type':blob.type,'x-upsert':'false'}});
 return CONFIG.url+'/storage/v1/object/public/vm-media/'+path;
}
function auditLocal(kind,op,before,after){
 function brief(x){if(!x)return null;const y=clone(x);for(const k of ['image','logo','cover','qr_url','photo','proof_url'])if(y[k])y[k]='[Ảnh đã lưu]';if(y.content)y.content=y.content.slice(0,400);return y;}
 return {id:uid(),entity:'vm_'+kind,record_id:(after||before).id,operation:op,actor:storeGet('account')?.email||'Quản trị dùng thử',before_data:brief(before),after_data:brief(after),created_at:stamp()};
}
async function saveRecord(kind,record,version=''){
 if(!isAdmin())throw new Error('Vui lòng đăng nhập quản trị.');
 if(online()){
  const uploadFields=['image','logo','cover','qr_url','photo','proof_url'];
  for(const k of uploadFields)if(record[k]?.startsWith('data:'))record[k]=await uploadDataURL(record[k]);
  const existing=(data[kind]||[]).find(x=>x.id===record.id);
  const clean=clone(record);delete clean.created_at;delete clean.updated_at;
  if(existing){
   const result=await api(`/rest/v1/vm_${kind}?id=eq.${encodeURIComponent(record.id)}${version?'&updated_at=eq.'+encodeURIComponent(version):''}`,{method:'PATCH',body:clean,headers:{Prefer:'return=representation'}});
   if(!result?.length)throw new Error('Dữ liệu đã được người khác cập nhật hoặc bạn không còn quyền sửa. Hãy làm mới và kiểm tra lại trước khi lưu.');
  }else await api(`/rest/v1/vm_${kind}`,{method:'POST',body:clean,headers:{Prefer:'return=representation'}});
  await loadData({silent:true});if(loadError)toast('Đã gửi lệnh lưu nhưng chưa tải lại được danh sách. Hãy làm mới để kiểm tra.',true);
 }else{
  const current=storeGet('data',data),list=current[kind],index=list.findIndex(x=>x.id===record.id);
  const old=index>=0?list[index]:null;
  validateRecord(kind,record,current);
  if(old&&version&&old.updated_at!==version)throw new Error('Dữ liệu đã thay đổi ở cửa sổ khác. Hãy làm mới trước khi lưu.');
  const saved={...record,created_at:old?.created_at||stamp(),updated_at:stamp()};
  if(index>=0)list[index]=saved;else list.unshift(saved);
  current.audit=[auditLocal(kind,old?'UPDATE':'INSERT',old,saved),...(current.audit||[])].slice(0,200);
  storeSet('data',current);data=current;lastSynced=stamp();
 }
}
async function deleteRecord(kind,id){
 if(!isAdmin())throw new Error('Vui lòng đăng nhập.');
 if(kind==='transactions')throw new Error('Không xóa khoản thu – chi. Hãy chuyển sang trạng thái Đã hủy để giữ dấu vết.');
 const item=data[kind].find(x=>x.id===id);if(!item)return;
 if(kind==='campaigns'&&data.transactions.some(x=>x.campaign_id===id))throw new Error('Quỹ đã có thu – chi nên không thể xóa. Hãy chuyển quỹ sang Tạm dừng hoặc Đã kết thúc.');
 if(!confirm(`Xóa "${item.title||item.display_name}"? Thao tác này không thể hoàn tác trực tiếp. Bản ghi thay đổi vẫn được lưu trong nhật ký.`))return;
 if(online()){
  const result=await api(`/rest/v1/vm_${kind}?id=eq.${encodeURIComponent(id)}&updated_at=eq.${encodeURIComponent(item.updated_at)}`,{method:'DELETE',headers:{Prefer:'return=representation'}});
  if(!result?.length)throw new Error('Bản ghi đã thay đổi hoặc không còn quyền xóa. Hãy làm mới.');
  await loadData({silent:true});
 }else{
  const current=storeGet('data',data),actual=current[kind].find(x=>x.id===id);
  if(!actual||actual.updated_at!==item.updated_at)throw new Error('Bản ghi đã thay đổi ở cửa sổ khác. Hãy làm mới.');
  if(kind==='campaigns'&&current.transactions.some(x=>x.campaign_id===id))throw new Error('Quỹ đã có thu – chi, không thể xóa.');
  current[kind]=current[kind].filter(x=>x.id!==id);
  current.audit=[auditLocal(kind,'DELETE',actual,null),...(current.audit||[])].slice(0,200);storeSet('data',current);data=current;
 }
 render();toast('Đã xóa bản ghi.');
}
function options(list,value){return list.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('');}
function field(name,label,type,value='',opt={}){
 const attrs=`name="${name}" id="field-${name}" ${opt.required?'required':''} ${opt.maxlength?'maxlength="'+opt.maxlength+'"':''} ${opt.minlength?'minlength="'+opt.minlength+'"':''} ${opt.autocomplete?'autocomplete="'+opt.autocomplete+'"':''} ${opt.placeholder?'placeholder="'+esc(opt.placeholder)+'"':''}`;
 let input;
 if(type==='textarea')input=`<textarea ${attrs} rows="${opt.rows||4}">${esc(value)}</textarea>`;
 else if(type==='select')input=`<select ${attrs}>${options(opt.options||[],value)}</select>`;
 else if(type==='image')input=`<input type="hidden" name="${name}" value="${esc(value)}"><input type="file" id="field-${name}" data-image="${name}" accept="image/png,image/jpeg,image/webp"><div data-preview="${name}">${imageHTML(value,'preview-thumb',label)}</div><button type="button" class="btn btn-quiet btn-sm" data-action="clear-image" data-name="${name}">Gỡ ảnh</button>`;
 else input=`<input type="${type}" ${attrs} value="${esc(value)}" ${opt.inputmode?'inputmode="'+opt.inputmode+'"':''}>`;
 return `<div class="field ${opt.full?'full':''}"><label for="field-${name}">${esc(label)}${opt.required?' <span class="red">*</span>':''}</label>${input}${opt.help?`<small>${esc(opt.help)}</small>`:''}</div>`;
}

function vnDatetime(value){

function parseAmount(value,zero=false){
 const s=String(value).trim();
 if(!/^(?:\d+|\d{1,3}(?:[., ]\d{3})+)$/.test(s))throw new Error('Số tiền phải là số nguyên VND, không dùng số thập phân hoặc ký tự khác.');
 const n=Number(s.replace(/[., ]/g,''));
 if(!Number.isSafeInteger(n)||n<(zero?0:1)||n>900000000000000)throw new Error('Số tiền phải '+(zero?'không âm':'lớn hơn 0')+' và không vượt quá 900.000.000.000.000 VND.');
 return n;
}
function checkDate(value,label,required=true){
 if(!value&&!required)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||Number.isNaN(new Date(value+'T00:00:00Z').getTime())||new Date(value+'T00:00:00Z').toISOString().slice(0,10)!==value)throw new Error(label+' không hợp lệ.');
}
const allowedFields={
 settings:['id','title','slogan','about','email','facebook_url','logo','cover','qr_url','bank','account_no','account_holder','transfer_note'],
 posts:['id','title','excerpt','content','category','author_display','image','status','is_sample'],
 campaigns:['id','title','description','target','start_date','end_date','status','location','image','qr_url','bank','account_no','account_holder','transfer_note'],
 transactions:['id','campaign_id','kind','amount','happened_on','public_name','note','reference','proof_url','status'],
 members:['id','display_name','role','bio','photo','joined_on','published','consent'],
 events:['id','title','description','location','starts_at','status']
};
function validateRecord(kind,r,context=data){
 const isOneOf=(v,arr)=>arr.includes(v);
 for(const key of allowedFields[kind]){
  const value=r[key];
  if(['published','consent','is_sample'].includes(key)){if(typeof value!=='boolean')throw new Error('Dữ liệu lựa chọn có / không không hợp lệ.');}
  else if(['amount','target'].includes(key)){if(!['number','string'].includes(typeof value))throw new Error('Kiểu dữ liệu số tiền không hợp lệ.');}
  else if(key==='end_date'&&value===null){}
  else if(typeof value!=='string')throw new Error('Trường '+key+' thiếu hoặc sai kiểu dữ liệu.');
 }
 if(kind!=='settings'&&!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(r.id))throw new Error('Mã bản ghi không hợp lệ.');
 for(const [key,value] of Object.entries(r))if(typeof value==='string'&&value.length>15000000)throw new Error('Dữ liệu quá lớn.');
 for(const name of ['image','logo','cover','qr_url','photo','proof_url'])if(r[name]&&!safeURL(r[name],true))throw new Error('Đường dẫn hoặc định dạng ảnh không an toàn.');
 if(['posts','campaigns','events'].includes(kind)&&(!r.title?.trim()||r.title.length>180))throw new Error('Tiêu đề cần có nội dung và không quá 180 ký tự.');
 if(kind==='posts'){
  if(!r.content?.trim())throw new Error('Hãy nhập nội dung bài viết.');
  if(!isOneOf(r.status,['draft','published']))throw new Error('Trạng thái bài viết không hợp lệ.');
 }
 if(kind==='campaigns'){
  r.target=parseAmount(r.target,true);checkDate(r.start_date,'Ngày bắt đầu');checkDate(r.end_date,'Ngày kết thúc',false);
  if(r.end_date&&r.end_date<r.start_date)throw new Error('Ngày kết thúc không được trước ngày bắt đầu.');
  if(!isOneOf(r.status,['draft','active','paused','completed']))throw new Error('Trạng thái quỹ không hợp lệ.');
  r.end_date=r.end_date||null;
 }
 if(kind==='transactions'){
  r.amount=parseAmount(r.amount);checkDate(r.happened_on,'Ngày phát sinh');
  if(!context.campaigns.some(c=>c.id===r.campaign_id))throw new Error('Hãy chọn một quỹ đang tồn tại.');
  if(!isOneOf(r.kind,['income','expense'])||!isOneOf(r.status,['pending','confirmed','void']))throw new Error('Loại hoặc trạng thái thu – chi không hợp lệ.');
  if(r.happened_on>today())throw new Error('Không ghi nhận giao dịch thực tế ở ngày tương lai.');
  if(r.reference&&context.transactions.some(t=>t.id!==r.id&&t.reference===r.reference))throw new Error('Mã đối chiếu đã tồn tại. Hãy kiểm tra giao dịch trùng.');
  if(!r.public_name?.trim())r.public_name='Ẩn danh';
 }
 if(kind==='members'){
  if(!r.display_name?.trim())throw new Error('Hãy nhập tên người đồng hành.');
  if(r.published&&!r.consent)throw new Error('Cần có sự đồng ý trước khi hiển thị người đồng hành công khai.');
  checkDate(r.joined_on,'Ngày tham gia');
 }
 if(kind==='events'){
  if(!Number.isFinite(new Date(r.starts_at).getTime()))throw new Error('Thời gian hoạt động không hợp lệ.');
  if(!isOneOf(r.status,['draft','upcoming','completed','cancelled']))throw new Error('Trạng thái hoạt động không hợp lệ.');
 }
 if(kind==='settings'){
  if(r.id!=='main')throw new Error('Mã cài đặt không hợp lệ.');
  if(!r.title?.trim()||!r.slogan?.trim()||!r.about?.trim())throw new Error('Vui lòng nhập tên, khẩu hiệu và giới thiệu.');
  if(!/^[^@\s<>]+@[^@\s<>]+\.[^@\s<>]+$/.test(r.email))throw new Error('Email liên hệ chưa hợp lệ.');
  if(r.facebook_url&&!safeURL(r.facebook_url))throw new Error('Đường dẫn fanpage phải sử dụng HTTPS.');
 }
 return r;
}
async function handleEntity(form){
 const kind=form.dataset.kind,fd=new FormData(form),r={id:form.dataset.id};
 for(const k of allowedFields[kind]){if(k==='id')continue;if(['published','consent'].includes(k))r[k]=fd.has(k);else if(k==='is_sample')r[k]=false;else r[k]=String(fd.get(k)??'').trim();}
 if(kind==='events')r.starts_at=new Date(r.starts_at+':00+07:00').toISOString();
 validateRecord(kind,r);
 if(kind==='transactions'&&r.status==='confirmed'&&!fd.has('verified'))throw new Error('Cần xác nhận đã đối chiếu chứng từ trước khi công khai khoản thu – chi.');
 if(['campaigns','settings'].includes(kind)){
  const anyBank=r.qr_url||r.bank||r.account_no||r.account_holder;
  if(anyBank&&!(r.bank&&r.account_no&&r.account_holder))throw new Error('Hãy nhập đủ ngân hàng, số tài khoản và chủ tài khoản để tránh nhầm thông tin tiếp nhận. Có thể thêm QR sau.');
 }
 await saveRecord(kind,r,form.dataset.version);
 if($('#dialog').open)$('#dialog').close();$('#dialog-body').replaceChildren();render();toast('Đã lưu '+(online()?'vào dữ liệu dùng chung.':'trên trình duyệt này.'));
}
async function handleImage(input){
 const file=input.files?.[0];if(!file)return;
 const form=input.closest('form'),name=input.dataset.image;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)){input.value='';throw new Error('Chỉ nhận ảnh JPG, PNG hoặc WebP. Không nhận SVG hoặc tài liệu.');}
 if(file.size>5*1024*1024){input.value='';throw new Error('Ảnh vượt quá 5 MB. Hãy chọn ảnh nhỏ hơn.');}
 const temp=URL.createObjectURL(file);
 try{
  const im=new Image();im.src=temp;await im.decode();
  if(im.width>12000||im.height>12000||!im.width||!im.height)throw new Error('Kích thước ảnh không được hỗ trợ.');
  const qr=name==='qr_url',max=qr?Math.max(im.width,im.height):1600,ratio=Math.min(1,max/Math.max(im.width,im.height));
  const cv=document.createElement('canvas');cv.width=Math.round(im.width*ratio);cv.height=Math.round(im.height*ratio);
  const ctx=cv.getContext('2d');ctx.drawImage(im,0,0,cv.width,cv.height);
  const value=qr?cv.toDataURL('image/png'):cv.toDataURL('image/webp',.88);
  if(value.length>6500000)throw new Error('Ảnh sau xử lý quá lớn. Hãy dùng ảnh nhỏ hơn.');
  form.elements[name].value=value;$(`[data-preview="${name}"]`,form).innerHTML=imageHTML(value,'preview-thumb','Ảnh đã chọn');
 }finally{URL.revokeObjectURL(temp);}
}

 return `<tr><td><strong>${esc(title)}</strong><span class="sub">${esc(detail)}</span></td><td>${second}</td><td>${badge(kind,x)}</td><td><div class="row-actions"><button class="btn btn-sm" data-action="edit" data-kind="${kind}" data-id="${x.id}">Sửa</button>${kind==='transactions'?'':`<button class="btn btn-sm btn-danger" data-action="delete" data-kind="${kind}" data-id="${x.id}">Xóa</button>`}</div></td></tr>`;
 }).join('')}</tbody></table></div>`:empty('Chưa có bản ghi phù hợp','Thêm nội dung mới hoặc thay đổi từ khóa tìm kiếm.')}
 ${pager(filters.adminPage,pages,'admin-page')}`;

function guideHTML(){
 return `<div class="notice warning"><strong>Hai chế độ khác nhau.</strong> Mở file trực tiếp là bản dùng thử: dữ liệu và tài khoản chỉ nằm trong trình duyệt. Muốn khách ở các máy khác xem cùng bài viết và chỉ quản trị viên được sửa, cần kết nối Supabase rồi đưa HTML lên hosting HTTPS. Chưa có tài khoản hoặc máy chủ nào được tạo tự động cho bạn.</div>
 <h3>Dùng thử ngay trên máy</h3><p>Mở HTML bằng Chrome hoặc Edge → chọn <strong>Đăng nhập</strong> → tự đặt email và mật khẩu dùng thử → vào Quản trị. Thêm quỹ, bài viết, thu – chi, nhân sự và QR. Khách chưa đăng nhập chỉ thấy phần công khai của dữ liệu trên cùng trình duyệt.</p>
 <div class="help-step"><div class="step-number">1</div><div><h4>Tạo nguồn dữ liệu riêng</h4><p>Tạo một dự án Supabase của bạn. Trong SQL Editor, chạy đoạn SQL kèm file để tạo các bảng, chính sách phân quyền, kho ảnh và nhật ký. SQL chỉ thao tác trên các bảng bắt đầu bằng <code>vm_</code> và kho ảnh <code>vm-media</code>. Hãy kiểm tra chi phí và giới hạn dịch vụ của tài khoản trước khi vận hành.</p><div class="block-actions"><button class="btn btn-sm" data-action="download-sql">Tải SQL thiết lập</button><button class="btn btn-sm" data-action="copy-sql">Sao chép SQL</button></div><details><summary>Xem cấu trúc SQL</summary><pre>${esc(SQL)}</pre></details></div></div>
 <div class="help-step"><div class="step-number">2</div><div><h4>Tạo tài khoản và cấp quyền quản trị</h4><p>Tạo người dùng email/mật khẩu trong khu vực quản lý Authentication của dự án; xác nhận email nếu hệ thống yêu cầu. Tắt đăng ký công khai nếu không sử dụng. Sau đó chạy lệnh cấp quyền cho đúng email. Thêm nhân sự trên website không cấp quyền quản trị.</p><div class="field" style="margin-top:12px"><label for="admin-email">Email tài khoản đã tạo</label><input type="email" id="admin-email" value="${esc(DEFAULT_SETTINGS.email)}"></div><div class="block-actions"><button class="btn btn-sm" data-action="copy-admin-sql">Sao chép lệnh cấp quyền</button></div><p>Muốn thêm quản trị viên khác: tạo người dùng tương ứng và cấp quyền bằng cùng cách này. Đặt lại mật khẩu bằng hệ thống quản lý tài khoản Supabase; website không có đăng ký hoặc khôi phục mật khẩu công khai.</p></div></div>
 <div class="help-step"><div class="step-number">3</div><div><h4>Kết nối file HTML</h4><p>Nhập Project URL dạng <code>https://TEN-DU-AN.supabase.co</code> và <strong>publishable key</strong> (hoặc anon key cũ có vai trò <code>anon</code>). Tuyệt đối không đưa <code>secret</code>, <code>service_role</code> hoặc mật khẩu database vào HTML. Phân quyền ở máy chủ do RLS và bảng quản trị thực hiện.</p><div class="block-actions"><button class="btn btn-primary btn-sm" data-action="setup">Mở cấu hình kết nối</button></div><p>Dữ liệu thử không tự chuyển lên máy chủ. Sau khi kết nối, website dùng dữ liệu của dự án mới; đăng nhập bằng tài khoản được cấp quyền để tạo nội dung chính thức.</p></div></div>
 <div class="help-step"><div class="step-number">4</div><div><h4>Xuất một file và đưa lên hosting</h4><p>Chọn “Xuất index.html đã kết nối”, sau đó đưa file đó lên hosting tĩnh HTTPS của bạn. File đã chứa giao diện, avatar và ảnh bìa mặc định; không cần cài thư viện. Các bài viết và ảnh tải thêm được lưu tại Supabase.</p><div class="block-actions"><button class="btn btn-sm" data-action="export-html" ${!online()?'disabled':''}>Xuất index.html đã kết nối</button></div><p>Cấu hình kết nối trong bộ nhớ trình duyệt chỉ có tác dụng ở máy hiện tại; cần xuất file đã kết nối để người khác dùng đúng nguồn dữ liệu. Không đưa bản sao lưu JSON quản trị lên hosting.</p></div></div>
 <div class="help-step"><div class="step-number">5</div><div><h4>Kiểm tra trước khi tiếp nhận thật</h4><p>Mở bằng một trình duyệt khác: khách đọc được bài công khai, không đọc được bản nháp hoặc sửa dữ liệu; tài khoản chưa được cấp quyền không được quản trị. Thử thêm/sửa bài, tải ảnh, cập nhật QR, thu chờ xác nhận, thu đã xác nhận, chi và hủy giao dịch. Đối chiếu tài khoản ngân hàng, nội dung QR, quyền truy cập và sao lưu trước khi công bố.</p></div></div>
 <div class="notice"><strong>Cách tính thống kê.</strong> Tổng quyên góp = khoản thu đã xác nhận. Tổng chi = khoản chi đã xác nhận. Chênh lệch = thu − chi; không phải số dư ngân hàng. Trang công khai chỉ tính quỹ không ở trạng thái bản nháp. Người đồng hành chỉ tính nhân sự đã đồng ý và được công khai.</div>
 <div class="notice warning"><strong>Ảnh là dữ liệu công khai.</strong> Kho <code>vm-media</code> được đặt công khai, kể cả ảnh gắn trong bài nháp. Không tải hồ sơ bệnh án, giấy tờ định danh hoặc chứng từ gốc chưa che dữ liệu. Xóa một bài không tự xóa ảnh khỏi kho; cần quản lý ảnh thừa trong Storage. Khi khối lượng dữ liệu lớn, nên chuyển phần thống kê/phân trang xuống máy chủ và kiểm thử tải.</div>
 <h3>Những phần chưa được tích hợp</h3><p class="small muted">Không tự đọc giao dịch ngân hàng, không xác thực QR, không tự động đăng chéo lên Facebook, không tự gửi email, không có thanh toán trực tuyến, không tự sao lưu theo lịch. Không lưu mật khẩu quản trị trực tuyến trong HTML. Các chính sách an toàn cần được kiểm tra lại trên dự án thực tế.</p>
 <p class="small muted" style="margin-top:17px">Tài liệu kỹ thuật: <span class="help-links"><a href="https://supabase.com/docs/guides/auth/passwords" target="_blank" rel="noopener noreferrer">Auth</a> · <a href="https://supabase.com/docs/guides/api/securing-your-api" target="_blank" rel="noopener noreferrer">RLS / API</a> · <a href="https://supabase.com/docs/guides/getting-started/api-keys" target="_blank" rel="noopener noreferrer">API keys</a> · <a href="https://supabase.com/docs/guides/storage/security/access-control" target="_blank" rel="noopener noreferrer">Kho ảnh</a></span>.</p>`;
}
function setupModal(){
 modal('Kết nối dữ liệu trực tuyến',`<div class="notice warning">Chỉ nhập cấu hình của dự án do bạn quản lý. Không dùng khóa secret hoặc service_role. Cần chạy SQL thiết lập trước. Kết nối không tự chuyển dữ liệu dùng thử lên máy chủ.</div>
 <form id="config-form"><div class="form-error" role="alert"></div><div class="form-grid">${field('url','Project URL','url',CONFIG.url,{required:true,full:true,placeholder:'https://ten-du-an.supabase.co'})}${field('key','Publishable key / anon key','text',CONFIG.key,{required:true,full:true,placeholder:'sb_publishable_…',autocomplete:'off'})}</div><div class="form-actions"><button type="button" class="btn" data-action="guide">Xem hướng dẫn / SQL</button><button type="submit" class="btn btn-primary">Kiểm tra & kết nối</button></div></form>
 ${online()?`<div class="block-actions"><button class="btn btn-sm" data-action="export-html">Xuất HTML đã kết nối</button>${!EMBEDDED_CONFIG.url?'<button class="btn btn-quiet btn-sm" data-action="disconnect">Trở về bản dùng thử trên máy</button>':''}</div>`:''}`);
}
function validateConfig(url,key){
 url=url.trim().replace(/\/+$/,'');key=key.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url))throw new Error('Project URL phải có dạng https://ten-du-an.supabase.co, không kèm đường dẫn.');
 if(key.startsWith('sb_secret_'))throw new Error('Không được dùng secret key trong trình duyệt. Hãy dùng publishable key.');
 if(!key.startsWith('sb_publishable_')){
  try{const part=key.split('.')[1];const parsed=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/')));if(parsed.role!=='anon')throw new Error();}
  catch{throw new Error('Chỉ chấp nhận publishable key hoặc anon key cũ. Không dùng service_role.');}
 }
 if(key.length<20)throw new Error('API key chưa đầy đủ.');
 return {url,key};
}
async function handleConfig(form){
 const fd=new FormData(form),next=validateConfig(String(fd.get('url')),String(fd.get('key')));
 const previous={config:CONFIG,session,data,error:loadError};CONFIG=next;session=null;
 try{
  await loadData({silent:true});if(loadError)throw new Error(loadError);
  storeSet('config',next);localAdmin=false;$('#dialog').close();$('#dialog-body').replaceChildren();location.hash='#home';render();toast('Đã kết nối. Hãy đăng nhập bằng tài khoản Supabase đã được cấp quyền.');
 }catch(e){CONFIG=previous.config;session=previous.session;data=previous.data;loadError=previous.error;throw e;}
}
function download(name,content,type='text/plain;charset=utf-8'){
 const blob=content instanceof Blob?content:new Blob([content],{type});
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000);
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);}catch{
  const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.top='-10000px';document.body.append(t);t.select();
  if(!document.execCommand('copy')){t.remove();throw new Error('Trình duyệt không cho sao chép. Hãy chọn và sao chép nội dung trực tiếp.');}
  t.remove();
 }
 toast('Đã sao chép.');
}
function exportHTML(){
 if(!online())throw new Error('Cần kết nối dự án trực tuyến trước khi xuất file triển khai.');
 const doc=new DOMParser().parseFromString(ORIGINAL_HTML,'text/html');
 doc.querySelector('#app-config').textContent=JSON.stringify(CONFIG).replace(/</g,'\\u003c');
 download('index.html','<!doctype html>\n'+doc.documentElement.outerHTML,'text/html;charset=utf-8');
 toast('Đã xuất index.html với cấu hình dùng chung, không chứa mật khẩu hoặc phiên đăng nhập.');
}
function exportBackup(){
 if(!isAdmin())throw new Error('Cần đăng nhập để xuất bản sao lưu quản trị.');
 download('vmvb_sao_luu_'+today()+'.json',JSON.stringify({schema:'vmvb-backup-v1',exported_at:stamp(),source:online()?'online':'local',data},null,2),'application/json;charset=utf-8');
}
async function importBackup(file){
 if(online()||!isAdmin())throw new Error('Chỉ khôi phục bản dùng thử sau khi đăng nhập.');
 if(!file||file.size>20*1024*1024)throw new Error('Tệp sao lưu không hợp lệ hoặc vượt quá 20 MB.');
 let parsed;try{parsed=JSON.parse(await file.text());}catch{throw new Error('Tệp không phải JSON hợp lệ.');}
 if(parsed.schema!=='vmvb-backup-v1'||!parsed.data)throw new Error('Không đúng định dạng bản sao lưu của website.');
 const next={audit:[]};
 for(const kind of TABLES){
  const rows=parsed.data[kind];if(!Array.isArray(rows))throw new Error('Thiếu bảng '+kind+' trong bản sao lưu.');
  if(kind==='settings'&&rows.length!==1)throw new Error('Bản sao lưu phải có đúng một bản ghi cài đặt.');
  const ids=new Set();next[kind]=rows.map(r=>{
   if(!r||typeof r!=='object'||ids.has(r.id))throw new Error('Mã bản ghi trùng hoặc dữ liệu sai cấu trúc.');
   ids.add(r.id);const clean={};
   for(const k of allowedFields[kind])if(Object.hasOwn(r,k))clean[k]=r[k];
   for(const k of ['created_at','updated_at']){if(!Number.isFinite(new Date(r[k]).getTime()))throw new Error('Thiếu hoặc sai thời gian bản ghi.');clean[k]=r[k];}
   return clean;
  });
 }
 for(const kind of TABLES)for(const r of next[kind])validateRecord(kind,r,next);
 if(!confirm('Khôi phục sẽ THAY THẾ dữ liệu dùng thử đang có. Tài khoản được giữ nguyên. Bạn đã sao lưu và muốn tiếp tục?'))return;
 next.audit=[{id:uid(),entity:'local_backup',record_id:'all',operation:'IMPORT',actor:storeGet('account')?.email,created_at:stamp(),before_data:null,after_data:{source:parsed.source,exported_at:parsed.exported_at}}];
 storeSet('data',next);data=next;render();toast('Đã khôi phục dữ liệu trên trình duyệt này.');
}
function exportCSV(){
 const rows=filteredLedger(),headers=['Ngay phat sinh','Quy','Loai','So tien VND','Ten cong khai','Noi dung','Ma doi chieu','Chung tu cong khai'];
 const cell=value=>{let s=String(value??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 const all=[headers,...rows.map(t=>[t.happened_on,campaignName(t.campaign_id),t.kind==='income'?'Thu':'Chi',t.amount,t.public_name,t.note,t.reference,t.proof_url?.startsWith('https:')?t.proof_url:''])];
 download('vmvb_thu_chi_cong_khai_'+today()+'.csv','\ufeff'+all.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}


// --- Event wiring -----------------------------------------------------------------
let filterTimer=null,imageBusy=0;
document.addEventListener('click',async(event)=>{
 const el=event.target.closest('[data-action]');if(!el)return;
 if(el.tagName==='A')event.preventDefault();
 const action=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind;
 try{
  if(action==='close-dialog')closeModal();
  else if(action==='login')loginModal();
  else if(action==='admin')location.hash='#admin/overview';
  else if(action==='logout')await logout();
  else if(action==='guide')modal('Hướng dẫn sử dụng & triển khai',guideHTML());
  else if(action==='setup')setupModal();
  else if(action==='refresh'){await loadData();if(loadError)throw new Error(loadError);toast('Đã làm mới dữ liệu.');}
  else if(action==='edit')editRecord(kind,id);
  else if(action==='delete'){
   if(mutationBusy)return;mutationBusy=true;
   try{await deleteRecord(kind,id);}finally{mutationBusy=false;}
  }
  else if(action==='read-post'){if($('#dialog').open)$('#dialog').close();$('#dialog-body').replaceChildren();location.hash='#post/'+id;}
  else if(action==='share-post'){
   if(!online()||location.protocol==='file:'){await copyText(location.href.split('#')[0]+'#post/'+id);toast('Liên kết hiện chỉ dùng tại máy này. Cần đưa website lên hosting để chia sẻ cho người khác.');}
   else {const url=location.href.split('#')[0]+'#post/'+id;await copyText(url);}
  }
  else if(action==='fund-detail')showFund(id);
  else if(action==='fund-ledger'){filters.ledgerFund=id;filters.ledgerMonth='';filters.ledgerKind='';filters.ledgerPage=1;$('#dialog').close();$('#dialog-body').replaceChildren();location.hash='#transparency';render();}
  else if(action==='donate')showDonation(id);
  else if(action==='contact')contactModal();
  else if(action==='copy-email')await copyText(settings().email);
  else if(action==='copy-account'){const c=publicRecords('campaigns').find(x=>x.id===id);if(!c||!collecting(c))throw new Error('Quỹ hiện không tiếp nhận.');await copyText(paymentFor(c).account_no);}
  else if(action==='proof'){const t=publicRecords('transactions').find(x=>x.id===id);if(t?.proof_url)modal('Chứng từ đã công khai',imageHTML(t.proof_url,'article-image','Chứng từ thu chi')+'<p class="small muted">Chứng từ do quản trị viên cung cấp. Không phải xác nhận độc lập của website.</p>');}
  else if(action==='clear-ledger'){filters.ledgerFund='';filters.ledgerMonth='';filters.ledgerKind='';filters.ledgerPage=1;render();}
  else if(action==='post-page'){filters.postPage=Number(el.dataset.page);render();window.scrollTo({top:0});}
  else if(action==='ledger-page'){filters.ledgerPage=Number(el.dataset.page);render();}
  else if(action==='admin-page'){filters.adminPage=Number(el.dataset.page);render();}
  else if(action==='clear-image'){const form=el.closest('form'),name=el.dataset.name;form.elements[name].value='';const fi=$(`[data-image="${name}"]`,form);if(fi)fi.value='';$(`[data-preview="${name}"]`,form).innerHTML='';}
  else if(action==='backup')exportBackup();
  else if(action==='import')$('#backup-input').click();
  else if(action==='csv')exportCSV();
  else if(action==='download-sql')download('vmvb_supabase_setup.sql',SQL,'text/plain;charset=utf-8');
  else if(action==='copy-sql')await copyText(SQL);
  else if(action==='copy-admin-sql'){
   const scope=el.closest('#dialog-body')||$('#main'),email=$('#admin-email',scope)?.value.trim();
   if(!email||!/^[^@\s']+@[^@\s']+\.[^@\s']+$/.test(email))throw new Error('Hãy nhập đúng email tài khoản đã tạo.');
   await copyText(`insert into public.vm_admins(user_id)\nselect id from auth.users where lower(email)=lower('${email.replace(/'/g,"''")}')\non conflict do nothing;\n\n-- Verify the account exists and was granted access:\nselect a.user_id, u.email from public.vm_admins a\njoin auth.users u on u.id=a.user_id;`);
  }
  else if(action==='export-html')exportHTML();
  else if(action==='disconnect'){
   if(EMBEDDED_CONFIG.url)throw new Error('File này đã gắn cấu hình trực tuyến. Hãy dùng bản HTML ban đầu để dùng thử.');
   if(!confirm('Ngắt kết nối trên trình duyệt này? Dữ liệu trên máy chủ không bị xóa.'))return;
   if(session)try{await api('/auth/v1/logout?scope=local',{method:'POST'});}catch{}
   CONFIG={url:'',key:''};session=null;localAdmin=false;storeSet('config',CONFIG);$('#dialog').close();$('#dialog-body').replaceChildren();location.hash='#home';await loadData();
  }
  else if(action==='reset-local'){
   if(online()||!isAdmin())throw new Error('Chỉ dùng cho dữ liệu thử sau khi đăng nhập.');
   if(prompt('Nhập XOA DU LIEU THU để xác nhận. Dữ liệu chưa sao lưu sẽ mất.')!=='XOA DU LIEU THU')return;
   const next=seedData();storeSet('data',next);data=next;render();toast('Đã đặt lại dữ liệu dùng thử.');
  }
  else if(action==='audit-detail'){
   if(!isAdmin())throw new Error('Cần đăng nhập.');
   const a=online()?(await api('/rest/v1/vm_audit?id=eq.'+encodeURIComponent(id)+'&select=*'))[0]:data.audit.find(x=>x.id===id);
   if(!a)throw new Error('Không tìm thấy nhật ký.');
   modal('Chi tiết thay đổi',`<p class="small muted">${esc(a.entity)} · ${fmtDate(a.created_at,true)}</p><h3 style="margin-top:20px">Trước thay đổi</h3><pre>${esc(JSON.stringify(a.before_data,null,2))}</pre><h3>Sau thay đổi</h3><pre>${esc(JSON.stringify(a.after_data,null,2))}</pre>`);
  }
 }catch(error){toast(error.message||'Không thực hiện được thao tác.',true);}
});
document.addEventListener('submit',async(event)=>{
 const form=event.target;
 if(!['auth-form','entity-form','settings-form','config-form','contact-form'].includes(form.id))return;
 event.preventDefault();
 if(mutationBusy)return;
 if(imageBusy){formError(form,new Error('Ảnh đang được xử lý. Hãy đợi ảnh xem trước xuất hiện rồi lưu.'));return;}
 mutationBusy=true;
 const buttons=$$('button[type=submit]',form);buttons.forEach(b=>{b.disabled=true;b.dataset.label=b.textContent;b.textContent='Đang xử lý…';});
 const err=$('.form-error',form);if(err)err.textContent='';
 try{
  if(form.id==='auth-form')await handleAuth(form);
  else if(['entity-form','settings-form'].includes(form.id))await handleEntity(form);
  else if(form.id==='config-form')await handleConfig(form);
  else if(form.id==='contact-form'){
   const fd=new FormData(form),subject='[Vì mình và bạn] '+fd.get('topic'),body=`Xin chào,\n\nTên: ${fd.get('name')||'(Chưa cung cấp)'}\nKhu vực: ${fd.get('area')||'(Chưa cung cấp)'}\n\n${fd.get('message')}\n\nThấy ai khó, có chúng ta!`;
   location.href='mailto:'+encodeURIComponent(settings().email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
   toast('Đã yêu cầu mở ứng dụng email. Bạn cần tự kiểm tra và bấm Gửi trong ứng dụng email.');
  }
 }catch(error){formError(form,error);}
 finally{mutationBusy=false;buttons.forEach(b=>{b.disabled=false;b.textContent=b.dataset.label;});}
});
document.addEventListener('input',(event)=>{
 const el=event.target;if(!el.dataset.filter||el.tagName==='SELECT'||el.type==='month')return;
 clearTimeout(filterTimer);filterTimer=setTimeout(()=>{filters[el.dataset.filter]=el.value;filters.postPage=filters.ledgerPage=filters.adminPage=1;rerenderKeepingFocus();},180);
});
document.addEventListener('change',async(event)=>{
 const el=event.target;
 try{
  if(el.dataset.filter){filters[el.dataset.filter]=el.value;filters.postPage=filters.ledgerPage=filters.adminPage=1;rerenderKeepingFocus();}
  else if(el.id==='donation-fund'){$('#dialog-body').innerHTML=donationHTML(el.value);}
  else if(el.dataset.image){imageBusy++;try{await handleImage(el);}finally{imageBusy--;}}
  else if(el.id==='backup-input')await importBackup(el.files?.[0]);
 }catch(error){const form=el.closest('form');if(form)formError(form,error);else toast(error.message,true);}
});
$('#menu-toggle').addEventListener('click',()=>{const nav=$('#nav'),open=nav.classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',String(open));});
$('#dialog').addEventListener('close',()=>{if(!$('#dialog').open)$('#dialog-body').replaceChildren();});
$('#dialog').addEventListener('cancel',e=>{if(mutationBusy)e.preventDefault();});
$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
document.addEventListener('error',event=>{if(event.target?.tagName==='IMG'){event.target.alt='Không tải được ảnh';event.target.style.objectFit='contain';}},true);
let previousRoute=location.hash;
window.addEventListener('hashchange',()=>{
 if(previousRoute.split('/')[1]!==location.hash.split('/')[1]){filters.adminSearch='';filters.adminPage=1;}
 previousRoute=location.hash;$('#nav').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'instant'});
});
window.addEventListener('storage',event=>{
 if(!online()&&event.key===PREFIX+'data'){
  if($('#dialog').open||$('#settings-form'))toast('Dữ liệu vừa thay đổi ở cửa sổ khác. Hãy làm mới trước khi lưu để tránh ghi đè.',true);
  else{data=storeGet('data',data);render();}
 }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&online()&&!location.hash.startsWith('#admin')&&!$('#dialog').open)loadData();});
setInterval(()=>{if(online()&&document.visibilityState==='visible'&&!location.hash.startsWith('#admin')&&!$('#dialog').open&&!mutationBusy)loadData();},60000);
(async()=>{
 try{await loadData();}catch(error){loadError=error.message;render();}
})();

</script>
